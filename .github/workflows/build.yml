name: "Build and Push Docker Images"

# This reusable workflow handles Docker image builds and pushes to registries
# Supports both DockerHub and GHCR (GitHub Container Registry)
#
# Features:
# - Monorepo support with optional change detection via internal changed-paths composite
# - Multi-registry support (DockerHub and/or GHCR)
# - Platform strategy: beta/rc builds amd64 only, release builds amd64+arm64
# - Semantic versioning tags
# - GitOps artifacts upload for downstream gitops-update workflow
# - Helm chart dispatch for automatic version updates in Helm repositories

on:
  workflow_call:
    outputs:
      has_builds:
        description: 'Whether any components were detected for building (true/false). Use this to skip downstream jobs when no paths changed.'
        value: ${{ jobs.prepare.outputs.has_builds }}
      matrix:
        description: 'JSON array of the app matrix that was actually built this run (each entry {"name": ..., "working_dir": ...}). Empty array ("[]") when has_builds is false. Lets downstream jobs (e.g. per-component e2e) scope themselves to only what changed.'
        value: ${{ jobs.prepare.outputs.matrix }}
    inputs:
      runner_type:
        description: 'Runner to use for the workflow'
        type: string
        default: 'blacksmith-4vcpu-ubuntu-2404'
      build_runner_type:
        description: 'Optional runner override for the Build jobs only (prepare/notify stay on runner_type). Empty = vars.GENERAL_RUNNERS, then runner_type.'
        type: string
        default: ''
      filter_paths:
        description: 'Newline-separated list of path prefixes to filter. If not provided, builds from root.'
        type: string
        required: false
        default: ''
      shared_paths:
        description: 'Newline-separated path patterns (e.g., "go.mod\ngo.sum") that trigger a build for ALL components when matched by any changed file.'
        type: string
        required: false
        default: ''
      path_level:
        description: 'Limits the path to the first N segments (e.g., 2 -> "apps/agent")'
        type: string
        default: '2'
      enable_dockerhub:
        description: 'Enable pushing to DockerHub'
        type: boolean
        default: true
      enable_ghcr:
        description: 'Enable pushing to GitHub Container Registry'
        type: boolean
        default: true
      dockerhub_org:
        description: 'DockerHub organization name'
        type: string
        default: 'lerianstudio'
      ghcr_org:
        description: 'GHCR organization name (defaults to repository owner)'
        type: string
        default: ''
      on_existing_tag:
        description: 'Behaviour when the target image tag already exists in an enabled registry (checked before build): "fail" (abort early, default), "skip" (skip build/push when the tag exists in EVERY enabled registry, still emitting GitOps artifacts for an idempotent re-run; abort when only some registries have it), "repair" (same as skip, but on a partial publish build and push only to the registries missing the tag), or "warn" (warn and build anyway).'
        type: string
        default: 'fail'
      require_image_provenance:
        description: 'Under on_existing_tag "skip"/"repair", abort when the existing image does not record the commit it was built from (the org.opencontainers.image.revision label, emitted by docker/metadata-action). An image whose recorded commit differs from this run always aborts, regardless of this input. Set false to accept unverifiable images, e.g. tags published before the label was emitted.'
        type: boolean
        default: true
      dockerfile_name:
        description: 'Name of the Dockerfile'
        type: string
        default: 'Dockerfile'
      app_name:
        description: 'Override app/image name (single-app mode only, i.e. when filter_paths is empty). Defaults to repository name.'
        type: string
        required: false
        default: ''
      tag_prefix:
        description: 'Skip this build entirely (has_builds=false) when triggered by a tag that does not start with this prefix. Used by callers with multiple independently-tagged components sharing one workflow_call chain. Empty = build on every tag, as before.'
        type: string
        default: ''
      app_name_prefix:
        description: 'Prefix for app names in monorepo (e.g., "midaz" results in "midaz-agent")'
        type: string
        default: ''
      app_name_overrides:
        description: 'Explicit app name mappings in "path:name" format. Use "path:" for prefix-only. Overrides default extraction for matched paths.'
        type: string
        default: ''
      build_context:
        description: 'Docker build context (defaults to repository root for monorepo)'
        type: string
        default: '.'
      enable_gitops_artifacts:
        description: 'Enable GitOps artifacts upload for downstream gitops-update workflow'
        type: boolean
        default: false
      # Helm dispatch configuration
      enable_helm_dispatch:
        description: 'Enable dispatching to Helm repository for chart updates'
        type: boolean
        default: false
      helm_repository:
        description: 'Helm repository to dispatch to (org/repo format, e.g., LerianStudio/helm)'
        type: string
        default: 'LerianStudio/helm'
      helm_chart:
        description: 'Helm chart name to update'
        type: string
        default: ''
      helm_target_ref:
        description: 'Target branch in Helm repository (e.g., develop, main)'
        type: string
        default: 'main'
      helm_components_base_path:
        description: 'Base path for components in source repo (default: components)'
        type: string
        default: 'components'
      helm_env_file:
        description: 'Env example file name relative to component path (default: .env.example)'
        type: string
        default: '.env.example'
      helm_detect_env_changes:
        description: 'Whether to detect new environment variables for Helm'
        type: boolean
        default: true
      helm_dispatch_on_rc:
        description: 'Enable Helm dispatch for release-candidate (rc) tags'
        type: boolean
        default: false
      helm_dispatch_on_beta:
        description: 'Enable Helm dispatch for beta tags'
        type: boolean
        default: false
      helm_values_key_mappings:
        description: 'JSON mapping of component names to values.yaml keys. If not mapped, uses component name as fallback. Example: {"my-app": "api", "my-app-worker": "worker"}'
        type: string
        default: ''
      helm_legacy_patch_detection:
        description: 'Flag releases cut from maintenance branches as legacy patches, so the Helm side updates the matching legacy chart line instead of the mainline chart'
        type: boolean
        default: true
      helm_legacy_branch_patterns:
        description: 'Glob patterns (newline or comma separated) of branches that hold maintenance/patch lines. Example: maintenance/*'
        type: string
        default: 'maintenance/*'
      # Path normalization
      normalize_to_filter:
        description: 'Normalize changed paths to their filter path (e.g., components/app/cmd -> components/app). Recommended for monorepos to avoid duplicate builds.'
        type: boolean
        default: true
      force_full_matrix:
        description: 'When true, build all filter_paths components on every run regardless of what changed. Use for repos where components must always share the same image tag (e.g., auth + identity always released together).'
        type: boolean
        default: false
      force_multiplatform:
        description: 'Force multi-platform build (amd64+arm64) even for beta/rc tags'
        type: boolean
        default: false
      docker_build_args:
        description: 'Newline-separated Docker build arguments (e.g., "APP_NAME=spi\nCOMPONENT_NAME=api"). For sensitive values (tokens, keys, passwords), use BuildKit secrets instead — build arguments are visible in image history. Two more arguments are always appended after these: VERSION (the published image version) and BUILD_TIME (RFC3339 UTC); a Dockerfile declaring ARG VERSION / ARG BUILD_TIME gets them stamped in, one that declares neither is unaffected.'
        type: string
        required: false
        default: ''
      build_context_from_working_dir:
        description: 'Use the component working_dir as Docker build context instead of build_context. Useful for independent modules (e.g., tools with their own go.mod).'
        type: boolean
        default: false
      enable_cosign_sign:
        description: 'Sign container images with cosign keyless (OIDC) signing after push. Requires id-token: write permission in the caller.'
        type: boolean
        default: true
      cosign_max_attempts:
        description: 'Maximum cosign signing attempts per image reference. Increase to absorb transient OIDC/Fulcio/Rekor rate limits.'
        type: string
        default: '5'
      cosign_initial_delay:
        description: 'Initial delay (seconds) between cosign retries. Grows exponentially (×3) after each failed attempt, capped at cosign_max_delay, then randomized (equal jitter).'
        type: string
        default: '5'
      cosign_max_delay:
        description: 'Maximum delay (seconds) between cosign retries. Caps the exponential backoff before jitter is applied.'
        type: string
        default: '60'
      continue_gitops_on_signing_failure:
        description: 'When true, continue to GitOps artifact upload even if cosign signing fails after all retries. Image stays in registry unsigned and a warning is emitted; manual signing is required afterwards.'
        type: boolean
        default: false
      release_version:
        description: 'Explicit image version (semver, leading v optional). When set (e.g. same-run build after semantic-release on a branch push), used as the image tag instead of parsing the git tag from GITHUB_REF.'
        type: string
        default: ''
      checkout_ref:
        description: 'Git ref to build (e.g. the freshly-created release tag). Empty = the workflow run ref.'
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_builds: ${{ steps.set-matrix.outputs.has_builds }}
      platforms: ${{ steps.set-platforms.outputs.platforms }}
      is_release: ${{ steps.set-platforms.outputs.is_release }}
    steps:
      - name: Get changed paths (monorepo)
        if: inputs.filter_paths != ''
        id: changed-paths
        uses: LerianStudio/github-actions-shared-workflows/src/config/changed-paths@v1
        with:
          filter-paths: ${{ inputs.filter_paths }}
          shared-paths: ${{ inputs.shared_paths }}
          path-level: ${{ inputs.path_level }}
          get-app-name: 'true'
          app-name-prefix: ${{ inputs.app_name_prefix }}
          app-name-overrides: ${{ inputs.app_name_overrides }}
          normalize-to-filter: ${{ inputs.normalize_to_filter }}
          force-full-matrix: ${{ inputs.force_full_matrix }}

      - name: Set matrix
        id: set-matrix
        env:
          APP_NAME_INPUT: ${{ inputs.app_name }}
          REPO_NAME: ${{ github.event.repository.name }}
          FILTER_PATHS: ${{ inputs.filter_paths }}
          CHANGED_MATRIX: ${{ steps.changed-paths.outputs.matrix }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$TAG_PREFIX" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "matrix=[]" >> "$GITHUB_OUTPUT"
              echo "has_builds=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: tag_prefix '$TAG_PREFIX' is set, but this run is not a tag push (ref_type=$REF_TYPE) — a tag_prefix-scoped build only runs on its own matching tag, never on a branch-push rescue (build_on_release)."
              exit 0
            fi
            if [[ "$REF_NAME" != "$TAG_PREFIX"* ]]; then
              echo "matrix=[]" >> "$GITHUB_OUTPUT"
              echo "has_builds=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: ref '$REF_NAME' does not match tag_prefix '$TAG_PREFIX'"
              exit 0
            fi
          fi

          if [ -z "$FILTER_PATHS" ]; then
            # Single app mode - build from root
            APP_NAME="${APP_NAME_INPUT:-$REPO_NAME}"
            if [[ ! "$APP_NAME" =~ ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$ ]]; then
              echo "::error::Invalid app_name '${APP_NAME}'. Must match Docker image name rules: ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$"
              exit 1
            fi
            echo "matrix=[{\"name\": \"${APP_NAME}\", \"working_dir\": \".\"}]" >> "$GITHUB_OUTPUT"
            echo "has_builds=true" >> "$GITHUB_OUTPUT"
          else
            MATRIX="$CHANGED_MATRIX"
            if [ "$MATRIX" == "[]" ] || [ -z "$MATRIX" ]; then
              echo "matrix=[]" >> "$GITHUB_OUTPUT"
              echo "has_builds=false" >> "$GITHUB_OUTPUT"
            else
              echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
              echo "has_builds=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set platforms based on tag type
        id: set-platforms
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            if [ "${{ inputs.force_multiplatform }}" == "true" ]; then
              echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              echo "Building for amd64 and arm64 (beta/rc tag with force_multiplatform)"
            else
              echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              echo "Building for amd64 only (beta/rc tag)"
            fi
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Building for amd64 and arm64 (release tag)"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    runs-on: ${{ inputs.build_runner_type || vars.GENERAL_RUNNERS || inputs.runner_type }}
    name: Build ${{ matrix.app.name }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      # Trust model: this is a `workflow_call` reusable workflow, not triggered
      # by untrusted PRs. checkout_ref defaults to '' (the workflow run ref) for
      # every caller; the only caller that sets it (go-release.yml's
      # build_on_release feature) sources it from needs.release.outputs.new_release_git_tag
      # — a tag semantic-release just created earlier in the SAME run, never
      # from pull_request/fork-controlled data (CodeQL: actions/untrusted-checkout).
      # codeql[actions/untrusted-checkout] -- see trust-model comment above.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.checkout_ref }}   # empty string = default run ref
          persist-credentials: false

      - name: Set up QEMU
        if: contains(needs.prepare.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to DockerHub
        if: inputs.enable_dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_IMAGE_PUSH_TOKEN }}

      - name: Log in to GHCR
        if: inputs.enable_ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MANAGE_TOKEN }}

      - name: Normalize repository owner to lowercase
        id: normalize
        run: |
          echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set image names
        id: image-names
        env:
          GHCR_ORG_INPUT: ${{ inputs.ghcr_org }}
          OWNER_LOWER: ${{ steps.normalize.outputs.owner_lower }}
          ENABLE_DOCKERHUB: ${{ inputs.enable_dockerhub }}
          ENABLE_GHCR: ${{ inputs.enable_ghcr }}
          DOCKERHUB_ORG: ${{ inputs.dockerhub_org }}
          APP_NAME: ${{ matrix.app.name }}
        run: |
          IMAGES=""
          GHCR_ORG="$GHCR_ORG_INPUT"
          if [ -z "$GHCR_ORG" ]; then
            GHCR_ORG="$OWNER_LOWER"
          else
            GHCR_ORG=$(echo "$GHCR_ORG" | tr '[:upper:]' '[:lower:]')
          fi

          if [ "$ENABLE_DOCKERHUB" == "true" ]; then
            IMAGES="${DOCKERHUB_ORG}/${APP_NAME}"
          fi

          if [ "$ENABLE_GHCR" == "true" ]; then
            if [ -n "$IMAGES" ]; then
              IMAGES="${IMAGES},ghcr.io/${GHCR_ORG}/${APP_NAME}"
            else
              IMAGES="ghcr.io/${GHCR_ORG}/${APP_NAME}"
            fi
          fi

          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "ghcr_org=$GHCR_ORG" >> "$GITHUB_OUTPUT"

      - name: Resolve version and build timestamp
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            # Branch-push build (same run as semantic-release): no tag in GITHUB_REF.
            echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "Using explicit release version: $RELEASE_VERSION"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            # Strip app prefix by finding -v and extracting from there
            # e.g., agent-v1.0.0-beta.1 -> v1.0.0-beta.1
            # e.g., control-plane-v1.0.0-beta.1 -> v1.0.0-beta.1
            # shellcheck disable=SC2001
            VERSION=$(echo "$TAG" | sed 's/.*-\(v[0-9]\)/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Extracted version: $VERSION from tag: $TAG"
          fi

          # Build provenance timestamp, fed to the image as the BUILD_TIME build
          # argument below. Captured here (once per app, alongside the version it
          # is published with) so every layer of one image sees the same instant.
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "Build timestamp: $BUILD_TIME"

      - name: Pre-flight tag existence check
        id: preflight
        env:
          ON_EXISTING_TAG: ${{ inputs.on_existing_tag }}
          ENABLE_DOCKERHUB: ${{ inputs.enable_dockerhub }}
          ENABLE_GHCR: ${{ inputs.enable_ghcr }}
          DOCKERHUB_ORG: ${{ inputs.dockerhub_org }}
          GHCR_ORG: ${{ steps.image-names.outputs.ghcr_org }}
          APP_NAME: ${{ matrix.app.name }}
          VERSION: ${{ steps.version.outputs.version }}
          ALL_IMAGES: ${{ steps.image-names.outputs.images }}
          REQUIRE_PROVENANCE: ${{ inputs.require_image_provenance }}
        run: |
          set -uo pipefail

          MODE="${ON_EXISTING_TAG:-fail}"
          case "$MODE" in
            fail|skip|repair|warn) ;;
            *) echo "::error::Invalid on_existing_tag '$MODE' (must be: fail, skip, repair, warn)"; exit 1 ;;
          esac

          # Image tag matches what docker/metadata-action publishes (semver without leading 'v').
          TAG="${VERSION#v}"
          EXISTING=""
          EXISTING_REFS=""
          MISSING=""
          MISSING_IMAGES=""
          UNKNOWN=""
          ENABLED_COUNT=0
          EXISTING_COUNT=0

          # The commit an image was built from is recorded by docker/metadata-action's
          # default label set (org.opencontainers.image.revision), which this workflow
          # feeds to build-push-action. Reading it back is the only thing that tells a
          # genuine re-run of the same commit apart from a tag that was retargeted to a
          # newer one — tag existence alone cannot.
          #
          # `.Image` is a single image config for a single-platform tag and a
          # platform-keyed map for a multi-arch one, so the label is picked with a
          # recursive descent rather than a fixed path. Prints the revision, or nothing
          # when the lookup fails or the image carries no such label; the caller treats
          # both as "unverifiable".
          resolve_revision() {
            local ref="$1" out
            if out=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' 2>/dev/null); then
              printf '%s' "$out" | jq -r '[.. | objects | .Labels? | objects | .["org.opencontainers.image.revision"]? | strings] | first // empty'
            fi
          }

          # `docker manifest inspect` reuses the registry logins from earlier steps and
          # returns non-zero both when the tag is absent and when the lookup itself
          # fails, so the two are told apart by the registry's own error text. That
          # distinction carries weight now that "missing from this registry" drives
          # control flow: counting an unconfirmed registry as missing would make a
          # transient blip on one registry look exactly like a partial publish.
          #
          # An unrecognised error is deliberately "unknown" rather than "absent" —
          # guessing absent is the option that silently loses information.
          classify_tag() {
            local ref="$1" err
            if err=$(docker manifest inspect "$ref" 2>&1 >/dev/null); then
              printf 'present'
            elif printf '%s' "$err" | grep -qiE 'manifest unknown|manifest_unknown|no such manifest|not found|repository does not exist|pull access denied'; then
              printf 'absent'
            else
              printf 'unknown'
            fi
          }

          # Each enabled registry is tracked separately: a previous run can have
          # published to one registry and failed on the other, and "the tag is in
          # every enabled registry" and "the tag is in some of them" are different
          # situations that `skip` and `repair` must not conflate.
          if [ "$ENABLE_DOCKERHUB" = "true" ]; then
            ENABLED_COUNT=$((ENABLED_COUNT + 1))
            IMAGE="${DOCKERHUB_ORG}/${APP_NAME}"
            case "$(classify_tag "${IMAGE}:${TAG}")" in
              present)
                EXISTING="${EXISTING}${EXISTING:+, }docker.io/${IMAGE}:${TAG}"
                EXISTING_REFS="${EXISTING_REFS}docker.io/${IMAGE}:${TAG}"$'\n'
                EXISTING_COUNT=$((EXISTING_COUNT + 1))
                ;;
              absent)
                MISSING="${MISSING}${MISSING:+, }docker.io/${IMAGE}:${TAG}"
                MISSING_IMAGES="${MISSING_IMAGES}${MISSING_IMAGES:+,}${IMAGE}"
                ;;
              *)
                UNKNOWN="${UNKNOWN}${UNKNOWN:+, }docker.io/${IMAGE}:${TAG}"
                ;;
            esac
          fi
          if [ "$ENABLE_GHCR" = "true" ]; then
            ENABLED_COUNT=$((ENABLED_COUNT + 1))
            IMAGE="ghcr.io/${GHCR_ORG}/${APP_NAME}"
            case "$(classify_tag "${IMAGE}:${TAG}")" in
              present)
                EXISTING="${EXISTING}${EXISTING:+, }${IMAGE}:${TAG}"
                EXISTING_REFS="${EXISTING_REFS}${IMAGE}:${TAG}"$'\n'
                EXISTING_COUNT=$((EXISTING_COUNT + 1))
                ;;
              absent)
                MISSING="${MISSING}${MISSING:+, }${IMAGE}:${TAG}"
                MISSING_IMAGES="${MISSING_IMAGES}${MISSING_IMAGES:+,}${IMAGE}"
                ;;
              *)
                UNKNOWN="${UNKNOWN}${UNKNOWN:+, }${IMAGE}:${TAG}"
                ;;
            esac
          fi

          SHOULD_BUILD=true
          PARTIAL_EXISTING=false
          PUSH_IMAGES="$ALL_IMAGES"
          if [ -n "$EXISTING" ]; then
            case "$MODE" in
              fail)
                echo "::error::Tag ${TAG} already exists (${EXISTING}). Registry tags are immutable; aborting before rebuild. Use on_existing_tag: skip for idempotent re-runs."
                exit 1
                ;;
              skip|repair)
                # A registry whose status could not be determined is not evidence of a
                # partial publish, and treating it as one would turn a transient lookup
                # failure into an abort (`skip`) or a push to a registry that may already
                # hold the tag (`repair`). Stop on the unknown instead of guessing: the
                # state is unresolved rather than known-bad, and a re-run once the
                # registry answers is enough. Reached only when another registry did
                # confirm the tag — when nothing is confirmed there is simply a build.
                if [ -n "$UNKNOWN" ]; then
                  echo "::error::Could not determine whether tag ${TAG} exists in ${UNKNOWN} (the registry lookup failed rather than reporting the tag absent). on_existing_tag: ${MODE} needs every enabled registry's status to be known before reusing an existing tag. Re-run once the registry is reachable."
                  exit 1
                fi

                # Provenance gate. Both modes reuse an image that is already in the
                # registry, so an existing tag has to be proven to come from this commit
                # before it is honoured. Without this, a retargeted tag is skipped (GitOps
                # deploys the older image) or repaired (the registries end up holding
                # different content under one immutable tag).
                DIVERGED=""
                UNVERIFIABLE=""
                while IFS= read -r REF; do
                  [ -z "$REF" ] && continue
                  REV="$(resolve_revision "$REF")"
                  if [ -z "$REV" ]; then
                    UNVERIFIABLE="${UNVERIFIABLE}${UNVERIFIABLE:+, }${REF}"
                  elif [ "$REV" != "$GITHUB_SHA" ]; then
                    DIVERGED="${DIVERGED}${DIVERGED:+, }${REF} (built from ${REV})"
                  fi
                done <<< "$EXISTING_REFS"

                # A confirmed different commit is never a re-run, so it aborts even with
                # require_image_provenance disabled — that input only governs the
                # can't-tell case below.
                if [ -n "$DIVERGED" ]; then
                  echo "::error::Tag ${TAG} in the registry was not built from this commit: ${DIVERGED}; this run is at ${GITHUB_SHA}. Registry tags are immutable, so on_existing_tag: ${MODE} would publish the older image. Cut a new version instead of retargeting the tag."
                  exit 1
                fi
                if [ -n "$UNVERIFIABLE" ]; then
                  if [ "$REQUIRE_PROVENANCE" = "true" ]; then
                    echo "::error::Cannot verify that tag ${TAG} was built from this commit (${UNVERIFIABLE}): the image carries no org.opencontainers.image.revision label, or the lookup failed. Set require_image_provenance: false to accept unverifiable images, or cut a new version."
                    exit 1
                  fi
                  echo "::warning::Cannot verify that tag ${TAG} was built from this commit (${UNVERIFIABLE}) — proceeding because require_image_provenance is false."
                fi

                if [ "$EXISTING_COUNT" -eq "$ENABLED_COUNT" ]; then
                  echo "::warning::Tag ${TAG} already exists in every enabled registry (${EXISTING}) — skipping build/push (idempotent re-run)."
                  SHOULD_BUILD=false
                elif [ "$MODE" = "repair" ]; then
                  # Partial publish, repair opted in: build once and push only where the
                  # tag is missing, leaving the immutable tags already in place untouched.
                  echo "::warning::Tag ${TAG} exists in ${EXISTING} but is missing from ${MISSING} (partial publish) — repairing: building and pushing only to the missing registry/registries."
                  PARTIAL_EXISTING=true
                  PUSH_IMAGES="$MISSING_IMAGES"
                else
                  # Partial publish under `skip`. Skipping would emit GitOps artifacts for
                  # a tag that is absent from an enabled registry, so the run stops instead
                  # of publishing a reference that is not resolvable everywhere.
                  echo "::error::Tag ${TAG} exists in ${EXISTING} but is missing from ${MISSING} — partial publish. Skipping would emit GitOps artifacts for a tag that is absent from an enabled registry. Use on_existing_tag: repair to build and push only the missing registries, or cut a new version."
                  exit 1
                fi
                ;;
              warn)
                echo "::warning::Tag ${TAG} already exists (${EXISTING}) — building anyway (push may fail on immutable registries)."
                ;;
            esac
          else
            echo "Tag ${TAG} not present in enabled registries — proceeding with build."
          fi
          {
            echo "should_build=$SHOULD_BUILD"
            echo "partial_existing=$PARTIAL_EXISTING"
            echo "push_images=$PUSH_IMAGES"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        if: steps.preflight.outputs.should_build != 'false'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Every enabled registry, except under a partial-publish repair
          # (`on_existing_tag: repair`), where it narrows to the missing ones only.
          images: ${{ steps.preflight.outputs.push_images }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        if: steps.preflight.outputs.should_build != 'false'
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context_from_working_dir == true && matrix.app.working_dir || inputs.build_context }}
          file: ${{ matrix.app.working_dir }}/${{ inputs.dockerfile_name }}
          platforms: ${{ needs.prepare.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caller-supplied arguments first, then the release provenance pair this
          # workflow computes. A caller cannot pass VERSION itself: the version is
          # only known after semantic-release runs inside the release umbrella, well
          # after the static docker_build_args input is bound.
          #
          # Additive for every consumer: a Dockerfile that declares `ARG VERSION` /
          # `ARG BUILD_TIME` gets a stamped binary (e.g. via -ldflags -X or OCI
          # labels); one that declares neither is unaffected, because an undeclared
          # build argument only warns and does not invalidate build cache.
          #
          # The computed pair goes LAST so an empty docker_build_args leaves a blank
          # leading line (ignored by build-push-action) rather than a dangling one.
          build-args: |
            ${{ inputs.docker_build_args }}
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          sbom: generator=docker/scout-sbom-indexer:latest
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.MANAGE_TOKEN }}

      # ----------------- Cosign Image Signing -----------------
      # Lets `on_existing_tag: skip` retry just the signing step for an already-pushed
      # tag (e.g. after a transient cosign/Rekor failure) without a full rebuild.
      # Also runs after an `on_existing_tag: repair` partial publish, where the registry
      # that already carried the tag has its own (possibly different) digest to resolve.
      - name: Resolve digest for existing tag
        if: inputs.enable_cosign_sign && (steps.preflight.outputs.should_build == 'false' || steps.preflight.outputs.partial_existing == 'true')
        id: existing-digest
        env:
          APP_NAME: ${{ matrix.app.name }}
          VERSION: ${{ steps.version.outputs.version }}
          ENABLE_DOCKERHUB: ${{ inputs.enable_dockerhub }}
          ENABLE_GHCR: ${{ inputs.enable_ghcr }}
          DOCKERHUB_ORG: ${{ inputs.dockerhub_org }}
          GHCR_ORG: ${{ steps.image-names.outputs.ghcr_org }}
        run: |
          set -uo pipefail
          TAG="${VERSION#v}"

          # GitHub Actions parses every line of step output for workflow commands
          # (::warning::, ::error::, etc.). Registry inspect output is not
          # attacker-controlled here, but it could still contain newlines or a
          # stray "::" that would corrupt or spoof an annotation, so it's
          # percent-encoded into a single line before being embedded in one.
          escape_for_warning() {
            local s="$1"
            s="${s//%/%25}"
            s="${s//$'\r'/%0D}"
            s="${s//$'\n'/%0A}"
            printf '%s' "$s"
          }

          # Captures stdout and stderr separately (not merged) so any stderr
          # chatter on an otherwise-successful call (deprecation notices,
          # credential-helper output) can't corrupt the JSON fed to jq.
          #
          # Emits digest then "true"/"false" (lookup failed) on separate lines.
          # An empty digest is ambiguous by itself: it means either "tag
          # genuinely absent here" (fine, that registry is just skipped) or
          # "the lookup itself errored" (ambiguous — the tag may well exist
          # and just went unsigned). The caller needs that distinction to
          # avoid silently reporting success when a registry couldn't be
          # verified at all.
          resolve_digest() {
            local ref="$1"
            local out err digest="" failed="false"
            local err_file
            err_file="$(mktemp)"
            if out=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>"$err_file"); then
              digest=$(echo "$out" | jq -r '.digest // empty')
              [ -z "$digest" ] && echo "::warning::docker buildx imagetools inspect for ${ref} returned no digest — cosign will skip this registry." >&2
            else
              failed="true"
              err=$(cat "$err_file")
              echo "::warning::Failed to inspect ${ref} (registry lookup error, possibly transient) — cosign will skip signing for this registry: $(escape_for_warning "$err")" >&2
            fi
            rm -f "$err_file"
            printf '%s\n%s\n' "$digest" "$failed"
          }

          # Each registry is inspected independently: a tag can be immutable-blocked
          # in one registry but absent from another (e.g. a prior partial push), so
          # reusing one registry's digest for the other's ref would sign a
          # nonexistent (or wrong) reference.
          if [ "$ENABLE_DOCKERHUB" == "true" ]; then
            { read -r DH_DIGEST; read -r DH_FAILED; } < <(resolve_digest "${DOCKERHUB_ORG}/${APP_NAME}:${TAG}")
            echo "dockerhub_digest=$DH_DIGEST" >> "$GITHUB_OUTPUT"
            echo "dockerhub_lookup_failed=$DH_FAILED" >> "$GITHUB_OUTPUT"
          fi

          if [ "$ENABLE_GHCR" == "true" ]; then
            { read -r GHCR_DIGEST_OUT; read -r GHCR_FAILED; } < <(resolve_digest "ghcr.io/${GHCR_ORG}/${APP_NAME}:${TAG}")
            echo "ghcr_digest=$GHCR_DIGEST_OUT" >> "$GITHUB_OUTPUT"
            echo "ghcr_lookup_failed=$GHCR_FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Build cosign image references
        if: inputs.enable_cosign_sign
        id: cosign-refs
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          DOCKERHUB_DIGEST: ${{ steps.existing-digest.outputs.dockerhub_digest }}
          GHCR_DIGEST: ${{ steps.existing-digest.outputs.ghcr_digest }}
          DOCKERHUB_LOOKUP_FAILED: ${{ steps.existing-digest.outputs.dockerhub_lookup_failed }}
          GHCR_LOOKUP_FAILED: ${{ steps.existing-digest.outputs.ghcr_lookup_failed }}
          ENABLE_DOCKERHUB: ${{ inputs.enable_dockerhub }}
          ENABLE_GHCR: ${{ inputs.enable_ghcr }}
          DOCKERHUB_ORG: ${{ inputs.dockerhub_org }}
          APP_NAME: ${{ matrix.app.name }}
          GHCR_ORG: ${{ steps.image-names.outputs.ghcr_org }}
          PARTIAL_EXISTING: ${{ steps.preflight.outputs.partial_existing }}
        run: |
          REFS=""

          # A single build-push pushes the identical content to every enabled
          # registry, so DIGEST (from build-push) applies to both. When the build
          # was skipped (existing tag), fall back to each registry's own resolved
          # digest instead, and only emit a ref when that registry's digest was
          # actually found.
          #
          # A partial-publish repair is the exception: build-push only pushed to
          # the registry that was missing the tag, so its digest does not describe
          # the image the other registry already carries (a rebuild is not
          # bit-for-bit reproducible). Both registries use their own resolved
          # digest there, read back from the registry after the push.
          if [ "$PARTIAL_EXISTING" == "true" ]; then
            DOCKERHUB_FINAL="$DOCKERHUB_DIGEST"
            GHCR_FINAL="$GHCR_DIGEST"
          else
            DOCKERHUB_FINAL="${DIGEST:-$DOCKERHUB_DIGEST}"
            GHCR_FINAL="${DIGEST:-$GHCR_DIGEST}"
          fi

          if [ "$ENABLE_DOCKERHUB" == "true" ] && [ -n "$DOCKERHUB_FINAL" ]; then
            REFS="docker.io/${DOCKERHUB_ORG}/${APP_NAME}@${DOCKERHUB_FINAL}"
          fi

          if [ "$ENABLE_GHCR" == "true" ] && [ -n "$GHCR_FINAL" ]; then
            [ -n "$REFS" ] && REFS="${REFS}"$'\n'
            REFS="${REFS}ghcr.io/${GHCR_ORG}/${APP_NAME}@${GHCR_FINAL}"
          fi

          {
            echo "refs<<EOF"
            echo "$REFS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # A registry lookup error (as opposed to a confirmed-absent tag) means
          # that registry's image was never actually verified for signing, even
          # if the other enabled registry resolves fine and cosign succeeds for
          # it. Surface that as its own signal so the run isn't reported as a
          # clean success while one registry's image silently stayed unsigned.
          HAS_LOOKUP_ERROR="false"
          [ "$ENABLE_DOCKERHUB" == "true" ] && [ "$DOCKERHUB_LOOKUP_FAILED" == "true" ] && HAS_LOOKUP_ERROR="true"
          [ "$ENABLE_GHCR" == "true" ] && [ "$GHCR_LOOKUP_FAILED" == "true" ] && HAS_LOOKUP_ERROR="true"
          echo "has_lookup_error=$HAS_LOOKUP_ERROR" >> "$GITHUB_OUTPUT"

      - name: Sign container images with cosign
        if: inputs.enable_cosign_sign
        id: cosign-sign
        continue-on-error: ${{ inputs.continue_gitops_on_signing_failure || false }}
        uses: LerianStudio/github-actions-shared-workflows/src/security/cosign-sign@v1
        with:
          image-refs: ${{ steps.cosign-refs.outputs.refs }}
          max-attempts: ${{ inputs.cosign_max_attempts }}
          initial-delay: ${{ inputs.cosign_initial_delay }}
          max-delay: ${{ inputs.cosign_max_delay }}

      - name: Report cosign signing status
        if: >-
          !cancelled() &&
          inputs.enable_cosign_sign &&
          (steps.cosign-sign.outcome == 'failure' || steps.cosign-refs.outputs.has_lookup_error == 'true')
        env:
          REFS: ${{ steps.cosign-refs.outputs.refs }}
          APP_NAME: ${{ matrix.app.name }}
          SIGNING_FAILED: ${{ steps.cosign-sign.outcome == 'failure' }}
          HAS_LOOKUP_ERROR: ${{ steps.cosign-refs.outputs.has_lookup_error }}
        run: |
          echo "::warning::Cosign signing did not complete for every image of ${APP_NAME} — one or more images may still be unsigned."
          {
            echo "### ⚠️ Signing did not complete for every image — manual action required"
            echo ""
            echo "- **App:** \`${APP_NAME}\`"
            if [ "$HAS_LOOKUP_ERROR" == "true" ]; then
              echo "- **Note:** a registry lookup failed while resolving the existing tag's digest (see the ::warning:: above) — that registry's image was never verified or signed, even if signing succeeded for the other one."
            fi
            if [ "$SIGNING_FAILED" == "true" ]; then
              echo "- **Requested refs (each already includes its own digest):**"
              echo '```'
              echo "${REFS}"
              echo '```'
            fi
            echo ""
            echo "GitOps artifact upload was allowed to continue (\`continue_gitops_on_signing_failure: true\`)."
            echo "The image(s) above are immutable and already present in the registry, but signing did not complete for every one — some may already be signed, others may not be. Verify with \`cosign verify\` and run \`cosign sign\` manually against any ref that isn't before promoting to production."
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------- GitOps Artifacts -----------------
      - name: Create GitOps tag artifact
        if: inputs.enable_gitops_artifacts
        env:
          RAW_VERSION: ${{ steps.version.outputs.version }}
          APP_NAME: ${{ matrix.app.name }}
        run: |
          set -euo pipefail
          mkdir -p gitops-tags
          # Extract version without leading 'v'
          VERSION="${RAW_VERSION#v}"
          printf "%s" "$VERSION" > "gitops-tags/${APP_NAME}.tag"
          echo "Created artifact: gitops-tags/${APP_NAME}.tag with version: $VERSION"

      - name: Upload GitOps tag artifact
        if: inputs.enable_gitops_artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitops-tags-${{ matrix.app.name }}
          path: gitops-tags/

  # Slack notification
  notify:
    name: Notify
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.has_builds == 'true'
    uses: ./.github/workflows/slack-notify.yml
    with:
      status: ${{ needs.build.result }}
      workflow_name: "Build & Push Docker Images"
      failed_jobs: ${{ needs.build.result == 'failure' && 'Build' || '' }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Dispatch to Helm repository for chart updates
  # By default only runs on production releases (non-beta, non-rc tags)
  # Can be enabled for rc/beta via helm_dispatch_on_rc and helm_dispatch_on_beta inputs
  dispatch-helm:
    name: Dispatch Helm Update
    needs: [prepare, build]
    if: |
      inputs.enable_helm_dispatch &&
      needs.prepare.outputs.has_builds == 'true' &&
      needs.build.result == 'success' &&
      inputs.helm_chart != '' &&
      (
        needs.prepare.outputs.is_release == 'true' ||
        (contains(github.ref, '-rc') && inputs.helm_dispatch_on_rc) ||
        (contains(github.ref, '-beta') && inputs.helm_dispatch_on_beta)
      )
    uses: ./.github/workflows/dispatch-helm.yml
    with:
      helm_repository: ${{ inputs.helm_repository }}
      chart: ${{ inputs.helm_chart }}
      target_ref: ${{ inputs.helm_target_ref }}
      version: ${{ github.ref_name }}
      components_json: ${{ needs.prepare.outputs.matrix }}
      components_base_path: ${{ inputs.helm_components_base_path }}
      env_file: ${{ inputs.helm_env_file }}
      detect_env_changes: ${{ inputs.helm_detect_env_changes }}
      values_key_mappings: ${{ inputs.helm_values_key_mappings }}
      legacy_patch_detection: ${{ inputs.helm_legacy_patch_detection }}
      legacy_branch_patterns: ${{ inputs.helm_legacy_branch_patterns }}
      runner_type: ${{ inputs.runner_type }}
    secrets:
      helm_repo_token: ${{ secrets.HELM_REPO_TOKEN }}
