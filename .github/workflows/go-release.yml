name: "Go Release"

# Umbrella reusable workflow for Go service repositories.
# On branch pushes it runs semantic-release (gated by a non-doc change detector);
# on tag pushes it builds and pushes the container image and then updates the
# GitOps repository. A caller only needs to reference this single workflow.

on:
  workflow_call:
    inputs:
      runner_type:
        description: 'GitHub runner type to use'
        type: string
        default: 'blacksmith-4vcpu-ubuntu-2404'
      build_runner_type:
        description: 'Optional runner override for the Build jobs only (forwarded to build.yml; prepare/notify stay on runner_type). Empty = vars.GENERAL_RUNNERS, then runner_type.'
        type: string
        default: ''
      release_runner_type:
        description: 'Optional runner override for the Release (publish) jobs only (forwarded to release.yml as publish_runner_type). Empty = vars.GENERAL_RUNNERS, then runner_type.'
        type: string
        default: ''
      dry_run:
        description: 'Reserved. Downstream release/build/gitops workflows do not yet expose a dry-run mode.'
        required: false
        type: boolean
        default: false

      # ----------------- Change gate -----------------
      ignore_globs:
        description: 'Space-separated glob patterns treated as docs/meta; when only these change on a branch push, the release is skipped.'
        type: string
        default: '*.md docs/* .github/* LICENSE* .gitignore .coderabbit.yml .coderabbit.yaml'

      # ----------------- Release (release.yml) -----------------
      semantic_version:
        description: 'Semantic release version to use'
        type: string
        default: '23.0.8'
      enable_changelog:
        description: 'Generate CHANGELOG.md files via GPT after a successful release'
        type: boolean
        default: false
      enable_major_tag:
        description: 'Force-update the floating major version tag (e.g. v1) after a successful release'
        type: boolean
        default: false
      stable_releases_only:
        description: 'Only generate changelogs for stable releases (skip beta/rc/alpha tags)'
        type: boolean
        default: true
      changelog_bot_ignore_list:
        description: 'Space-separated list of GitHub login substrings to exclude from the changelog (bot authors). Logins ending in [bot] are always excluded. Extends the default list inside the gptchangelog composite action.'
        type: string
        default: ''
      prerelease_backmerge_sync_enabled:
        description: 'Merge main into a prerelease branch (develop/release-candidate) before calculating its next version. Defaults to false (opt-in) — set to true to enable this pre-version-calculation sync, which can skip/block a release on those branches when the merge cannot complete directly. The post-release backmerge on main after a stable release is unaffected by this input either way.'
        type: boolean
        default: false
      enable_release_announcement:
        description: 'Announce the published release to the repository Slack channel after a successful release'
        type: boolean
        default: true
      announcement_product_name:
        description: 'Product name displayed in the announcement. Defaults to the repository name.'
        type: string
        default: ''
      announcement_slack_channel:
        description: 'Slack channel that receives the announcement. Defaults to the RELEASE_SLACK_CHANNEL repository variable; the announcement is skipped when both are empty.'
        type: string
        default: ''

      # ----------------- Build (build.yml) -----------------
      enable_dockerhub:
        description: 'Enable pushing to DockerHub'
        type: boolean
        default: true
      enable_ghcr:
        description: 'Enable pushing to GitHub Container Registry'
        type: boolean
        default: true
      enable_gitops_artifacts:
        description: 'Enable GitOps artifacts upload for the downstream gitops-update job'
        type: boolean
        default: false
      app_name:
        description: 'Override app/image name. Used by the build (single-app mode) and as the gitops-update deploy name; when empty the gitops deploy name falls back to app_name_prefix, then the repository name.'
        type: string
        default: ''
      tag_prefix:
        description: 'Restrict the primary release/build jobs to tags starting with this prefix (e.g. "v"). Use when the repository also pushes tags for an unrelated component (e.g. via an extra_builds group with its own tag_prefix) so the primary jobs do not react to that component''s tags. Empty = react to every tag, preserving current behavior.'
        type: string
        default: ''
      docker_build_args:
        description: 'Newline-separated Docker build arguments (e.g., "APP_NAME=spi"). Use BuildKit secrets for sensitive values. build.yml always appends VERSION (the computed release version) and BUILD_TIME (RFC3339 UTC) after these, for the primary build and every extra_builds group — the release version cannot be supplied here because semantic-release computes it inside this workflow.'
        type: string
        default: ''
      enable_cosign_sign:
        description: 'Sign container images with cosign keyless (OIDC) signing after push'
        type: boolean
        default: true
      cosign_max_attempts:
        description: 'Maximum cosign signing attempts per image reference. Increase to absorb transient OIDC/Fulcio/Rekor rate limits. Forwarded to build.yml.'
        type: string
        default: '5'
      cosign_initial_delay:
        description: 'Initial delay (seconds) between cosign retries. Grows exponentially (×3) after each failed attempt, capped at cosign_max_delay, then randomized (equal jitter). Forwarded to build.yml.'
        type: string
        default: '5'
      cosign_max_delay:
        description: 'Maximum delay (seconds) between cosign retries. Caps the exponential backoff before jitter is applied. Forwarded to build.yml.'
        type: string
        default: '60'
      continue_gitops_on_signing_failure:
        description: 'When true, continue to GitOps artifact upload even if cosign signing fails after all retries. The image stays in the registry unsigned and a warning is emitted; manual signing is required afterwards. Forwarded to build.yml.'
        type: boolean
        default: false
      app_name_prefix:
        description: 'Prefix for app names in monorepo (e.g., "midaz" -> "midaz-agent")'
        type: string
        default: ''
      app_name_overrides:
        description: 'Explicit app name mappings in "path:name" format. Overrides default extraction for matched paths.'
        type: string
        default: ''
      dockerhub_org:
        description: 'DockerHub organization name'
        type: string
        default: 'lerianstudio'
      path_level:
        description: 'Directory depth level to extract app name (e.g., 2 -> "apps/agent")'
        type: string
        default: '2'
      build_context_from_working_dir:
        description: 'Use the component working_dir as Docker build context instead of the repo root.'
        type: boolean
        default: false
      enable_helm_dispatch:
        description: 'Dispatch to the Helm repository for chart updates after build'
        type: boolean
        default: false
      helm_chart:
        description: 'Helm chart name to update (required when enable_helm_dispatch is true)'
        type: string
        default: ''
      helm_repository:
        description: 'Helm repository to dispatch to (org/repo format). The HELM_REPO_TOKEN secret must grant Actions: read and write on it. Applies to every build, including extra_builds groups — there is no per-group override, because a single token is forwarded to all of them.'
        type: string
        default: 'LerianStudio/helm'
      helm_detect_env_changes:
        description: 'Detect new environment variables for Helm during dispatch'
        type: boolean
        default: true
      helm_values_key_mappings:
        description: 'JSON mapping of component names to values.yaml keys (e.g., {"my-app": "api"})'
        type: string
        default: ''
      helm_legacy_patch_detection:
        description: 'Flag releases cut from maintenance branches as legacy patches, so the Helm side updates the matching legacy chart line instead of the mainline chart. Set to false to keep the previous payload shape.'
        type: boolean
        default: true
      helm_legacy_branch_patterns:
        description: 'Glob patterns (newline or comma separated) of branches that hold maintenance/patch lines. Example: maintenance/*'
        type: string
        default: 'maintenance/*'
      extra_builds:
        description: 'JSON array of additional build groups, each forwarded to build.yml with its own config (filter_paths, path_level, normalize_to_filter, app_name_overrides, build_context_from_working_dir, helm_*, tag_prefix, enable_dockerhub, enable_ghcr, enable_gitops_artifacts, force_full_matrix). Runs alongside the primary build on tag push; groups with enable_gitops_artifacts enabled (the default) feed the single gitops-update. A group with tag_prefix set only builds when the triggering tag starts with that prefix (e.g. a component with its own independent semver and tag scheme); omit tag_prefix to build on every tag push, as before. enable_dockerhub/enable_ghcr default to the top-level inputs of the same name when omitted (explicit true/false on the group always wins, including false) — use to publish a group to only one registry regardless of the primary build''s registries. enable_gitops_artifacts defaults to true when omitted. force_full_matrix (default false) skips change detection for this group entirely and always builds/publishes it in lockstep with the release version — use when a downstream consumer (e.g. a Helm chart defaulting every subcomponent to one shared version tag) expects this component''s image to exist at every release, not only releases that touched its own filter_paths. Empty = one build only (default).'
        type: string
        default: ''
      force_full_matrix:
        description: 'When true, build all filter_paths components on every run regardless of what changed. Use for repos where components must always share the same image tag (e.g., auth + identity always released together).'
        type: boolean
        default: false
      build_on_release:
        description: 'Publish container images (and run gitops-update) for STABLE releases in the same run as semantic-release, gated on the release output, instead of on the [skip ci]-suppressed stable tag push. Beta/rc still build on their tag push. Any extra_builds groups build in the same stable run too. Default false preserves the tag-push build path for all consumers.'
        type: boolean
        default: false
      build_on_release_include_prerelease:
        description: 'When build_on_release is true, also rescue beta/rc releases via the same-run branch-push path, not just stable. Use when the tag-push trigger is unreliable for prerelease tags too (e.g. tags created via a GitHub App/bot token do not always fire a push event, regardless of channel). update_gitops derives the right environment (beta->dev, rc->stg, stable->prd) from the computed release version instead of forcing production. Default false preserves the existing stable-only rescue.'
        type: boolean
        default: false
      dockerfile_name:
        description: 'Dockerfile name for the primary build and every extra_builds group (per-group override via matrix.group.dockerfile_name). Forwarded to build.yml, which resolves the path as {working_dir}/{dockerfile_name}. Lets a repo build a non-default Dockerfile (e.g. Dockerfile.mcp, Dockerfile.migrations) through the release umbrella.'
        type: string
        default: 'Dockerfile'
      on_existing_tag:
        description: 'Behaviour when the target image tag already exists in an enabled registry, forwarded to build.yml for the primary build and every extra_builds group: "fail" (abort early, default), "skip" (skip build/push, still emit GitOps artifacts for an idempotent re-run), or "warn" (warn and build anyway). Set to "skip" when build_on_release_include_prerelease is on and the tag-push trigger might also fire for the same release, to make the second attempt a no-op instead of a hard failure.'
        type: string
        default: 'fail'

      # ----------------- GitOps Update (gitops-update.yml) -----------------
      enable_gitops_update:
        description: 'Run the gitops-update job on tag push'
        type: boolean
        default: true
      gitops_repository:
        description: 'GitOps repository to update (org/repo format). Defaults to the GITOPS_REPOSITORY org-level variable when empty.'
        type: string
        default: ''
      update_sandbox:
        description: 'Include sandbox environment on production tags. Set to false to skip sandbox even on a production release.'
        type: boolean
        default: false
      beta_environments:
        description: 'Space-separated environments updated by a beta release (develop branch). Default "dev".'
        type: string
        default: 'dev'
      rc_environments:
        description: 'Space-separated environments updated by an rc release (release-candidate branch). Default "stg".'
        type: string
        default: 'stg'
      stable_environments:
        description: 'Space-separated environments updated by a stable release (main branch). Default "prd" so a hotfix does not overwrite features still in dev/stg. Set to "dev stg prd" to refresh lower environments too. Sandbox is controlled separately by update_sandbox.'
        type: string
        default: 'prd'
      gitops_app_name:
        description: 'App name used ONLY for the gitops-update job (deployment-matrix lookup + the helmfile applications/{env}/{app}/values.yaml path). Empty = keep the existing resolution (app_name, then app_name_prefix, then the repository name). Set this when the gitops app directory is named differently from the published image: `app_name` cannot be used for that, because it is the same input that renames the built image in build.yml.'
        type: string
        default: ''
      gitops_artifact_pattern:
        description: 'Pattern to download GitOps artifacts (defaults to "gitops-tags-<repo-name>*")'
        type: string
        default: ''
      gitops_yaml_key_mappings:
        description: 'JSON object mapping artifact names to YAML keys (e.g., {"app.tag": ".api.image.tag"})'
        type: string
        default: ''
      deployment_matrix_ref:
        description: 'Git ref of LerianStudio/github-actions-shared-workflows to read the deployment matrix from. Defaults to main. Override only when testing a branch.'
        type: string
        default: 'main'
      enable_argocd_sync:
        description: 'Trigger ArgoCD sync after updating the GitOps repository'
        type: boolean
        default: true
      commit_message_prefix:
        description: 'Prefix for the GitOps commit message. When empty, falls back to app_name_prefix, then the repository name.'
        type: string
        default: ''
      use_dynamic_mapping:
        description: 'Use dynamic artifact-to-YAML key mapping in gitops-update'
        type: boolean
        default: false
      configmap_updates:
        description: 'JSON object mapping artifact names to configmap keys (helmfile layout only)'
        type: string
        default: ''
      enable_docker_login:
        description: 'Log in to DockerHub in the gitops-update job (for private image digest reads)'
        type: boolean
        default: false
      gitops_layout:
        description: 'GitOps layout strategy: "helmfile" (default, current behavior) or "kustomize".'
        type: string
        default: 'helmfile'
      kustomize_base_path:
        description: 'Required when gitops_layout=kustomize. Path within the gitops repo to the kustomization folder (e.g. environments/anacleto/kustomize/ungoliant-controller). Supports ${SERVER} and ${ENV} placeholders.'
        type: string
        default: ''
      kustomize_image_mappings:
        description: 'JSON object mapping artifact names to kustomize image references (e.g. {"ungoliant-api":"ghcr.io/lerianstudio/ungoliant-api"}). Use when extra_builds groups publish additional images into the same kustomization.yaml — artifacts not listed fall back to kustomize_image_name. Requires gitops_artifact_pattern to also match the extra groups (the default only matches the repository name).'
        type: string
        default: ''
      kustomize_image_name:
        description: 'Required when gitops_layout=kustomize, unless every image is covered by kustomize_image_mappings. Image reference matched by `kustomize edit set image` (e.g. ghcr.io/lerianstudio/ungoliant-controller).'
        type: string
        default: ''
      kustomize_environments:
        description: 'Optional space-separated env list overriding the default tag-based env loop when gitops_layout=kustomize. Leave empty for layouts without env split.'
        type: string
        default: ''
      kustomize_version:
        description: 'Version of kustomize CLI to install (used only when gitops_layout=kustomize).'
        type: string
        default: 'v5.4.3'
      argocd_app_name_template:
        description: 'Template for the ArgoCD application name. Supports placeholders {server}, {app}, {env}. Default {server}-{app}-{env} preserves current behavior. For kustomize layouts without env split, use e.g. {server}-{app}.'
        type: string
        default: '{server}-{app}-{env}'

      # ----------------- S3 Upload (s3-upload.yml) -----------------
      s3_uploads:
        description: 'JSON array of S3 upload entries run after build on tag push, each forwarded to s3-upload.yml. Each object: {"s3_bucket": "...", "file_pattern": "...", "s3_prefix": "...", "strip_prefix": "...", "flatten": true|false} (only s3_bucket and file_pattern are required; flatten defaults to true). Empty = no upload (default).'
        type: string
        default: ''

      # ----------------- Permission Manifest Publish (RI, permission-manifest-publish composite) -----------------
      run_manifest_publish:
        description: 'Publish this service''s own permissions.yaml manifest to the shared Access-Manager RI catalog in S3 on tag push (upstream half of the Inversão de Responsabilidade). Auto-detects the manifest and no-ops when out of scope (no direct lib-auth dep) or absent. The job is continue-on-error, so a hiccup never blocks the release. Requires the AWS_INIT_DATA_ROLE_ARN secret to be mapped by the caller.'
        type: boolean
        default: true
      # ----------------- API Dog E2E (api-dog-e2e-tests.yml) -----------------
      enable_apidog_e2e:
        description: 'Run the ApiDog E2E test job on tag push after a successful gitops-update'
        type: boolean
        default: false
      apidog_runner_type:
        description: 'Runner for the ApiDog E2E test job. Needs reach to the deployed environment, so it defaults to eveo-lxc-runners rather than the build runner.'
        type: string
        default: 'eveo-lxc-runners'
      apidog_auto_detect_environment:
        description: 'Auto-detect the ApiDog environment from the tag (beta -> dev, rc -> stg). When false, the manual APIDOG_ENVIRONMENT_ID secret is used.'
        type: boolean
        default: true

      # ----------------- End-to-End Tests (end-to-end-tests.yml) -----------------
      enable_e2e_tests:
        description: 'Run the LerianStudio/end-to-end suite on tag push after a successful gitops-update, uploading the Allure report to lerian-e2e-artifacts (read by Palantir).'
        type: boolean
        default: false
      e2e_modules:
        description: 'Comma-separated candidate end-to-end test modules (e.g. "midaz-ledger,midaz-crm"), one per possible built component. Required when enable_e2e_tests is true. Each run is further scoped down to only the component(s) build actually rebuilt this tag (via the build job matrix output) — module names must match the built app names.'
        type: string
        default: ''
      e2e_tenancy:
        description: 'Tenancy mode of the deployed environment targeted by the e2e suite — st (single-tenant) | mt (multi-tenant).'
        type: string
        default: 'st'
      e2e_service_domain:
        description: 'Base domain of the deployed environment the e2e suite targets. URLs are built as https://<app>.<base_env>-<tenancy>.<e2e_service_domain>. Defaults to the fuzzing environment; override only to target a different one.'
        type: string
        default: 'fuzzing.lerian.net'
      e2e_runner_type:
        description: 'Runner for the End-to-End Tests job. Needs reach to the deployed environment, so it defaults to eveo-lxc-runners rather than the build runner.'
        type: string
        default: 'eveo-lxc-runners'

      # ----------------- Ungoliant Release Diff (ungoliant-release-diff composite) -----------------
      enable_ungoliant_release_diff:
        description: 'Fire the Ungoliant release-diff webhook on tag push after a successful gitops-update to trigger chaos/fuzz analysis for the release.'
        type: boolean
        default: false
      ungoliant_app:
        description: 'App slug sent to the Ungoliant controller. When empty, falls back to app_name, then app_name_prefix, then the repository name.'
        type: string
        default: ''
      ungoliant_env_type:
        description: 'Ungoliant environment/testing type — chaos | fuzzing.'
        type: string
        default: 'chaos'
      ungoliant_tenancy:
        description: 'Ungoliant tenancy — st (single-tenant) | mt (multi-tenant).'
        type: string
        default: 'st'
      ungoliant_controller_url:
        description: 'Ungoliant controller base URL (reachable over Tailscale).'
        type: string
        default: 'https://ungoliant-controller.anacleto.lerian.net'
      ungoliant_runner_type:
        description: 'Runner for the Ungoliant release-diff job. Needs Tailscale reach to the controller, so it defaults to eveo-anacleto-lxc-runners rather than the build runner.'
        type: string
        default: 'eveo-anacleto-lxc-runners'
      ungoliant_skip_globs:
        description: 'Space-separated glob patterns. When every changed file matches one, Ungoliant is never contacted. Default skips CI/workflow-only releases.'
        type: string
        default: '.releaserc.yml .github/* .coderabbit.yml .coderabbit.yaml'

      # ----------------- Shared -----------------
      shared_paths:
        description: 'Newline-separated path patterns that trigger a release/build for all components.'
        type: string
        default: ''
      release_single_app:
        description: 'Force single-app mode for the release job even when filter_paths is set. Use for repos with one version tag but multiple Docker images.'
        type: boolean
        default: false
      filter_paths:
        description: 'Newline-separated list of path prefixes to filter. Empty = single-app repo.'
        type: string
        default: ''
    secrets:
      MANAGE_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      HELM_REPO_TOKEN:
        required: false
      AWS_MIGRATIONS_ROLE_ARN:
      AWS_INIT_DATA_ROLE_ARN:
        required: false
      APIDOG_TEST_SCENARIO_ID:
        required: false
      APIDOG_ACCESS_TOKEN:
        required: false
      APIDOG_DEV_ENVIRONMENT_ID:
        required: false
      APIDOG_STG_ENVIRONMENT_ID:
        required: false
      APIDOG_ENVIRONMENT_ID:
        required: false
      UNGOLIANT_WEBHOOK_TOKEN:
        required: false
      E2E_REPO_TOKEN:
        required: false
      AWS_E2E_ARTIFACTS_ROLE_ARN:
        required: false
      ADMIN_TENANT_1_USERNAME:
        required: false
      ADMIN_TENANT_1_PASSWORD:
        required: false
      ADMIN_TENANT_2_USERNAME:
        required: false
      ADMIN_TENANT_2_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  # ----------------- Change Detection (release gate, branch push only) -----------------
  changes:
    name: Detect non-doc changes
    if: github.ref_type == 'branch'
    runs-on: ${{ inputs.runner_type }}
    permissions:
      contents: read
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - name: Non-doc change gate
        id: gate
        uses: LerianStudio/github-actions-shared-workflows/src/config/non-doc-changes@v1
        with:
          github-token: ${{ github.token }}
          ignore-globs: ${{ inputs.ignore_globs }}

  # ----------------- Release (branch push) -----------------
  release:
    needs: changes
    if: github.ref_type == 'branch' && needs.changes.outputs.code == 'true'
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
      packages: read
    uses: ./.github/workflows/release.yml
    with:
      runner_type: ${{ inputs.runner_type }}
      publish_runner_type: ${{ inputs.release_runner_type }}
      semantic_version: ${{ inputs.semantic_version }}
      enable_changelog: ${{ inputs.enable_changelog }}
      enable_major_tag: ${{ inputs.enable_major_tag }}
      stable_releases_only: ${{ inputs.stable_releases_only }}
      changelog_bot_ignore_list: ${{ inputs.changelog_bot_ignore_list }}
      prerelease_backmerge_sync_enabled: ${{ inputs.prerelease_backmerge_sync_enabled }}
      enable_release_announcement: ${{ inputs.enable_release_announcement }}
      announcement_product_name: ${{ inputs.announcement_product_name }}
      announcement_slack_channel: ${{ inputs.announcement_slack_channel }}
      shared_paths: ${{ inputs.shared_paths }}
      filter_paths: ${{ !inputs.release_single_app && inputs.filter_paths || '' }}
    secrets: inherit

  # ----------------- Build (tag push, or same-run stable release when build_on_release) -----------------
  build:
    needs: [release]
    if: >-
      !cancelled() &&
      (
        (github.ref_type == 'tag' &&
          (inputs.tag_prefix == '' || startsWith(github.ref_name, inputs.tag_prefix)) &&
          (!inputs.build_on_release || contains(github.ref, '-beta.') || contains(github.ref, '-rc.'))) ||
        (inputs.build_on_release && github.ref_type == 'branch' &&
          needs.release.result == 'success' &&
          needs.release.outputs.new_release_published == 'true' &&
          (!contains(needs.release.outputs.new_release_version, '-') ||
            (inputs.build_on_release_include_prerelease &&
              (contains(needs.release.outputs.new_release_version, '-beta.') ||
                contains(needs.release.outputs.new_release_version, '-rc.')))))
      )
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      release_version: ${{ github.ref_type == 'branch' && needs.release.outputs.new_release_version || '' }}
      checkout_ref: ${{ github.ref_type == 'branch' && needs.release.outputs.new_release_git_tag || '' }}
      runner_type: ${{ inputs.runner_type }}
      build_runner_type: ${{ inputs.build_runner_type }}
      enable_dockerhub: ${{ inputs.enable_dockerhub }}
      enable_ghcr: ${{ inputs.enable_ghcr }}
      enable_gitops_artifacts: ${{ inputs.enable_gitops_artifacts }}
      app_name: ${{ inputs.app_name }}
      app_name_prefix: ${{ inputs.app_name_prefix }}
      app_name_overrides: ${{ inputs.app_name_overrides }}
      dockerhub_org: ${{ inputs.dockerhub_org }}
      path_level: ${{ inputs.path_level }}
      build_context_from_working_dir: ${{ inputs.build_context_from_working_dir }}
      docker_build_args: ${{ inputs.docker_build_args }}
      enable_cosign_sign: ${{ inputs.enable_cosign_sign }}
      cosign_max_attempts: ${{ inputs.cosign_max_attempts }}
      cosign_initial_delay: ${{ inputs.cosign_initial_delay }}
      cosign_max_delay: ${{ inputs.cosign_max_delay }}
      continue_gitops_on_signing_failure: ${{ inputs.continue_gitops_on_signing_failure }}
      enable_helm_dispatch: ${{ inputs.enable_helm_dispatch }}
      helm_chart: ${{ inputs.helm_chart }}
      helm_repository: ${{ inputs.helm_repository }}
      helm_detect_env_changes: ${{ inputs.helm_detect_env_changes }}
      helm_values_key_mappings: ${{ inputs.helm_values_key_mappings }}
      helm_legacy_patch_detection: ${{ inputs.helm_legacy_patch_detection }}
      helm_legacy_branch_patterns: ${{ inputs.helm_legacy_branch_patterns }}
      shared_paths: ${{ inputs.shared_paths }}
      filter_paths: ${{ inputs.filter_paths }}
      force_full_matrix: ${{ inputs.force_full_matrix }}
      dockerfile_name: ${{ inputs.dockerfile_name }}
      on_existing_tag: ${{ inputs.on_existing_tag }}
    secrets: inherit

  # ----------------- S3 Upload (tag push, post-build, opt-in) -----------------
  s3_upload:
    name: S3 Upload
    needs: [build]
    # needs.build.result alone is unreliable here: build wraps build.yml, a
    # reusable workflow with an internal matrix, and its caller result does
    # not always surface as 'success' to dependents even when every matrix
    # leg passed (same issue update_gitops and ungoliant_release_diff already
    # guard against below with the has_builds output check). !cancelled() is
    # required too: without an explicit status-check function, GitHub Actions
    # implicitly prepends success() to this condition, which re-imposes the
    # exact unreliable needs.build status check this fix works around.
    if: >-
      !cancelled() && github.ref_type == 'tag' && inputs.s3_uploads != '' &&
      needs.build.result != 'failure' && needs.build.outputs.has_builds == 'true'
    runs-on: ${{ inputs.runner_type }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Determine environment folder from tag
        id: env
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *-beta* ]]; then
            FOLDER="development"
          elif [[ "$TAG" == *-rc* ]]; then
            FOLDER="staging"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FOLDER="production"
          else
            FOLDER=""
          fi
          echo "folder=${FOLDER}" >> "$GITHUB_OUTPUT"
          [[ -n "$FOLDER" ]] && echo "📁 Environment: ${FOLDER}" || echo "::warning::Tag '${TAG}' matched no environment — S3 upload skipped."

      - name: Configure AWS credentials
        if: steps.env.outputs.folder != ''
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_MIGRATIONS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Upload files to S3
        if: steps.env.outputs.folder != ''
        env:
          S3_UPLOADS: ${{ inputs.s3_uploads }}
          FOLDER: ${{ steps.env.outputs.folder }}
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail

          upload_entry() {
            local BUCKET="$1" PATTERN="$2" PREFIX="$3" STRIP_PREFIX="$4" FLATTEN="$5"
            local S3_PATH file DEST_PATH FILE_COUNT=0
            if [[ -n "$PREFIX" ]]; then
              S3_PATH="s3://${BUCKET}/${FOLDER}/${PREFIX}/"
            else
              S3_PATH="s3://${BUCKET}/${FOLDER}/"
            fi
            echo "Uploading '${PATTERN}' -> ${S3_PATH} (flatten=${FLATTEN}, strip_prefix=${STRIP_PREFIX:-<none>})"
            shopt -s nullglob
            for file in $PATTERN; do
              if [[ "$FLATTEN" == "true" ]]; then
                aws s3 cp "$file" "${S3_PATH}"
              elif [[ -n "$STRIP_PREFIX" ]]; then
                DEST_PATH="${file#"$STRIP_PREFIX"/}"
                aws s3 cp "$file" "${S3_PATH}${DEST_PATH}"
              else
                aws s3 cp "$file" "${S3_PATH}${file}"
              fi
              FILE_COUNT=$((FILE_COUNT + 1))
            done
            shopt -u nullglob
            if [[ $FILE_COUNT -eq 0 ]]; then
              echo "::error::No files matched pattern: ${PATTERN}"
              return 1
            fi
            echo "::notice::Uploaded ${FILE_COUNT} file(s) to ${S3_PATH}"
          }

          assume_role() {
            local role_arn="$1" token
            token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
            aws sts assume-role-with-web-identity \
              --role-arn "$role_arn" \
              --role-session-name go-release-s3-upload \
              --web-identity-token "$token" \
              --duration-seconds 3600 \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
              --output text
          }

          if ! PARSED_ENTRIES=$(printf '%s' "$S3_UPLOADS" | jq -c 'if type == "array" then .[] else error("s3_uploads must be a JSON array") end'); then
            echo "::error::s3_uploads must be a valid JSON array."
            exit 1
          fi
          mapfile -t ENTRIES < <(printf '%s' "$PARSED_ENTRIES")
          if [[ ${#ENTRIES[@]} -eq 0 ]]; then
            echo "::warning::s3_uploads is empty — nothing to upload."
            exit 0
          fi

          for entry in "${ENTRIES[@]}"; do
            BUCKET=$(printf '%s' "$entry" | jq -r '.s3_bucket')
            PATTERN=$(printf '%s' "$entry" | jq -r '.file_pattern')
            PREFIX=$(printf '%s' "$entry" | jq -r '.s3_prefix // ""')
            STRIP_PREFIX=$(printf '%s' "$entry" | jq -r '.strip_prefix // ""')
            FLATTEN=$(printf '%s' "$entry" | jq -r 'if .flatten == false then "false" else "true" end')
            ROLE_ARN=$(printf '%s' "$entry" | jq -r '.aws_role_arn // ""')

            if [[ -z "$BUCKET" || "$BUCKET" == "null" || -z "$PATTERN" || "$PATTERN" == "null" ]]; then
              echo "::error::Each s3_uploads entry requires s3_bucket and file_pattern. Got: ${entry}"
              exit 1
            fi

            if [[ -n "$ROLE_ARN" && "$ROLE_ARN" != "null" ]]; then
              (
                set -euo pipefail
                CREDS=$(assume_role "$ROLE_ARN")
                AK=$(printf '%s' "$CREDS" | cut -f1)
                SK=$(printf '%s' "$CREDS" | cut -f2)
                ST=$(printf '%s' "$CREDS" | cut -f3)
                if [[ -z "$AK" || -z "$SK" || -z "$ST" ]]; then
                  echo "::error::Failed to assume role for s3 upload: ${ROLE_ARN}"
                  exit 1
                fi
                echo "::add-mask::$AK"; echo "::add-mask::$SK"; echo "::add-mask::$ST"
                export AWS_ACCESS_KEY_ID="$AK" AWS_SECRET_ACCESS_KEY="$SK" AWS_SESSION_TOKEN="$ST"
                upload_entry "$BUCKET" "$PATTERN" "$PREFIX" "$STRIP_PREFIX" "$FLATTEN"
              )
            else
              upload_entry "$BUCKET" "$PATTERN" "$PREFIX" "$STRIP_PREFIX" "$FLATTEN"
            fi
          done

  # ----------------- Permission Manifest Publish (RI, tag push, opt-in) -----------------
  # Upstream half of the Access-Manager "Inversão de Responsabilidade": on a tag push
  # each in-scope Go service publishes its OWN permissions.yaml to the shared RI catalog
  # in S3 (one object per service, keyed by the manifest's `service:` value). The
  # tenant-manager aggregates at read time by listing the prefix — there is no merge here.
  #
  # Reads repo files (not build artifacts), so it does NOT gate on the image build like
  # s3_upload does; it only mirrors s3_upload's tag-push guard and its tag -> FOLDER
  # derivation, assuming the casdoor-init-data-scoped AWS_INIT_DATA_ROLE_ARN via OIDC.
  # continue-on-error keeps a publish hiccup from ever blocking the release.
  permission_manifest_publish:
    name: Permission Manifest Publish
    if: >-
      !cancelled() && github.ref_type == 'tag' && inputs.run_manifest_publish
    runs-on: ${{ inputs.runner_type }}
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    env:
      # Secrets can't be referenced directly in a step `if:`, so surface the
      # role's presence as a job-level env boolean. run_manifest_publish defaults
      # to true, so a repo that never mapped AWS_INIT_DATA_ROLE_ARN must SKIP the
      # real upload (not attempt an unauthenticated one) — a dry-run still runs
      # since the composite previews without any AWS call.
      HAS_INIT_DATA_ROLE: ${{ secrets.AWS_INIT_DATA_ROLE_ARN != '' }}
    steps:
      # ----------------- Checkout & environment resolution -----------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Determine environment folder from tag
        id: env
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *-beta* ]]; then
            FOLDER="development"
          elif [[ "$TAG" == *-rc* ]]; then
            FOLDER="staging"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FOLDER="production"
          else
            FOLDER=""
          fi
          echo "folder=${FOLDER}" >> "$GITHUB_OUTPUT"
          [[ -n "$FOLDER" ]] && echo "📁 Environment: ${FOLDER}" || echo "::warning::Tag '${TAG}' matched no environment — manifest publish skipped."

      # ----------------- AWS credentials (guarded) -----------------
      # Skip on a dry-run (the composite previews with no AWS call) and when the
      # role secret is absent (nothing to assume — the publish step is skipped too).
      - name: Configure AWS credentials
        if: steps.env.outputs.folder != '' && env.HAS_INIT_DATA_ROLE == 'true' && inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_INIT_DATA_ROLE_ARN }}
          aws-region: sa-east-1

      # ----------------- Publish manifest to the RI catalog -----------------
      # Publish when there are real creds, or preview when dry-running; otherwise
      # (no role secret and not a dry-run) skip rather than fail a credential-less upload.
      - name: Publish permission manifest to the RI catalog
        if: steps.env.outputs.folder != '' && (env.HAS_INIT_DATA_ROLE == 'true' || inputs.dry_run == true)
        uses: LerianStudio/github-actions-shared-workflows/src/validate/permission-manifest-publish@v1
        with:
          environment: ${{ steps.env.outputs.folder }}
          github-token: ${{ github.token }}
          dry-run: ${{ inputs.dry_run }}

  # ----------------- Extra Builds (tag push, opt-in) -----------------
  extra_build:
    needs: [release]
    if: >-
      !cancelled() &&
      inputs.extra_builds != '' && inputs.extra_builds != '[]' &&
      (
        (github.ref_type == 'tag' &&
          (!inputs.build_on_release || contains(github.ref, '-beta.') || contains(github.ref, '-rc.'))) ||
        (inputs.build_on_release && github.ref_type == 'branch' &&
          needs.release.result == 'success' &&
          needs.release.outputs.new_release_published == 'true' &&
          (!contains(needs.release.outputs.new_release_version, '-') ||
            (inputs.build_on_release_include_prerelease &&
              (contains(needs.release.outputs.new_release_version, '-beta.') ||
                contains(needs.release.outputs.new_release_version, '-rc.')))))
      )
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(inputs.extra_builds) }}
    uses: ./.github/workflows/build.yml
    with:
      release_version: ${{ github.ref_type == 'branch' && needs.release.outputs.new_release_version || '' }}
      checkout_ref: ${{ github.ref_type == 'branch' && needs.release.outputs.new_release_git_tag || '' }}
      dockerfile_name: ${{ matrix.group.dockerfile_name || inputs.dockerfile_name }}
      on_existing_tag: ${{ inputs.on_existing_tag }}
      # Always forwarded, including on the branch-rescue path (unlike
      # release_version/checkout_ref above): build.yml's own tag_prefix guard
      # is what excludes a tag-prefixed group (its own independent version
      # line, e.g. mcp) from the branch rescue on purpose — that group's
      # build_on_release build should ride its OWN tag push, never the main
      # app's version. Do not make this conditional on ref_type.
      tag_prefix: ${{ matrix.group.tag_prefix }}
      runner_type: ${{ inputs.runner_type }}
      build_runner_type: ${{ inputs.build_runner_type }}
      enable_dockerhub: ${{ (matrix.group.enable_dockerhub == null && inputs.enable_dockerhub == true) || matrix.group.enable_dockerhub == true }}
      enable_ghcr: ${{ (matrix.group.enable_ghcr == null && inputs.enable_ghcr == true) || matrix.group.enable_ghcr == true }}
      dockerhub_org: ${{ inputs.dockerhub_org }}
      enable_cosign_sign: ${{ inputs.enable_cosign_sign }}
      cosign_max_attempts: ${{ inputs.cosign_max_attempts }}
      cosign_initial_delay: ${{ inputs.cosign_initial_delay }}
      cosign_max_delay: ${{ inputs.cosign_max_delay }}
      continue_gitops_on_signing_failure: ${{ inputs.continue_gitops_on_signing_failure }}
      enable_gitops_artifacts: ${{ matrix.group.enable_gitops_artifacts == null && true || matrix.group.enable_gitops_artifacts }}
      filter_paths: ${{ matrix.group.filter_paths }}
      shared_paths: ${{ matrix.group.shared_paths || inputs.shared_paths }}
      path_level: ${{ matrix.group.path_level || inputs.path_level }}
      normalize_to_filter: ${{ toJSON(matrix.group.normalize_to_filter) != 'false' }}
      force_full_matrix: ${{ matrix.group.force_full_matrix || false }}
      app_name: ${{ matrix.group.app_name }}
      app_name_prefix: ${{ matrix.group.app_name_prefix }}
      app_name_overrides: ${{ matrix.group.app_name_overrides }}
      build_context_from_working_dir: ${{ matrix.group.build_context_from_working_dir || false }}
      docker_build_args: ${{ matrix.group.docker_build_args }}
      enable_helm_dispatch: ${{ matrix.group.enable_helm_dispatch || false }}
      helm_chart: ${{ matrix.group.helm_chart }}
      helm_repository: ${{ inputs.helm_repository }}
      helm_detect_env_changes: ${{ toJSON(matrix.group.helm_detect_env_changes) == 'true' || (toJSON(matrix.group.helm_detect_env_changes) != 'false' && inputs.helm_detect_env_changes) }}
      helm_values_key_mappings: ${{ matrix.group.helm_values_key_mappings }}
      helm_legacy_patch_detection: ${{ toJSON(matrix.group.helm_legacy_patch_detection) == 'true' || (toJSON(matrix.group.helm_legacy_patch_detection) != 'false' && inputs.helm_legacy_patch_detection) }}
      helm_legacy_branch_patterns: ${{ matrix.group.helm_legacy_branch_patterns || inputs.helm_legacy_branch_patterns }}
    secrets: inherit

  # ----------------- GitOps Update (tag push) -----------------
  # Gated on the primary build actually producing artifacts (has_builds).
  # extra_build succeeding alone is not enough: this job's artifact_pattern
  # and gitops_yaml_key_mappings target the primary app_name, so it has
  # nothing valid to download/apply when only an extra_builds group ran.
  # Callers whose extra_builds groups need their own gitops-update (e.g. a
  # component deployed as a separate ArgoCD Application) should add a
  # dedicated gitops-update.yml job of their own, independent of this one.
  update_gitops:
    needs: [release, build, extra_build]
    if: >-
      inputs.enable_gitops_update && !cancelled() &&
      needs.build.result != 'failure' && needs.extra_build.result != 'failure' &&
      (
        (github.ref_type == 'tag' &&
          needs.build.result == 'success' && needs.build.outputs.has_builds == 'true') ||
        (inputs.build_on_release && github.ref_type == 'branch' &&
          needs.build.result == 'success' && needs.build.outputs.has_builds == 'true')
      )
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      packages: write
    uses: ./.github/workflows/gitops-update.yml
    with:
      gitops_repository: ${{ inputs.gitops_repository }}
      update_sandbox: ${{ inputs.update_sandbox }}
      beta_environments: ${{ inputs.beta_environments }}
      rc_environments: ${{ inputs.rc_environments }}
      stable_environments: ${{ inputs.stable_environments }}
      # gitops_app_name first, then the pre-existing chain unchanged, so a caller
      # that does not set it resolves exactly as before (and gitops-update still
      # falls back to the repository name when all three are empty).
      app_name: ${{ inputs.gitops_app_name || inputs.app_name || inputs.app_name_prefix }}
      artifact_pattern: ${{ inputs.gitops_artifact_pattern || format('gitops-tags-{0}*', github.event.repository.name) }}
      yaml_key_mappings: ${{ inputs.gitops_yaml_key_mappings }}
      deployment_matrix_ref: ${{ inputs.deployment_matrix_ref }}
      enable_argocd_sync: ${{ inputs.enable_argocd_sync }}
      commit_message_prefix: ${{ inputs.commit_message_prefix || inputs.app_name_prefix }}
      use_dynamic_mapping: ${{ inputs.use_dynamic_mapping }}
      configmap_updates: ${{ inputs.configmap_updates }}
      enable_docker_login: ${{ inputs.enable_docker_login }}
      gitops_layout: ${{ inputs.gitops_layout }}
      kustomize_base_path: ${{ inputs.kustomize_base_path }}
      kustomize_image_name: ${{ inputs.kustomize_image_name }}
      kustomize_image_mappings: ${{ inputs.kustomize_image_mappings }}
      kustomize_environments: ${{ inputs.kustomize_environments }}
      kustomize_version: ${{ inputs.kustomize_version }}
      argocd_app_name_template: ${{ inputs.argocd_app_name_template }}
      force_env: ${{ github.ref_type == 'branch' && inputs.build_on_release && (contains(needs.release.outputs.new_release_version, '-beta.') && 'development' || contains(needs.release.outputs.new_release_version, '-rc.') && 'staging' || 'production') || '' }}
    secrets: inherit

  # ----------------- API Dog E2E Tests (tag push, post-gitops, opt-in) -----------------
  api_dog_e2e_tests:
    needs: [build, update_gitops]
    # See the note on ungoliant_release_diff: gate on build's has_builds output
    # instead of the unreliable needs.update_gitops.result == 'success'.
    if: >-
      !cancelled()
      && github.ref_type == 'tag'
      && inputs.enable_apidog_e2e
      && inputs.enable_gitops_update
      && needs.build.outputs.has_builds == 'true'
      && needs.update_gitops.result != 'failure'
      && needs.update_gitops.result != 'cancelled'
    uses: ./.github/workflows/api-dog-e2e-tests.yml
    with:
      runner_type: ${{ inputs.apidog_runner_type }}
      auto_detect_environment: ${{ inputs.apidog_auto_detect_environment }}
    secrets:
      test_scenario_id: ${{ secrets.APIDOG_TEST_SCENARIO_ID }}
      apidog_access_token: ${{ secrets.APIDOG_ACCESS_TOKEN }}
      dev_environment_id: ${{ secrets.APIDOG_DEV_ENVIRONMENT_ID }}
      stg_environment_id: ${{ secrets.APIDOG_STG_ENVIRONMENT_ID }}
      environment_id: ${{ secrets.APIDOG_ENVIRONMENT_ID }}

  # ----------------- End-to-End Tests (tag push, post-gitops, opt-in) -----------------
  # Runs the LerianStudio/end-to-end suite against the just-deployed
  # environment and uploads the Allure report to lerian-e2e-artifacts, the
  # same S3 bucket the JS products (e.g. product-console) already upload to
  # and that Palantir (self-service-testing) reads for its E2E page. Gated
  # like api_dog_e2e_tests: on build's has_builds output rather than the
  # unreliable needs.update_gitops.result == 'success'.
  e2e_tests:
    name: End-to-End Tests
    needs: [build, update_gitops]
    if: >-
      !cancelled()
      && github.ref_type == 'tag'
      && inputs.enable_e2e_tests
      && inputs.enable_gitops_update
      && needs.build.outputs.has_builds == 'true'
      && needs.update_gitops.result != 'failure'
      && needs.update_gitops.result != 'cancelled'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/end-to-end-tests.yml
    with:
      modules: ${{ inputs.e2e_modules }}
      built_apps: ${{ needs.build.outputs.matrix }}
      tenancy: ${{ inputs.e2e_tenancy }}
      service_domain: ${{ inputs.e2e_service_domain }}
      runner_type: ${{ inputs.e2e_runner_type }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      # Dedicated, minimally-scoped token (read-only on the private end-to-end
      # suite repo) — kept separate from the broad MANAGE_TOKEN so the e2e
      # checkout carries the least privilege it needs.
      e2e_repo_token: ${{ secrets.E2E_REPO_TOKEN }}
      aws_e2e_artifacts_role_arn: ${{ secrets.AWS_E2E_ARTIFACTS_ROLE_ARN }}
      admin_tenant_1_username: ${{ secrets.ADMIN_TENANT_1_USERNAME }}
      admin_tenant_1_password: ${{ secrets.ADMIN_TENANT_1_PASSWORD }}
      admin_tenant_2_username: ${{ secrets.ADMIN_TENANT_2_USERNAME }}
      admin_tenant_2_password: ${{ secrets.ADMIN_TENANT_2_PASSWORD }}

  # ----------------- Ungoliant Release Diff (tag push, post-gitops, opt-in) -----------------
  # Runs only after a successful gitops-update (i.e. the release was deployed).
  # The controller is reachable only over Tailscale, so the job runs on the
  # eveo-anacleto-lxc-runners self-hosted runner. base-env/env are derived from
  # the tag, which maps 1:1 to the source branch (beta<-develop, rc<-release-
  # candidate, stable<-main) per .releaserc conventions.
  ungoliant_release_diff:
    name: Ungoliant Release Diff
    needs: [release, build, update_gitops]
    # Gate on build's has_builds output (which propagates reliably and proves a
    # real deploy happened) rather than needs.update_gitops.result == 'success':
    # update_gitops wraps a reusable workflow with a dynamic matrix, and its
    # caller result does not reliably surface as 'success' to dependents.
    # Also mirrors update_gitops' branch-rescue allowance: build_on_release lets
    # build/extra_build run on a branch push, and this job needs to run there
    # too, not just on the tag push (which may never arrive — see
    # build_on_release_include_prerelease).
    #
    # Ungoliant only cares that the anacleto (chaos/fuzzing) environments it
    # actually targets deployed cleanly — a sync failure on an unrelated
    # server (e.g. benedita) shouldn't block it. needs.update_gitops.result
    # rolls up EVERY argocd_sync target into one pass/fail, so it can't tell
    # the two apart; gitops-update.yml's anacleto_sync_ok output can (see its
    # aggregate_sync_status job). Still require update_gitops.result to not
    # be a hard failure/cancellation UNLESS anacleto specifically came out ok
    # despite that (i.e. the only failure was a non-anacleto sync target).
    if: >-
      !cancelled()
      && (
        github.ref_type == 'tag' ||
        (inputs.build_on_release && github.ref_type == 'branch')
      )
      && inputs.enable_ungoliant_release_diff
      && inputs.enable_gitops_update
      && needs.build.outputs.has_builds == 'true'
      && needs.update_gitops.result != 'cancelled'
      && needs.update_gitops.result != 'skipped'
      && (
        needs.update_gitops.result != 'failure' ||
        needs.update_gitops.outputs.anacleto_sync_ok == 'true'
      )
    runs-on: ${{ vars.UNGOLIANT_RUNNERS || inputs.ungoliant_runner_type }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Resolve release tag, channel and base env
        id: target
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_GIT_TAG: ${{ needs.release.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail

          TAG="$REF_NAME"
          if [[ "$REF_TYPE" == "branch" ]]; then
            TAG="$RELEASE_GIT_TAG"
          fi

          # A BARE SEMVER IS STABLE, AND ONLY A BARE SEMVER.
          #
          # This used to be a bare `else` onto stable/prd, so a tag that says nothing
          # about its channel — `build-1234`, `nightly`, a typo'd prerelease — aimed a
          # production-channel run. That is the most consequential direction and the
          # one nobody would want by accident, so an unrecognised tag now fails loudly
          # instead of being guessed at. The dotless prerelease forms (`-rc1`) are
          # matched too: semver wants the separator, git tags in the wild do not always
          # carry it. Build metadata (`+20260812`) carries no precedence per semver and
          # is accepted as stable.
          case "$TAG" in
            *-rc.*|*-rc|*-rc[0-9]*)
              RELEASE_ENV="rc"; BASE_ENV="stg" ;;
            *-beta.*|*-beta|*-beta[0-9]*)
              RELEASE_ENV="beta"; BASE_ENV="dev" ;;
            # Alphas are validated on the dev surface, which is what beta selects.
            *-alpha.*|*-alpha|*-alpha[0-9]*)
              RELEASE_ENV="beta"; BASE_ENV="dev" ;;
            *)
              if [[ "$TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9A-Za-z.-]+)?$ ]]; then
                RELEASE_ENV="stable"; BASE_ENV="prd"
              else
                echo "::error title=Cannot tell which release channel this tag belongs to::Tag '$TAG' carries no channel marker (-beta.N, -rc.N, -alpha.N) and is not a bare semver version. Refusing to guess — a wrong guess here aims a production-channel run."
                exit 1
              fi
              ;;
          esac
          {
            echo "tag=$TAG"
            echo "release_env=$RELEASE_ENV"
            echo "base_env=$BASE_ENV"
          } >> "$GITHUB_OUTPUT"

      - name: Send release-diff webhook
        uses: LerianStudio/github-actions-shared-workflows/src/validate/ungoliant-release-diff@v1
        with:
          app: ${{ inputs.ungoliant_app || inputs.app_name || inputs.app_name_prefix || github.event.repository.name }}
          version: ${{ steps.target.outputs.tag }}
          env: ${{ steps.target.outputs.release_env }}
          env-type: ${{ inputs.ungoliant_env_type }}
          tenancy: ${{ inputs.ungoliant_tenancy }}
          base-env: ${{ steps.target.outputs.base_env }}
          controller-url: ${{ vars.UNGOLIANT_CONTROLLER_URL || inputs.ungoliant_controller_url }}
          skip-globs: ${{ inputs.ungoliant_skip_globs }}
          github-token: ${{ github.token }}
          webhook-token: ${{ secrets.UNGOLIANT_WEBHOOK_TOKEN }}
          dry-run: ${{ inputs.dry_run }}
