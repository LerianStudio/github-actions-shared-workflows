name: Self — CodeRabbit Collapse

# Folds CodeRabbit's review summary on this repository's pull requests once every
# inline thread it opened is resolved. Paired with `self-pr-validation.yml`, which
# is where the review is requested in the first place.
#
# The triggers are the ones GitHub offers, not the one this wants. See the note in
# coderabbit-collapse.yml.

on:
  pull_request:
    types:
      - synchronize
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
    types:
      - created

permissions:
  contents: read

# A burst of activity fires this several times over. Only the last run matters —
# each reads the live state of every thread — so the earlier ones are cancelled
# rather than racing each other to the same mutation.
concurrency:
  group: coderabbit-collapse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collapse:
    name: Collapse Resolved Reviews
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The composite is used by path rather than through coderabbit-collapse.yml,
      # matching how self-pr-validation.yml runs this repository's own composites.
      # The reusable workflow resolves `LerianStudio/…/src/notify/coderabbit-collapse@v1`,
      # an absolute ref for the benefit of other repositories — which cannot resolve
      # at all until this merges and a version carries it. A self entrypoint that
      # depended on that could never run on the pull request introducing it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Collapse resolved reviews
        uses: ./src/notify/coderabbit-collapse
        with:
          github-token: ${{ secrets.MANAGE_TOKEN || github.token }}
          pr-number: ${{ github.event.pull_request.number }}
