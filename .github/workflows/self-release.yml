name: release

on:
  push:
    branches:
      - develop
      - release-candidate
      - main
    paths-ignore:
      - '.gitignore'
      - '**/*.env'
      - '*.env'
      - '**/*.md'
      - '*.md'
      - '**/*.txt'
      - '*.txt'
      # The deployment matrix is resolved from main at runtime by callers, so
      # matrix-only changes propagate without a new release tag.
      - 'config/deployment-matrix.yml'
      # Same rationale: the version-propagation matrix is metadata for the
      # propagation controller; editing it must not cut a release.
      - 'config/version-propagation.yml'
      # Likewise the tier promotion flow: it is read by the promotion
      # controller at the published tag, so editing it must not cut a release.
      - 'config/tier-promotion.yml'
      - '.github/workflows/self-*.yml'
    tags-ignore:
      - '**'

permissions:
  id-token: write
  contents: write
  pull-requests: write
  packages: read

jobs:
  publish-release:
    uses: ./.github/workflows/release.yml
    with:
      runner_type: ubuntu-latest
      enable_changelog: ${{ github.ref == 'refs/heads/main' }}
      enable_major_tag: ${{ github.ref == 'refs/heads/main' }}
      # This repository's released artifact IS .github/workflows/, so the
      # default `.github/*` glob would classify a push touching only reusable
      # workflows as meta and skip its release. Callers keep that default (a
      # pipeline edit ships them byte-identical code); here the glob names only
      # what is meta in THIS repository: the self-* workflows and the .github
      # config files, plus everything the trigger's paths-ignore drops, so a push
      # mixing those with docs is skipped by the gate as well. release_on_
      # workflow_changes stays false on purpose: true would count self-*
      # workflows as code too. A new meta file under .github/ that is not listed
      # here errs towards cutting a release, never towards skipping one.
      ignore_globs: >-
        *.md docs/* LICENSE* .gitignore .coderabbit.yml .coderabbit.yaml
        *.env *.txt
        config/deployment-matrix.yml config/version-propagation.yml
        config/tier-promotion.yml
        .github/workflows/self-*
        .github/CODEOWNERS .github/ISSUE_TEMPLATE/* .github/actionlint.yml
        .github/dependabot.yml .github/labeler.yml .github/labels.yml
        .github/markdown-link-check-config.json .github/pull_request_template.md
    secrets: inherit

  # The `propagate-version` job that rewrote `@vX.Y.Z` pins in each downstream
  # repository was removed: the tier channels below replaced it, and every entry
  # in `config/version-propagation.yml` is now `enabled: false`. The reusable
  # workflow and its matrix are kept as the rollback path — re-add a job calling
  # `./.github/workflows/version-propagation.yml` to resume.

  # After every stable release on main, walk the new tag through the tier
  # branches declared in `config/tier-promotion.yml`: tier-0 immediately, then
  # tier-1 and tier-2 each behind their Environment approval. The run stays open
  # while an approval is pending, which is what keeps the promoted commit fixed
  # to the tag resolved when the train opened.
  #
  # Two conditions here are load-bearing, not defensive noise:
  #
  #   `new_release_published` — semantic-release exits SUCCESSFULLY when a push
  #   carries no releasable commits, so gating on the job result alone would
  #   open a train for a tag already sitting on the tiers and reopen its
  #   approvals on every such push.
  #
  #   `new_release_git_tag` passed explicitly — letting the controller
  #   re-resolve "latest stable" would race a concurrent release and promote a
  #   different tag than the one this run published.
  #
  # This is now the only propagation model: a repository still pinning `@vX.Y.Z`
  # simply stops receiving automatic bumps and must migrate to a tier channel.
  promote-tiers:
    needs: publish-release
    if: >-
      github.ref == 'refs/heads/main'
      && needs.publish-release.result == 'success'
      && needs.publish-release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/tier-promotion.yml
    with:
      tag: ${{ needs.publish-release.outputs.new_release_git_tag }}
      dry_run: false
    secrets: inherit
