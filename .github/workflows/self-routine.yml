name: Self — Repository Routines

on:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - .github/labels.yml
  workflow_dispatch:
    inputs:
      routine:
        description: Routine to run
        type: choice
        options:
          - all
          - branch-cleanup-stale
          - stale-pr
          - stale-issue
          - labels-sync
          - workflow-runs-cleanup
        default: all
      dry_run:
        description: Preview changes without applying them
        type: boolean
        default: true
      protected_branches:
        description: Comma-separated branch patterns to never delete (full override of default)
        type: string
        default: "main,master,develop,release-candidate,hotfix/*"
      extra_protected_branches:
        description: Comma-separated branch patterns appended to protected_branches
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  routine:
    uses: ./.github/workflows/routine.yml
    with:
      routine: ${{ inputs.routine || 'all' }}
      dry_run: ${{ inputs.dry_run || false }}
      merged_branch: ${{ github.head_ref }}
      protected_branches: ${{ inputs.protected_branches || 'main,master,develop,release-candidate,hotfix/*' }}
      # `tier-*` is appended unconditionally, never taken from the dispatch
      # input: the tier branches are the refs downstream repos pin to, so the
      # stale scan must never reach them (they can sit >30 days without a
      # commit while a promotion waits for approval). Forcing it here keeps
      # the guarantee even when a dispatcher overrides either branch input.
      extra_protected_branches: ${{ inputs.extra_protected_branches != '' && format('tier-*,{0}', inputs.extra_protected_branches) || 'tier-*' }}
    secrets: inherit
