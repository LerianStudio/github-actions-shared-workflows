name: Breaking Change Approval

# Holds a pull request that carries breaking-change commits until a human has
# approved it through the `breaking-approval` Environment, so a major version
# bump is always a decision somebody made rather than a side effect of how a
# commit was worded.
#
# Same mechanism as the tier promotion train: the work stops at a job whose
# `environment:` carries required reviewers, the run sits pending until somebody
# answers, and approving resumes the very same run. That is why there is no
# `pull_request_review` trigger anywhere — a review does not re-run a
# `pull_request` workflow, but an Environment approval resumes one.
#
#   detect → request (comment + label) → approval (Environment) → outcome
#
# The reviewer is being asked one question: is this breaking change necessary?
# Approving says yes and releases the merge. Rejecting says no, and the pull
# request is closed — the change goes back to being reworked without the break.
#
# `environment: breaking-approval` is a literal, deliberately. An `environment:`
# resolved through an expression could be pointed at an ungated Environment by
# editing an input, while a literal is auditable by reading this file. Same
# reasoning as `tier-promotion.yml`.
#
# Because a job referencing an Environment that does not exist CREATES it,
# unprotected, a missing or unprotected `breaking-approval` would wave every
# breaking change straight through. The preflight in `request` refuses to run
# in that state — see `require_protected_environment`.
#
# Scope is a base → head mapping:
#
#   scope_rules  {"develop": "*", "main": "hotfix/*"}
#
# Everything reaching `develop` is gated — that is where the next release is
# assembled. On `main` only `hotfix/*` is, because every other source reached
# `main` through `develop` and was already gated there.
#
# `additional_scope_rules` is the open field for what the default cannot
# anticipate, merged over `scope_rules` key by key.

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request to act on. Defaults to the one in the event payload.
        required: false
        type: number
        default: 0
      scope_rules:
        description: >-
          JSON object mapping an exact base branch to the pipe-separated head
          globs gated on it — {"develop": "*", "main": "hotfix/*"}. A base absent
          from the object is never gated. Invalid JSON fails the job closed.
        required: false
        type: string
        default: '{"develop": "*", "main": "hotfix/*"}'
      additional_scope_rules:
        description: >-
          JSON object merged over `scope_rules`, key by key, for repository-specific
          cases. A base present in both takes this value — write the complete
          pattern set for that base, not just the addition.
        required: false
        type: string
        default: ''
      force_labels:
        description: Comma-separated labels that put a pull request in scope even when no rule matches. Matched case-insensitively. Empty disables the override.
        required: false
        type: string
        default: breaking-change-review
      skip_labels:
        description: Comma-separated labels that take a pull request out of scope. Matched case-insensitively. Empty by default — the guard fails closed unless a repository opts into an escape hatch.
        required: false
        type: string
        default: ''
      ignore_authors:
        description: >-
          Comma-separated logins whose pull requests are never gated, checked before
          scope as a veto. Spelling is normalised — `dependabot`, `dependabot[bot]`
          and `app/dependabot` are the same entry.
        required: false
        type: string
        default: 'dependabot[bot]'
      detected_breaking_changes:
        description: >-
          Detection result computed by the caller — `true`, `false`, `unknown` when
          the caller's own detection did not complete, or empty to detect here. `pr-validation.yml` already runs the same composite over the
          same commits, so it passes its verdict instead of paying for a second
          full-history checkout. Any other value fails the job closed.
        required: false
        type: string
        default: ''
      detected_acknowledged:
        description: Companion to `detected_breaking_changes` — whether the author acknowledgement line is present. Reported to the reviewer as context only.
        required: false
        type: string
        default: ''
      author_acknowledgement:
        description: >-
          The exact line `pr-validation.yml` requires in the pull request body. Read
          here for reporting only — it is shown to the reviewer as context and never
          substitutes for the Environment approval.
        required: false
        type: string
        default: 'Breaking change acknowledged: I understand that this PR intentionally introduces a breaking change and requires the next release to be a major version.'
      close_on_rejection:
        description: >-
          Close the pull request when a reviewer rejects the deployment. The rejection
          itself is the decision that the break is not necessary; leaving the pull
          request open invites a re-run until somebody approves. Reopening is one
          click, and the branch is never touched.
        required: false
        type: boolean
        default: true
      require_protected_environment:
        description: >-
          Refuse to gate when `breaking-approval` has no required reviewers. Leave on:
          a job referencing a missing Environment creates it unprotected, which would
          turn this whole workflow into a no-op that looks green. Turn off only where
          the API cannot be read and the Environment is known to be configured.
        required: false
        type: boolean
        default: true
      label:
        description: Label applied while the pull request waits for its approval, and removed once resolved. Cosmetic — failure to apply it never fails the job. Empty disables it.
        required: false
        type: string
        default: breaking-change
      enable_comment:
        description: Post (and keep updated) a single comment carrying the request, the approval link and the outcome.
        required: false
        type: boolean
        default: true
      dry_run:
        description: Report what would be gated without commenting, labelling, requesting an approval, or failing
        required: false
        type: boolean
        default: false
      runner_type:
        description: Runner label for the jobs
        required: false
        type: string
        default: blacksmith-4vcpu-ubuntu-2404
    outputs:
      in_scope:
        description: 'Whether the pull request was gated by this workflow (true/false)'
        value: ${{ jobs.detect.outputs.in-scope == 'true' && 'true' || 'false' }}
      has_breaking_changes:
        description: 'Whether at least one pull request commit is breaking (true/false). Always false when out of scope — nothing was scanned.'
        value: ${{ jobs.detect.outputs.has-breaking-changes == 'true' && 'true' || 'false' }}
      approved:
        description: 'Whether a reviewer approved the breaking change through the Environment (true/false)'
        value: ${{ jobs.outcome.outputs.approved == 'true' && 'true' || 'false' }}
      result:
        description: 'Gate verdict (success/failure)'
        value: ${{ jobs.outcome.outputs.result == 'success' && 'success' || 'failure' }}
    secrets:
      MANAGE_TOKEN:
        description: 'Token with `pull-requests: write` on the target repository. Falls back to `github.token` when absent, which is enough for same-repository pull requests.'
        required: false

# No `workflow_dispatch`: reusable workflows in this repository do not offer one —
# manual triggering belongs in a `self-*` entrypoint.

permissions:
  contents: read

jobs:
  # ----------------- Scope resolution and breaking-change detection -----------------
  detect:
    name: Detect Breaking Changes
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      in-scope: ${{ steps.scope.outputs.in-scope }}
      pr-number: ${{ steps.scope.outputs.pr-number }}
      base-ref: ${{ steps.scope.outputs.base-ref }}
      head-sha: ${{ steps.scope.outputs.head-sha }}
      author: ${{ steps.scope.outputs.author }}
      reason: ${{ steps.scope.outputs.reason }}
      has-breaking-changes: ${{ steps.normalize.outputs.has-breaking-changes }}
      acknowledged: ${{ steps.normalize.outputs.acknowledged }}
      detection-succeeded: ${{ steps.normalize.outputs.detection-succeeded }}

    steps:
      - name: Resolve scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.MANAGE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          SCOPE_RULES: ${{ inputs.scope_rules }}
          ADDITIONAL_SCOPE_RULES: ${{ inputs.additional_scope_rules }}
          FORCE_LABELS: ${{ inputs.force_labels }}
          SKIP_LABELS: ${{ inputs.skip_labels }}
          IGNORE_AUTHORS: ${{ inputs.ignore_authors }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail

          pr_number="$INPUT_PR_NUMBER"
          if [ -z "$pr_number" ] || [ "$pr_number" = "0" ]; then
            pr_number="$EVENT_PR_NUMBER"
          fi

          if [ -z "$pr_number" ]; then
            echo "No pull request number — pass \`pr_number\` or call this workflow from an event that carries one." >&2
            exit 1
          fi

          # Read the live pull request rather than the event payload, which is
          # frozen at dispatch. A run started before a retarget would otherwise
          # decide against a base branch that no longer applies.
          read -r base head head_sha author < <(
            gh pr view "$pr_number" --repo "$REPO" \
              --json baseRefName,headRefName,headRefOid,author \
              --jq '"\(.baseRefName) \(.headRefName) \(.headRefOid) \(.author.login)"'
          )

          labels=$(gh pr view "$pr_number" --repo "$REPO" --json labels --jq '.labels[].name')

          # Three spellings of the same bot, all of which must match. REST says
          # `dependabot[bot]`, GraphQL says `dependabot`, and `gh pr view --json
          # author` — the call above — says `app/dependabot`, because the CLI
          # prefixes bot logins with `app/`. Strip the affixes from both sides so a
          # caller can write whichever spelling it last saw.
          normalise_login() {
            local login="${1,,}"
            login="${login#app/}"
            printf '%s' "${login%\[bot\]}"
          }

          has_label() {
            local wanted="${1,,}" name
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              [ "${name,,}" = "$wanted" ] && return 0
            done <<< "$labels"
            return 1
          }

          matches_any_label() {
            local list="$1" entry
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              if has_label "$entry"; then
                printf '%s' "$entry"
                return 0
              fi
            done < <(tr ',' '\n' <<< "$list" | xargs -n1 2>/dev/null)
            return 1
          }

          emit() {
            {
              echo "in-scope=$1"
              echo "reason=$2"
              echo "pr-number=$pr_number"
              echo "base-ref=$base"
              echo "head-sha=$head_sha"
              echo "author=$author"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::DRY RUN — no comment, no label, and no approval will be requested"
            echo "  pull request      : #${pr_number}"
            echo "  head → base       : ${head} → ${base}"
            echo "  head commit       : ${head_sha}"
            echo "  author            : ${author}"
            echo "  labels            : [$(tr '\n' ',' <<< "$labels" | sed 's/,$//')]"
            echo "  scope rules       : ${SCOPE_RULES}"
            echo "  additional rules  : [${ADDITIONAL_SCOPE_RULES}]"
            echo "  force labels      : [${FORCE_LABELS}]"
            echo "  skip labels       : [${SKIP_LABELS}]"
            echo "  ignored authors   : [${IGNORE_AUTHORS}]"
          fi

          # Authors vetoed outright, before scope is even considered — an exclusion
          # expressed as another scope dimension would lose to any positive match.
          author_key=$(normalise_login "$author")
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            if [ "$author_key" = "$(normalise_login "$entry")" ]; then
              echo "::notice::PR #${pr_number} was opened by ${author}, an ignored author — not gated"
              emit false "ignored author '${author}'"
              exit 0
            fi
          done < <(tr ',' '\n' <<< "$IGNORE_AUTHORS" | xargs -n1 2>/dev/null)

          if [ -n "$SKIP_LABELS" ] && skip_hit=$(matches_any_label "$SKIP_LABELS"); then
            echo "::notice::PR #${pr_number} carries the '${skip_hit}' label — not gated"
            emit false "skip label '${skip_hit}'"
            exit 0
          fi

          # Both objects validated before the merge so a malformed rule set fails
          # closed here rather than silently gating nothing.
          validate_rules() {
            jq -e 'type == "object" and (to_entries | all(.value | type == "string"))' >/dev/null 2>&1 <<< "$1"
          }

          additional="${ADDITIONAL_SCOPE_RULES:-}"
          [ -z "$additional" ] && additional='{}'

          if ! validate_rules "$SCOPE_RULES"; then
            echo "scope_rules must be a JSON object of string values; got: ${SCOPE_RULES}" >&2
            exit 1
          fi

          if ! validate_rules "$additional"; then
            echo "additional_scope_rules must be a JSON object of string values; got: ${ADDITIONAL_SCOPE_RULES}" >&2
            exit 1
          fi

          # `*` is a shallow merge: a base present in both takes the additional
          # value, a base present only in the additional set is added.
          rules=$(jq -cn --argjson base "$SCOPE_RULES" --argjson extra "$additional" '$base * $extra')
          patterns=$(jq -r --arg base "$base" '.[$base] // ""' <<< "$rules")

          matched=""
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            # shellcheck disable=SC2254
            case "$head" in
              $entry) matched="rule ${base} ← '${entry}'"; break ;;
            esac
          done < <(tr '|' '\n' <<< "$patterns" | xargs -n1 2>/dev/null)

          if [ -z "$matched" ] && [ -n "$FORCE_LABELS" ] && force_hit=$(matches_any_label "$FORCE_LABELS"); then
            matched="force label '${force_hit}'"
          fi

          if [ -z "$matched" ]; then
            echo "::notice::PR #${pr_number} (${head} → ${base}) is outside the breaking-change scope — not gated"
            emit false "no rule matches ${head} → ${base}"
            exit 0
          fi

          echo "::notice::PR #${pr_number} is gated for breaking changes via ${matched}"
          emit true "$matched"

      # The composite reads Git history, so it needs `origin/<base>` and a HEAD
      # that is the pull request. The second checkout exists because the first
      # one leaves HEAD on the event's commit, which is only the pull request
      # under `pull_request`. `clean: false` keeps what the first one fetched.
      - name: Check out full history
        id: checkout
        if: steps.scope.outputs.in-scope == 'true' && inputs.detected_breaking_changes == ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Move HEAD onto the pull request head
        id: checkout-head
        if: steps.scope.outputs.in-scope == 'true' && steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: refs/pull/${{ steps.scope.outputs.pr-number }}/head
          fetch-depth: 0
          clean: false
          persist-credentials: false

      # Nothing from the checked-out tree is executed — the composite only reads
      # commit messages — so fork code never runs here.
      - name: Detect breaking changes
        id: guard
        if: steps.scope.outputs.in-scope == 'true' && steps.checkout-head.outcome == 'success' && inputs.detected_breaking_changes == ''
        continue-on-error: true
        uses: LerianStudio/github-actions-shared-workflows/src/validate/breaking-change-guard@v1
        with:
          base-ref: ${{ steps.scope.outputs.base-ref }}
          breaking-change-acknowledgement: ${{ inputs.author_acknowledgement }}
          acknowledgement-match-mode: exact-visible-line

      - name: Normalize detection result
        id: normalize
        if: always()
        env:
          IN_SCOPE: ${{ steps.scope.outputs.in-scope }}
          SUPPLIED_HAS_BREAKING_CHANGES: ${{ inputs.detected_breaking_changes }}
          SUPPLIED_ACKNOWLEDGED: ${{ inputs.detected_acknowledged }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CHECKOUT_HEAD_OUTCOME: ${{ steps.checkout-head.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          RAW_HAS_BREAKING_CHANGES: ${{ steps.guard.outputs.has-breaking-changes }}
          RAW_ACKNOWLEDGED: ${{ steps.guard.outputs.approved }}
        run: |
          set -euo pipefail

          has_breaking_changes=false
          acknowledged=false
          detection_succeeded=false

          if [ "$IN_SCOPE" != "true" ]; then
            # Nothing was scanned, and nothing needs to be: an out-of-scope pull
            # request is a successful no-op, not a failed detection.
            detection_succeeded=true
          elif [ -n "$SUPPLIED_HAS_BREAKING_CHANGES" ]; then
            # The caller already ran the same composite over the same commits.
            # Anything but a clean boolean is a wiring mistake, and a wiring
            # mistake must not read as "no breaking changes".
            case "$SUPPLIED_HAS_BREAKING_CHANGES" in
              true | false )
                has_breaking_changes="$SUPPLIED_HAS_BREAKING_CHANGES"
                [ "$SUPPLIED_ACKNOWLEDGED" = "true" ] && acknowledged=true
                detection_succeeded=true
                ;;
              unknown )
                # The documented way for a caller to say "my own detection did not
                # complete". It must not read as "no breaking changes".
                echo "The caller reported that its breaking-change detection did not complete — failing closed." >&2
                ;;
              * )
                echo "detected_breaking_changes must be 'true', 'false', 'unknown' or empty; got '${SUPPLIED_HAS_BREAKING_CHANGES}'." >&2
                ;;
            esac
          elif [ "$CHECKOUT_OUTCOME" = "success" ] && [ "$CHECKOUT_HEAD_OUTCOME" = "success" ] \
            && [ "$GUARD_OUTCOME" = "success" ] \
            && { [ "$RAW_HAS_BREAKING_CHANGES" = "true" ] || [ "$RAW_HAS_BREAKING_CHANGES" = "false" ]; } \
            && { [ "$RAW_ACKNOWLEDGED" = "true" ] || [ "$RAW_ACKNOWLEDGED" = "false" ]; }; then
            has_breaking_changes="$RAW_HAS_BREAKING_CHANGES"
            acknowledged="$RAW_ACKNOWLEDGED"
            detection_succeeded=true
          else
            echo "Breaking change detection failed: checkout=${CHECKOUT_OUTCOME} checkout_head=${CHECKOUT_HEAD_OUTCOME} guard=${GUARD_OUTCOME}" >&2
          fi

          {
            echo "has-breaking-changes=$has_breaking_changes"
            echo "acknowledged=$acknowledged"
            echo "detection-succeeded=$detection_succeeded"
          } >> "$GITHUB_OUTPUT"

  # ----------------- Ask for the approval -----------------
  # Runs before the Environment gate so the reviewer arrives at a pull request
  # that already explains what they are being asked, and so the preflight refuses
  # an unprotected Environment before anything depends on it.
  request:
    name: Request Approval
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    needs: [detect]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify the breaking-approval Environment is protected
        if: >-
          needs.detect.result == 'success'
          && needs.detect.outputs.has-breaking-changes == 'true'
          && inputs.require_protected_environment
          && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.MANAGE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A job whose `environment:` names something that does not exist CREATES
          # it, with no protection rules, and sails straight through. The gate would
          # then be a green check that gates nothing — the worst possible failure for
          # a control like this, because it looks like it is working.
          if ! rules=$(gh api "repos/${REPO}/environments/breaking-approval" \
                 --jq '[.protection_rules[].type] | join(",")' 2>/dev/null); then
            echo "The 'breaking-approval' Environment could not be read in ${REPO}." >&2
            echo "Create it under Settings → Environments with 'Required reviewers' (and 'Prevent self-review') enabled." >&2
            echo "If the Environment exists and only the API read is blocked, set require_protected_environment: false." >&2
            exit 1
          fi

          if [[ "$rules" != *required_reviewers* ]]; then
            echo "The 'breaking-approval' Environment in ${REPO} has no required reviewers (rules: ${rules:-none})." >&2
            echo "Without them the approval job would resolve on its own and the gate would pass every breaking change." >&2
            exit 1
          fi

          echo "::notice::'breaking-approval' is protected by required reviewers"

      - name: Announce the pending approval
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MANAGE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          DETECT_RESULT: ${{ needs.detect.result }}
          IN_SCOPE: ${{ needs.detect.outputs.in-scope }}
          REASON: ${{ needs.detect.outputs.reason }}
          PR_NUMBER: ${{ needs.detect.outputs.pr-number }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          HAS_BREAKING_CHANGES: ${{ needs.detect.outputs.has-breaking-changes }}
          ACKNOWLEDGED: ${{ needs.detect.outputs.acknowledged }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOSE_ON_REJECTION: ${{ inputs.close_on_rejection && 'true' || 'false' }}
          LABEL: ${{ inputs.label }}
          ENABLE_COMMENT: ${{ inputs.enable_comment && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail

          if [ "$DETECT_RESULT" != "success" ] || [ "$IN_SCOPE" != "true" ] \
            || [ "$HAS_BREAKING_CHANGES" != "true" ] || [ "$DRY_RUN" = "true" ]; then
            exit 0
          fi

          # shellcheck disable=SC2016  # the backticks below are Markdown code spans, not command substitutions
          {
            printf '<!-- breaking-change-approval -->\n\n'
            printf '### 🚨 Breaking change — approval required\n\n'
            printf 'A breaking-change commit was found on this branch, so merging it will force the next release to a **major** version.\n\n'
            printf 'This pull request is held at the `breaking-approval` Environment until a reviewer answers one question: **is this breaking change necessary?**\n\n'
            printf '👉 **[Review the pending deployment](%s)** — *Review deployments* → `breaking-approval`.\n\n' "$RUN_URL"
            printf '| | |\n|---|---|\n'
            printf '| Gated via | `%s` |\n' "$REASON"
            printf '| Head commit | `%s` |\n' "${HEAD_SHA:0:7}"
            printf '| Author acknowledgement in the description | %s |\n' \
              "$([ "$ACKNOWLEDGED" = "true" ] && echo "present" || echo "missing")"
            printf '\n'
            printf '**Approving** records that the approvers consider the break necessary, and releases the merge.\n\n'
            if [ "$CLOSE_ON_REJECTION" = "true" ]; then
              printf '**Rejecting** records that it is not, and **closes this pull request** so the change can be reworked without the break. Reopening is one click and the branch is untouched.\n\n'
            else
              printf '**Rejecting** records that it is not, and fails this check.\n\n'
            fi
            printf 'If the break was unintentional, reword the commits — drop the `!` after the type and remove any `BREAKING CHANGE:` footer — and push again. No approval is needed then.\n'
          } > comment.md

          marker='<!-- breaking-change-approval -->'
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"${marker}\")) | .id] | first // empty")

          if [ "$ENABLE_COMMENT" = "true" ]; then
            if [ -n "$existing" ]; then
              gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@comment.md >/dev/null
            else
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md >/dev/null
            fi
          fi

          # Cosmetic — a repository that never declared the label still gets its gate.
          if [ -n "$LABEL" ] && ! gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL" >/dev/null 2>&1; then
            echo "::notice::Label '${LABEL}' not applied — it is not declared in ${REPO}. Cosmetic only."
          fi

          echo "::notice::PR #${PR_NUMBER} is waiting for a breaking-change approval — ${RUN_URL}"

  # ----------------- The gate itself -----------------
  # The whole job is the gate. It holds the run until a reviewer of the
  # `breaking-approval` Environment answers; the steps are only there to leave a
  # record. Skipped entirely when there is nothing to approve, so an ordinary
  # pull request never puts an entry in anybody's review queue.
  approval:
    name: Approve Breaking Change
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    needs: [detect, request]
    if: >-
      needs.detect.result == 'success'
      && needs.request.result == 'success'
      && needs.detect.outputs.has-breaking-changes == 'true'
      && !inputs.dry_run
    environment: breaking-approval
    permissions:
      contents: read
    steps:
      - name: Record the approval
        env:
          PR_NUMBER: ${{ needs.detect.outputs.pr-number }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          REASON: ${{ needs.detect.outputs.reason }}
        run: |
          set -euo pipefail
          echo "::notice::Breaking change on PR #${PR_NUMBER} (${HEAD_SHA:0:7}) approved — gated via ${REASON}"

  # ----------------- Verdict -----------------
  outcome:
    name: Breaking Change Approval
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    needs: [detect, request, approval]
    if: always()
    # Deliberately NOT declaring `actions: read`. A called workflow may only ask
    # for permissions the caller already holds, so declaring it would break every
    # consumer whose entrypoint does not grant it. The approvals API is read
    # through MANAGE_TOKEN when present, and degrades to the job conclusion when
    # it is not — see the fallback in the step.
    permissions:
      pull-requests: write
    outputs:
      approved: ${{ steps.verdict.outputs.approved }}
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - name: Resolve the verdict
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.MANAGE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DETECT_RESULT: ${{ needs.detect.result }}
          REQUEST_RESULT: ${{ needs.request.result }}
          APPROVAL_RESULT: ${{ needs.approval.result }}
          IN_SCOPE: ${{ needs.detect.outputs.in-scope }}
          REASON: ${{ needs.detect.outputs.reason }}
          PR_NUMBER: ${{ needs.detect.outputs.pr-number }}
          HEAD_SHA: ${{ needs.detect.outputs.head-sha }}
          HAS_BREAKING_CHANGES: ${{ needs.detect.outputs.has-breaking-changes }}
          ACKNOWLEDGED: ${{ needs.detect.outputs.acknowledged }}
          DETECTION_SUCCEEDED: ${{ needs.detect.outputs.detection-succeeded }}
          CLOSE_ON_REJECTION: ${{ inputs.close_on_rejection && 'true' || 'false' }}
          LABEL: ${{ inputs.label }}
          ENABLE_COMMENT: ${{ inputs.enable_comment && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail

          approved=false
          result=failure

          finish() {
            {
              echo "approved=$approved"
              echo "result=$result"
            } >> "$GITHUB_OUTPUT"
          }

          summarise() {
            {
              printf '## Breaking Change Approval\n\n'
              printf -- '- Pull request: #%s\n' "${PR_NUMBER:-?}"
              printf -- '- Scope: %s\n' "${REASON:-unresolved}"
              printf -- '- Breaking change: %s\n' "$1"
              printf -- '- Verdict: **%s**\n' "$result"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Detection failing is not "no breaking changes" — it is "we do not
          # know", and the point of the gate is that an unknown blocks.
          if [ "$DETECT_RESULT" != "success" ] || [ "$DETECTION_SUCCEEDED" != "true" ] \
            || [ "$REQUEST_RESULT" != "success" ]; then
            finish
            summarise "detection or preflight did not complete"
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice::DRY RUN — detection or preflight did not complete (detect=${DETECT_RESULT}, request=${REQUEST_RESULT}); a real run would block"
              exit 0
            fi
            echo "Breaking change gate could not run (detect=${DETECT_RESULT}, request=${REQUEST_RESULT}, detection_succeeded=${DETECTION_SUCCEEDED}) — failing closed." >&2
            exit 1
          fi

          if [ "$IN_SCOPE" != "true" ] || [ "$HAS_BREAKING_CHANGES" != "true" ]; then
            approved=true
            result=success
            finish
            summarise "none"
            echo "::notice::Nothing to approve on PR #${PR_NUMBER} — ${REASON}"
            # The label describes a state the pull request is no longer in; a
            # rewritten history should take it back off.
            if [ -n "$LABEL" ] && [ "$DRY_RUN" != "true" ] && [ -n "${PR_NUMBER:-}" ]; then
              gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$LABEL" >/dev/null 2>&1 || true
            fi
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            finish
            summarise "detected — an approval would have been requested"
            echo "::notice::DRY RUN — PR #${PR_NUMBER} would be held at the 'breaking-approval' Environment"
            echo "  gated via         : ${REASON}"
            echo "  head commit       : ${HEAD_SHA}"
            echo "  author ack line   : ${ACKNOWLEDGED}"
            echo "  on rejection      : $([ "$CLOSE_ON_REJECTION" = "true" ] && echo "close the pull request" || echo "fail the check")"
            exit 0
          fi

          # The Environment's own reviewer record is the source of truth, not the
          # job conclusion. A rejection and a cancellation can both leave the
          # approval job non-successful, and only one of them is a decision —
          # closing a pull request because a superseding push cancelled the run
          # would be indefensible.
          api_ok=true
          decisions=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/approvals" \
            --jq '.[] | select((.environments // []) | map(.name) | index("breaking-approval")) | [.state, .user.login, (.comment // "" | gsub("[\r\n]+"; " "))] | @tsv' 2>/dev/null) || { api_ok=false; decisions=""; }

          approvers=""
          rejecters=""
          rejection_comment=""
          while IFS=$'\t' read -r state login comment || [ -n "$state" ]; do
            [ -z "$state" ] && continue
            case "$state" in
              approved) approvers="${approvers:+$approvers, }${login}" ;;
              rejected)
                rejecters="${rejecters:+$rejecters, }${login}"
                [ -n "$comment" ] && rejection_comment="$comment"
                ;;
            esac
          done <<< "$decisions"

          # Reading the approvals needs `actions: read`, which the entrypoint may not
          # grant to a token this workflow cannot escalate. Without it a rejection
          # would be indistinguishable from an approval that never happened — so
          # fall back to the job conclusion, which separates the two well enough:
          # a rejection fails the approval job, while a cancellation cancels the
          # run and this job never reaches here at all.
          if [ -z "$rejecters" ] && [ "$api_ok" != "true" ] && [ "$APPROVAL_RESULT" = "failure" ]; then
            rejecters="a reviewer"
            echo "::warning::Could not read the Environment approvals (needs 'actions: read', or a MANAGE_TOKEN that has it). Treating the failed approval job as a rejection."
          fi

          if [ "$APPROVAL_RESULT" = "success" ] && [ -z "$rejecters" ]; then
            approved=true
            result=success
          fi

          # shellcheck disable=SC2016  # Markdown code spans
          {
            printf '<!-- breaking-change-approval -->\n\n'
            if [ "$approved" = "true" ]; then
              printf '### ✅ Breaking change approved\n\n'
              printf 'Approved by **%s** — the break is considered necessary and the next release will be a major version.\n\n' \
                "${approvers:-a reviewer}"
            elif [ -n "$rejecters" ]; then
              printf '### ⛔ Breaking change rejected\n\n'
              printf 'Rejected by **%s** — the break is not considered necessary.\n\n' "$rejecters"
              [ -n "$rejection_comment" ] && printf '> %s\n\n' "$rejection_comment"
              if [ "$CLOSE_ON_REJECTION" = "true" ]; then
                printf 'This pull request was closed. Rework the change so it does not break the contract — drop the `!` and any `BREAKING CHANGE:` footer once it no longer applies — then reopen it. The branch is untouched.\n\n'
              fi
            else
              printf '### 🚨 Breaking change — approval required\n\n'
              printf 'The approval did not complete. [Open the run](%s) and answer the pending `breaking-approval` deployment.\n\n' "$RUN_URL"
            fi
            printf '| | |\n|---|---|\n'
            printf '| Gated via | `%s` |\n' "$REASON"
            printf '| Head commit | `%s` |\n' "${HEAD_SHA:0:7}"
            printf '| Author acknowledgement in the description | %s |\n' \
              "$([ "$ACKNOWLEDGED" = "true" ] && echo "present" || echo "missing")"
            printf '| Decision | [%s](%s) |\n' "$result" "$RUN_URL"
          } > comment.md

          marker='<!-- breaking-change-approval -->'
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"${marker}\")) | .id] | first // empty")

          if [ "$ENABLE_COMMENT" = "true" ]; then
            if [ -n "$existing" ]; then
              gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@comment.md >/dev/null
            else
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md >/dev/null
            fi
          fi

          if [ -n "$LABEL" ] && [ "$approved" = "true" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$LABEL" >/dev/null 2>&1 || true
          fi

          finish
          summarise "$([ "$approved" = "true" ] && echo "approved by ${approvers}" || echo "not approved")"

          if [ "$approved" = "true" ]; then
            echo "::notice::PR #${PR_NUMBER} ships an approved breaking change (${approvers})"
            exit 0
          fi

          # Closing only on a recorded rejection, never on a cancellation.
          if [ -n "$rejecters" ] && [ "$CLOSE_ON_REJECTION" = "true" ]; then
            if gh pr close "$PR_NUMBER" --repo "$REPO" >/dev/null 2>&1; then
              echo "::notice::PR #${PR_NUMBER} closed — breaking change rejected by ${rejecters}"
            else
              echo "::warning::PR #${PR_NUMBER} could not be closed (token lacks pull-requests: write?) — the gate still failed"
            fi
          fi

          echo "PR #${PR_NUMBER} carries an unapproved breaking change — blocking the merge." >&2
          exit 1
