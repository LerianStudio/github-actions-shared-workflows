name: "Go CI"

# Reusable workflow for Go continuous integration
# Runs tests, builds binaries, lints code, and verifies formatting
# Supports multi-version Go testing across multiple operating systems

on:
  workflow_call:
    inputs:
      # ----------------- Change gate -----------------
      # A pull request or push that only touches documentation or repository
      # metadata has nothing for CI to check. The gate reuses
      # src/config/non-doc-changes, the same classifier behind the go-/js-
      # umbrella workflows, so the whole family agrees on what "docs" means.
      enable_doc_gate:
        description: 'Skip the pipeline when only documentation/meta files changed (see ignore_globs).'
        type: boolean
        default: true
      ignore_globs:
        description: 'Space-separated glob patterns treated as docs/meta; when every changed file matches one, the pipeline is skipped. Files under .github/workflows/, .github/actions/ and .github/scripts/ always count as code.'
        type: string
        default: '*.md docs/* .github/* LICENSE* .gitignore .coderabbit.yml .coderabbit.yaml'

      go_versions:
        description: 'JSON array of Go versions to test (e.g., ["1.21", "1.22", "1.23"])'
        type: string
        default: '["1.21", "1.22", "1.23"]'
      operating_systems:
        description: 'JSON array of operating systems to test on (e.g., ["ubuntu-latest", "macos-latest", "windows-latest"])'
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      runner_type:
        description: 'GitHub runner type for jobs that do not use matrix'
        type: string
        default: 'blacksmith-4vcpu-ubuntu-2404'
      go_version_lint:
        description: 'Go version for linting and other non-matrix jobs'
        type: string
        default: '1.23'
      build_cmd:
        description: 'Build command to execute (default: go build -v ./...)'
        type: string
        default: 'go build -v ./...'
      test_cmd:
        description: 'Test command to execute (default: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...)'
        type: string
        default: 'go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...'
      enable_coverage_comment:
        description: 'Enable Go coverage comment in PR'
        type: boolean
        default: true
      golangci_lint_version:
        description: 'golangci-lint version to use (default: latest)'
        type: string
        default: 'latest'
      golangci_lint_args:
        description: 'Additional arguments for golangci-lint'
        type: string
        default: '--timeout=5m'
      check_docs:
        description: 'Enable documentation completeness checks'
        type: boolean
        default: true
      check_module_tidy:
        description: 'Enable go.mod/go.sum tidiness check'
        type: boolean
        default: true
      enable_cross_platform_build:
        description: 'Enable cross-platform binary builds'
        type: boolean
        default: false
      build_targets:
        description: 'JSON array of build targets (e.g., [{"os": "linux", "arch": "amd64"}, {"os": "darwin", "arch": "arm64"}])'
        type: string
        default: '[]'
      build_path:
        description: 'Path to main package for cross-platform builds (e.g., ./cmd/myapp)'
        type: string
        default: './cmd'
permissions:
  contents: read
  pull-requests: write

jobs:
  # ----------------- Documentation Gate -----------------
  # Deliberately unconditional: a job skipped by its own `if` also skips
  # everything that `needs` it, which would take the whole pipeline down when a
  # caller sets enable_doc_gate: false. Instead the job always runs, the step
  # inside it is what is conditional, and an absent verdict falls back to
  # 'true' — assume code, run everything, exactly as before this gate existed.
  changes:
    name: Detect non-doc changes
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.gate.outputs.code || 'true' }}
    steps:
      - name: Non-doc change gate
        id: gate
        if: inputs.enable_doc_gate
        # An unreadable diff is not a verdict. A caller may grant less than
        # `pull-requests: read`, and a reusable workflow cannot elevate what its
        # caller restricted; failing here would block the pipeline the gate only
        # means to shorten. The empty output that follows reads as "assume code".
        continue-on-error: true
        uses: LerianStudio/github-actions-shared-workflows/src/config/non-doc-changes@v1
        with:
          github-token: ${{ github.token }}
          ignore-globs: ${{ inputs.ignore_globs }}

  test:
    name: Test
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.operating_systems) }}
        go: ${{ fromJson(inputs.go_versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: ${{ inputs.build_cmd }}

      - name: Run tests
        run: ${{ inputs.test_cmd }}

      - name: Upload coverage artifact
        if: inputs.enable_coverage_comment && matrix.os == 'ubuntu-latest' && matrix.go == inputs.go_version_lint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 7

  coverage-report:
    name: Coverage Report
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    needs: test
    if: inputs.enable_coverage_comment && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: coverage-report

      - name: Go Coverage Comment
        uses: fgrosse/go-coverage-report@e432de98ee94a276e8f666d25bfd76347665f75b  # v1.3.1
        with:
          coverage-artifact-name: coverage-report
          coverage-file-name: coverage.txt

  lint:
    name: Lint
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: ${{ inputs.go_version_lint }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: ${{ inputs.golangci_lint_version }}
          args: ${{ inputs.golangci_lint_args }}

  build:
    name: Build Binary
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    needs: [test, lint]
    if: inputs.enable_cross_platform_build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: ${{ inputs.go_version_lint }}
          cache: true

      - name: Build cross-platform binaries
        env:
          BUILD_TARGETS: ${{ inputs.build_targets }}
          BUILD_PATH: ${{ inputs.build_path }}
        run: |
          targets="$BUILD_TARGETS"
          if [ "$targets" = "[]" ] || [ -z "$targets" ]; then
            echo "No build targets specified, using defaults"
            targets='[
              {"os": "linux", "arch": "amd64"},
              {"os": "linux", "arch": "arm64"},
              {"os": "darwin", "arch": "amd64"},
              {"os": "darwin", "arch": "arm64"},
              {"os": "windows", "arch": "amd64"}
            ]'
          fi

          echo "$targets" | jq -c '.[]' | while read -r target; do
            os=$(echo "$target" | jq -r '.os')
            arch=$(echo "$target" | jq -r '.arch')
            binary_name="${{ github.event.repository.name }}-${os}-${arch}"

            if [ "$os" = "windows" ]; then
              binary_name="${binary_name}.exe"
            fi

            echo "Building for $os/$arch..."
            GOOS="$os" GOARCH="$arch" go build -o "build/$binary_name" "$BUILD_PATH"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: binaries
          path: build/
          retention-days: 7

  verify-module:
    name: Verify Module
    if: needs.changes.outputs.code == 'true' && inputs.check_module_tidy
    needs: changes
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: ${{ inputs.go_version_lint }}
          cache: true

      - name: Verify module
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  check-format:
    name: Check Formatting
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: ${{ inputs.go_version_lint }}
          cache: true

      - name: Check gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files need formatting:"
            gofmt -s -l .
            exit 1
          fi

      - name: Check go vet
        run: go vet ./...

  # Deliberately outside the gate: this job asserts README/LICENSE/SECURITY and
  # friends are present and their links resolve, so documentation is its input,
  # not a reason to skip. Gating it would let a pull request that deletes
  # README.md skip the check that exists to catch exactly that.
  check-docs:
    name: Check Documentation
    if: inputs.check_docs
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check required files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f LICENSE

      - name: Validate Markdown links
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068  # v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'
        continue-on-error: true
