name: Self — PR Validation

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  # ----------------- PR Validation -----------------
  validation:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    uses: ./.github/workflows/pr-validation.yml
    with:
      enforce_source_branches: true
      allowed_source_branches: "develop|hotfix/*"
      target_branches_for_source_check: "main"
    secrets: inherit

  # ----------------- Changed Files Detection -----------------
  changed-files:
    name: Detect Changed Files
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      yaml_files: ${{ steps.detect.outputs.yaml-files }}
      workflow_files: ${{ steps.detect.outputs.workflow-files }}
      action_files: ${{ steps.detect.outputs.action-files }}
      composite_files: ${{ steps.detect.outputs.composite-files }}
      markdown_files: ${{ steps.detect.outputs.markdown-files }}
      all_files: ${{ steps.detect.outputs.all-files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Detect changed files
        id: detect
        uses: ./src/config/changed-workflows
        with:
          github-token: ${{ github.token }}

  # ----------------- Breaking Change Guard Detector Tests -----------------
  breaking-change-guard-tests:
    name: Breaking Change Guard Detector Tests
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run breaking-change detector matrix
        run: bash src/validate/breaking-change-guard/test.sh

      - name: Run breaking-change workflow integration tests
        run: python3 src/validate/breaking-change-guard/test-workflow.py

  # ----------------- Permission Manifest Publish Tests -----------------
  permission-manifest-publish-tests:
    name: Permission Manifest Publish Tests
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run permission-manifest-publish behavioural tests
        run: python3 src/validate/permission-manifest-publish/test.py

  # ----------------- Commit Signature Validation Tests -----------------
  pr-commit-signatures-tests:
    name: Commit Signature Validation Tests
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run pr-commit-signatures behavioural tests
        run: python3 src/validate/pr-commit-signatures/test.py

  # ----------------- YAML Lint -----------------
  yamllint:
    name: YAML Lint
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.yaml_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: YAML Lint
        uses: ./src/lint/yamllint
        with:
          file-or-dir: ${{ needs.changed-files.outputs.yaml_files }}

  # ----------------- Action Lint -----------------
  actionlint:
    name: Action Lint
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.workflow_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Action Lint
        uses: ./src/lint/actionlint
        with:
          files: ${{ needs.changed-files.outputs.workflow_files }}

  # ----------------- Pinned Actions Check -----------------
  pinned-actions:
    name: Pinned Actions Check
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.action_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Pinned Actions Check
        uses: ./src/lint/pinned-actions
        with:
          files: ${{ needs.changed-files.outputs.action_files }}

  # ----------------- CodeQL Action Version Consistency -----------------
  codeql-action-versions:
    name: CodeQL Action Version Consistency
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: CodeQL Action Version Check
        uses: ./src/lint/codeql-action-version-check

  # ----------------- Markdown Link Check -----------------
  markdown-link-check:
    name: Markdown Link Check
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.markdown_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Markdown Link Check
        uses: ./src/lint/markdown-link-check
        with:
          file-path: ${{ needs.changed-files.outputs.markdown_files }}

  # ----------------- Spelling Check -----------------
  typos:
    name: Spelling Check
    needs: changed-files
    if: needs.changed-files.outputs.all_files != ''
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Spelling Check
        uses: ./src/lint/typos
        with:
          files: ${{ needs.changed-files.outputs.all_files }}

  # ----------------- Shell Check -----------------
  shellcheck:
    name: Shell Check
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.action_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Shell Check
        uses: ./src/lint/shellcheck
        with:
          files: ${{ needs.changed-files.outputs.action_files }}

  # ----------------- README Check -----------------
  readme-check:
    name: README Check
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.action_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: README Check
        uses: ./src/lint/readme-check
        with:
          files: ${{ needs.changed-files.outputs.action_files }}

  # ----------------- Composite Schema Lint -----------------
  composite-schema:
    name: Composite Schema Lint
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.composite_files != ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Composite Schema Lint
        uses: ./src/lint/composite-schema
        with:
          files: ${{ needs.changed-files.outputs.composite_files }}

  # ----------------- Deployment Matrix Lint -----------------
  deployment-matrix:
    name: Deployment Matrix Lint
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: contains(needs.changed-files.outputs.all_files, 'config/deployment-matrix.yml')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Deployment Matrix Lint
        uses: ./src/lint/deployment-matrix
        with:
          manifest-file: config/deployment-matrix.yml

  # ----------------- CodeQL Analysis -----------------
  codeql:
    name: CodeQL Analysis
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: changed-files
    if: needs.changed-files.outputs.action_files != ''
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Generate CodeQL config for changed files
        id: codeql-config
        uses: ./src/security/codeql-config
        with:
          changed-paths: ${{ needs.changed-files.outputs.action_files }}

      - name: Initialize CodeQL
        if: steps.codeql-config.outputs.skip != 'true'
        uses: ./src/security/codeql-init
        with:
          languages: actions
          config-file: ${{ steps.codeql-config.outputs.config-file }}

      - name: Perform CodeQL Analysis
        if: steps.codeql-config.outputs.skip != 'true'
        uses: ./src/security/codeql-analyze
        with:
          category: '/language:actions'
          upload: 'true'

      - name: Post CodeQL Results to PR
        if: always() && github.event_name == 'pull_request' && steps.codeql-config.outputs.skip != 'true'
        uses: ./src/security/codeql-reporter
        with:
          github-token: ${{ secrets.MANAGE_TOKEN || github.token }}
          languages: actions

  # ----------------- Lint Report -----------------
  lint-report:
    name: Lint Report
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      checks: read
    needs: [changed-files, yamllint, actionlint, pinned-actions, markdown-link-check, typos, shellcheck, readme-check, composite-schema, deployment-matrix]
    if: always() && github.event_name == 'pull_request' && needs.changed-files.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Post Lint Report
        uses: ./src/notify/pr-lint-reporter
        with:
          github-token: ${{ secrets.MANAGE_TOKEN || github.token }}
          yamllint-result: ${{ needs.yamllint.result }}
          yamllint-files: ${{ needs.changed-files.outputs.yaml_files }}
          actionlint-result: ${{ needs.actionlint.result }}
          actionlint-files: ${{ needs.changed-files.outputs.workflow_files }}
          pinned-actions-result: ${{ needs.pinned-actions.result }}
          pinned-actions-files: ${{ needs.changed-files.outputs.action_files }}
          markdown-result: ${{ needs.markdown-link-check.result }}
          markdown-files: ${{ needs.changed-files.outputs.markdown_files }}
          typos-result: ${{ needs.typos.result }}
          typos-files: ${{ needs.changed-files.outputs.all_files }}
          shellcheck-result: ${{ needs.shellcheck.result }}
          shellcheck-files: ${{ needs.changed-files.outputs.action_files }}
          readme-result: ${{ needs.readme-check.result }}
          readme-files: ${{ needs.changed-files.outputs.action_files }}
          composite-schema-result: ${{ needs.composite-schema.result }}
          composite-schema-files: ${{ needs.changed-files.outputs.composite_files }}
          deployment-matrix-result: ${{ needs.deployment-matrix.result }}
          deployment-matrix-files: ${{ contains(needs.changed-files.outputs.all_files, 'config/deployment-matrix.yml') && 'config/deployment-matrix.yml' || '' }}

  # ----------------- CodeRabbit Gate -----------------
  # Single owner of when CodeRabbit reviews anything in this repository.
  #
  # `.coderabbit.yml` sets `reviews.auto_review.enabled: false`, which inverts the
  # default to "do not review": nothing is reviewed unless the `review-ready`
  # label is present. Applying that label is therefore the only trigger, and this
  # job is the only place that applies it — so both questions, *whether* a PR is
  # in scope and *whether* it is green, are answered here and nowhere else.
  #
  # Scope is configurable through repository variables, defaulting to the previous
  # hardcoded behaviour:
  #
  #   CODERABBIT_REVIEW_BASE_BRANCHES  comma-separated exact base branch names
  #                                    (default: develop)
  #   CODERABBIT_REVIEW_HEAD_PATTERNS  comma-separated globs matched against the
  #                                    head branch (default: hotfix/*)
  #
  # A PR is in scope when its base is listed, or its head matches a pattern. The
  # head patterns exist for branches that must be reviewed wherever they land —
  # hotfix/* carries code that never passed through develop, so it was never
  # reviewed anywhere. Setting both variables to an empty string disables reviews
  # entirely without touching this file.
  #
  # `revoke-coderabbit` withdraws the label as soon as a new revision is pushed,
  # so it has to be re-earned by that revision. Without it the label from the
  # previous run would still be on the PR while the new checks run, and since
  # incremental reviews stay enabled, CodeRabbit would review a revision that may
  # well be failing — exactly what the gate exists to prevent. It also means each
  # green push re-applies the label and therefore does get reviewed.
  revoke-coderabbit:
    name: Hold CodeRabbit Review
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      pull-requests: write
    # No `needs`: this must land before the checks finish, not after them.
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    steps:
      - name: Withdraw review-ready label
        env:
          GH_TOKEN: ${{ secrets.MANAGE_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')

          # `gh pr edit --remove-label` errors out when the label does not exist
          # in the repository, so only call it when the PR actually carries it.
          case " $labels " in
            *" review-ready "*)
              echo "🔒 New revision pushed — withdrawing review-ready from PR #${PR_NUMBER}"
              gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label review-ready
              echo "✅ Withdrawn — the revision must pass the checks to earn it back"
              ;;
            *)
              echo "✅ PR #${PR_NUMBER} does not carry review-ready — nothing to withdraw"
              ;;
          esac

  gate-coderabbit:
    name: Release CodeRabbit Review
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      pull-requests: write
    needs:
      # Ordering guarantee: the withdrawal must never land after this job's
      # re-application. If it failed, the gate stays closed rather than releasing
      # a label we could not withdraw.
      - revoke-coderabbit
      - validation
      - changed-files
      - breaking-change-guard-tests
      - permission-manifest-publish-tests
      - pr-commit-signatures-tests
      - yamllint
      - actionlint
      - pinned-actions
      - codeql-action-versions
      - markdown-link-check
      - typos
      - shellcheck
      - readme-check
      - composite-schema
      - deployment-matrix
      - codeql
    # `always()` so skipped lints (no matching files changed) do not block the
    # gate; only a real failure or cancellation does. Draft PRs are excluded —
    # `drafts: false` in .coderabbit.yml means the label would be inert anyway.
    #
    # Scope is deliberately NOT filtered here. `github.base_ref` comes from the
    # event payload and is frozen at dispatch, so a run that started before a
    # retarget would evaluate a branch that no longer applies. The step below
    # reads the live pull request instead, which keeps the decision in one place
    # and correct regardless of how many runs are in flight.
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    steps:
      - name: Apply review-ready label
        env:
          GH_TOKEN: ${{ secrets.MANAGE_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Empty string is meaningful: it removes that dimension from the scope.
          # Both empty disables CodeRabbit reviews without editing this workflow.
          REVIEW_BASE_BRANCHES: ${{ vars.CODERABBIT_REVIEW_BASE_BRANCHES || 'develop' }}
          REVIEW_HEAD_PATTERNS: ${{ vars.CODERABBIT_REVIEW_HEAD_PATTERNS || 'hotfix/*' }}
        run: |
          # Live read, not the frozen event payload — see the `if:` above.
          read -r base head < <(
            gh pr view "$PR_NUMBER" --repo "$REPO" \
              --json baseRefName,headRefName \
              --jq '"\(.baseRefName) \(.headRefName)"'
          )

          matched=""

          # Exact match on the base branch.
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            if [ "$base" = "$entry" ]; then
              matched="base '${entry}'"
              break
            fi
          done < <(tr ',' '\n' <<< "$REVIEW_BASE_BRANCHES" | xargs -n1 2>/dev/null)

          # Glob match on the head branch, for branches that must be reviewed
          # wherever they land.
          if [ -z "$matched" ]; then
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              # shellcheck disable=SC2254
              case "$head" in
                $entry) matched="head pattern '${entry}'"; break ;;
              esac
            done < <(tr ',' '\n' <<< "$REVIEW_HEAD_PATTERNS" | xargs -n1 2>/dev/null)
          fi

          echo "📌 PR #${PR_NUMBER}: ${head} → ${base}"
          echo "   scope: bases=[${REVIEW_BASE_BRANCHES}] head patterns=[${REVIEW_HEAD_PATTERNS}]"

          if [ -z "$matched" ]; then
            echo "⏭️ Out of the review scope — withholding review-ready, CodeRabbit will not review this PR"
            exit 0
          fi

          echo "✅ In scope via ${matched}, and every required check passed — releasing CodeRabbit"

          # Idempotent: re-adding a label the PR already carries is a no-op.
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label review-ready
