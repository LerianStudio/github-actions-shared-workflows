name: "JS Release"

# Umbrella reusable workflow for JavaScript/TypeScript service repositories.
# On branch pushes it runs semantic-release (gated by a non-doc change detector);
# on tag pushes it builds and pushes the container image and then updates the
# GitOps repository. A caller only needs to reference this single workflow.

on:
  workflow_call:
    inputs:
      runner_type:
        description: 'GitHub runner type to use'
        type: string
        default: 'blacksmith-4vcpu-ubuntu-2404'
      release_runner_type:
        description: 'Optional runner override for the Release (publish) jobs only (forwarded to release.yml as publish_runner_type). Empty = vars.GENERAL_RUNNERS, then runner_type.'
        type: string
        default: ''
      dry_run:
        description: 'Run semantic-release in dry-run mode (no tags/releases created) and preview the backmerge instead of applying it'
        required: false
        type: boolean
        default: false

      # ----------------- Change gate -----------------
      ignore_globs:
        description: 'Space-separated glob patterns treated as docs/meta; when only these change on a branch push, the release is skipped.'
        type: string
        default: '*.md docs/* .github/* LICENSE* .gitignore .coderabbit.yml .coderabbit.yaml'
      release_on_workflow_changes:
        description: 'Release when a branch push touches only .github/workflows/, .github/actions/ or .github/scripts/. Off by default: a pipeline edit ships byte-identical code, and releasing it moves GitOps tags and writes a changelog entry for a CI tweak. Turn it on in a repository whose released artifact lives under .github/ (one that publishes composite actions, say).'
        type: boolean
        default: false

      # ----------------- Release (release.yml) -----------------
      semantic_version:
        description: 'Semantic release version to use'
        type: string
        default: '23.0.8'
      enable_changelog:
        description: 'Generate CHANGELOG.md files via GPT after a successful release'
        type: boolean
        default: false
      enable_major_tag:
        description: 'Force-update the floating major version tag (e.g. v1) after a successful release'
        type: boolean
        default: false
      stable_releases_only:
        description: 'Only generate changelogs for stable releases (skip beta/rc/alpha tags)'
        type: boolean
        default: true
      changelog_release_branch:
        description: 'Branch whose tags get a changelog. Empty derives it from the run: the branch that triggered the release, falling back to searching which branch contains the tag commit for tag-triggered runs. Set it only for layouts neither step can infer.'
        type: string
        default: ''
      release_single_app:
        description: 'Force single-app mode for the release job even when filter_paths is set. Use for repos with one version tag but multiple Docker images.'
        type: boolean
        default: false
      backmerge_enabled:
        description: 'Backmerge the release branch into the target branch after a successful release'
        type: boolean
        default: true
      backmerge_source:
        description: 'Release branch eligible for backmerge'
        type: string
        default: 'main'
      backmerge_target:
        description: 'Branch that receives the backmerge'
        type: string
        default: 'develop'
      backmerge_mode:
        description: 'Backmerge strategy: direct | pr | direct-with-pr-fallback'
        type: string
        default: 'direct-with-pr-fallback'
      filter_paths:
        description: 'Newline-separated list of path prefixes to filter. Empty = single-app repo.'
        type: string
        default: ''
      shared_paths:
        description: 'Newline-separated path patterns that trigger a release/build for all components.'
        type: string
        default: ''
      path_level:
        description: 'Directory depth level to extract app name (e.g., 2 -> "apps/agent")'
        type: string
        default: '2'
      enable_release_announcement:
        description: 'Announce the published release to the repository Slack channel after a successful release'
        type: boolean
        default: true
      announcement_product_name:
        description: 'Product name displayed in the announcement. Defaults to the repository name.'
        type: string
        default: ''
      announcement_slack_channel:
        description: 'Slack channel that receives the announcement. Defaults to the RELEASE_SLACK_CHANNEL repository variable; the announcement is skipped when both are empty.'
        type: string
        default: ''

      # ----------------- Build (typescript-build.yml) -----------------
      enable_dockerhub:
        description: 'Enable pushing to DockerHub'
        type: boolean
        default: true
      enable_ghcr:
        description: 'Enable pushing to GitHub Container Registry'
        type: boolean
        default: true
      enable_gitops_artifacts:
        description: 'Enable GitOps artifacts upload for the downstream gitops-update job'
        type: boolean
        default: false
      app_name_prefix:
        description: 'Prefix for app names in monorepo (e.g., "midaz" -> "midaz-agent")'
        type: string
        default: ''
      app_name_overrides:
        description: 'Explicit app name mappings in "path:name" format. Overrides default extraction for matched paths.'
        type: string
        default: ''
      dockerfile_name:
        description: 'Name of the Dockerfile'
        type: string
        default: 'Dockerfile'
      build_context:
        description: 'Docker build context (defaults to repository root)'
        type: string
        default: '.'
      build_secrets:
        description: 'Additional secrets for docker build (one per line). npmrc is always included automatically.'
        type: string
        default: ''
      enable_cosign_sign:
        description: 'Sign container images with cosign keyless (OIDC) signing after push'
        type: boolean
        default: true
      dockerhub_org:
        description: 'DockerHub organization name'
        type: string
        default: 'lerianstudio'
      force_full_matrix:
        description: 'Build all filter_paths components on every run regardless of what changed. Set false to build only changed components.'
        type: boolean
        default: true

      # ----------------- Helm Dispatch (typescript-build.yml) -----------------
      enable_helm_dispatch:
        description: 'Dispatch stable image releases to the Helm repository for chart updates'
        type: boolean
        default: false
      helm_repository:
        description: 'Helm repository to dispatch to (org/repo format)'
        type: string
        default: 'LerianStudio/helm'
      helm_chart:
        description: 'Helm chart name to update (required when enable_helm_dispatch is true)'
        type: string
        default: ''
      helm_target_ref:
        description: 'Target branch in the Helm repository'
        type: string
        default: 'main'
      helm_components_base_path:
        description: 'Base path for components in the source repository'
        type: string
        default: 'components'
      helm_env_file:
        description: 'Environment example file name relative to the component path'
        type: string
        default: '.env.example'
      helm_detect_env_changes:
        description: 'Detect new environment variables for the Helm chart update'
        type: boolean
        default: true
      helm_dispatch_on_rc:
        description: 'Dispatch Helm updates for release-candidate tags'
        type: boolean
        default: false
      helm_dispatch_on_beta:
        description: 'Dispatch Helm updates for beta tags'
        type: boolean
        default: false
      helm_values_key_mappings:
        description: 'JSON mapping of component names to values.yaml keys'
        type: string
        default: ''
      helm_legacy_patch_detection:
        description: 'Route maintenance-branch releases to the matching legacy Helm chart line'
        type: boolean
        default: true
      helm_legacy_branch_patterns:
        description: 'Glob patterns for maintenance branches that publish legacy patches'
        type: string
        default: 'maintenance/*'

      # ----------------- GitOps Update (gitops-update.yml) -----------------
      enable_gitops_update:
        description: 'Run the gitops-update job on tag push'
        type: boolean
        default: true
      gitops_repository:
        description: 'GitOps repository to update (org/repo format). Defaults to the GITOPS_REPOSITORY org-level variable when empty.'
        type: string
        default: ''
      update_sandbox:
        description: 'Include sandbox environment on production tags. Set to false to skip sandbox even on a production release.'
        type: boolean
        default: false
      beta_environments:
        description: 'Space-separated environments updated by a beta release (develop branch). Default "dev".'
        type: string
        default: 'dev'
      rc_environments:
        description: 'Space-separated environments updated by an rc release (release-candidate branch). Default "stg".'
        type: string
        default: 'stg'
      stable_environments:
        description: 'Space-separated environments updated by a stable release (main branch). Default "prd" so a hotfix does not overwrite features still in dev/stg. Set to "dev stg prd" to refresh lower environments too. Sandbox is controlled separately by update_sandbox.'
        type: string
        default: 'prd'
      gitops_app_name:
        description: 'App name used ONLY for the gitops-update job (deployment-matrix lookup + the helmfile applications/{env}/{app}/values.yaml path). Empty = keep the existing resolution (app_name_prefix, then the repository name). Set this when the gitops app directory is named differently from the published image.'
        type: string
        default: ''
      gitops_artifact_pattern:
        description: 'Pattern to download GitOps artifacts (defaults to "gitops-tags-<repo-name>*")'
        type: string
        default: ''
      gitops_yaml_key_mappings:
        description: 'JSON object mapping artifact names to YAML keys (e.g., {"app.tag": ".api.image.tag"})'
        type: string
        default: ''
      deployment_matrix_ref:
        description: 'Git ref of LerianStudio/github-actions-shared-workflows to read the deployment matrix from. Defaults to main. Override only when testing a branch.'
        type: string
        default: 'main'
      enable_argocd_sync:
        description: 'Trigger ArgoCD sync after updating the GitOps repository'
        type: boolean
        default: true
      commit_message_prefix:
        description: 'Prefix for the GitOps commit message. When empty, falls back to app_name_prefix, then the repository name.'
        type: string
        default: ''
      use_dynamic_mapping:
        description: 'Use dynamic artifact-to-YAML key mapping in gitops-update'
        type: boolean
        default: false
      configmap_updates:
        description: 'JSON object mapping artifact names to configmap keys (helmfile layout only)'
        type: string
        default: ''
      enable_docker_login:
        description: 'Log in to DockerHub in the gitops-update job (for private image digest reads)'
        type: boolean
        default: false

      # ----------------- E2E Tests -----------------
      enable_e2e:
        description: 'Enable the E2E test job after the build (runs only on tag push)'
        type: boolean
        default: false
      e2e_script:
        description: 'npm script to run for E2E tests (e.g. test:e2e, test:e2e:mock)'
        type: string
        default: 'test:e2e'
      e2e_base_url:
        description: 'Base URL injected as BASE_URL env var for real-environment E2E mode. Empty = localhost fallback.'
        type: string
        default: ''
      node_version:
        description: 'Node.js version for the E2E test runner'
        type: string
        default: '22'
      e2e_runner_type:
        description: 'Optional runner override for the E2E Tests job only. Empty = runner_type.'
        type: string
        default: ''
      e2e_s3_artifact_path:
        description: 'Subpath under s3://lerian-e2e-artifacts/<repo>/<channel>/<tag>/ where the Playwright report is uploaded. Channel (main/beta/rc) is derived from the tag''s prerelease identifier.'
        type: string
        default: 'playwright-report'

      # ----------------- Ungoliant Release Diff (ungoliant-release-diff composite) -----------------
      enable_ungoliant_release_diff:
        description: 'Fire the Ungoliant release-diff webhook on tag push after a successful gitops-update to trigger chaos/fuzz analysis for the release.'
        type: boolean
        default: false
      ungoliant_app:
        description: 'App slug sent to the Ungoliant controller. When empty, falls back to app_name_prefix, then the repository name.'
        type: string
        default: ''
      ungoliant_env_type:
        description: 'Ungoliant environment/testing type — chaos | fuzzing.'
        type: string
        default: 'chaos'
      ungoliant_tenancy:
        description: 'Ungoliant tenancy — st (single-tenant) | mt (multi-tenant).'
        type: string
        default: 'st'
      ungoliant_controller_url:
        description: 'Ungoliant controller base URL (reachable over Tailscale).'
        type: string
        default: 'https://ungoliant-controller.anacleto.lerian.net'
      ungoliant_runner_type:
        description: 'Runner for the Ungoliant release-diff job. Needs Tailscale reach to the controller, so it defaults to eveo-anacleto-lxc-runners rather than the build runner.'
        type: string
        default: 'eveo-anacleto-lxc-runners'
      ungoliant_skip_globs:
        description: 'Space-separated glob patterns. When every changed file matches one, Ungoliant is never contacted. Default skips CI/workflow-only releases.'
        type: string
        default: '.releaserc.yml .github/* .coderabbit.yml .coderabbit.yaml'

      # ----------------- Permission Manifest Publish (RI, permission-manifest-publish composite) -----------------
      run_manifest_publish:
        description: 'Publish this app''s own permissions.yaml manifest to the shared Access-Manager RI catalog in S3 on tag push (upstream half of the Inversão de Responsabilidade). Opt-in: default false, so no existing caller changes. The manifest is validated (same check the tenant-manager runs) before anything is uploaded; the job is continue-on-error, so neither a hiccup nor a rejected manifest blocks the release. Requires the AWS_INIT_DATA_ROLE_ARN secret.'
        type: boolean
        default: false
      manifest_publish_environment:
        description: 'Name of a GitHub Environment to scope the manifest publish job to. Empty (default) keeps the job unscoped. Set it to put the AWS_INIT_DATA_ROLE_ARN assume-role behind the environment''s protection rules — deployment tag policies (only protected tags may publish) and, optionally, required reviewers.'
        type: string
        default: ''
      manifest_component_tags:
        description: 'Accept per-component release tags (<component>-vX.Y.Z, -beta.N, -rc.N) in the manifest publish environment gate, on top of plain vX.Y.Z tags. Default false keeps the gate plain-semver-only. The semver core stays strict either way — only an optional lowercase component prefix is allowed.'
        type: boolean
        default: false

    secrets:
      MANAGE_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      NPM_TOKEN:
        description: 'npm registry auth token, forwarded to the release job. Only used when the caller''s own .releaserc includes @semantic-release/npm (a package with independent semver that publishes to an npm registry). Optional — omit for repos that do not publish to npm.'
        required: false
      AWS_E2E_ARTIFACTS_ROLE_ARN:
        description: 'IAM role ARN assumed via OIDC to upload the E2E (Playwright) report to the lerian-e2e-artifacts S3 bucket. Optional — when unset, the S3 upload step is skipped and only the GitHub Actions artifact is produced.'
        required: false
      UNGOLIANT_WEBHOOK_TOKEN:
        required: false
      AWS_INIT_DATA_ROLE_ARN:
        description: 'IAM role ARN (scoped to the lerian-casdoor-init-data bucket) assumed via OIDC by the permission manifest publish job. Only used when run_manifest_publish is true; when unset the real upload is skipped.'
        required: false

    outputs:
      has_e2e_s3_upload:
        description: 'Whether the E2E Playwright report was uploaded to the lerian-e2e-artifacts S3 bucket (true/false). Always false when AWS_E2E_ARTIFACTS_ROLE_ARN is unset or enable_e2e is false.'
        value: ${{ jobs.e2e_tests.outputs.has_e2e_s3_upload || 'false' }}

permissions:
  contents: read

jobs:
  # ----------------- Change Detection (release gate, branch push only) -----------------
  changes:
    name: Detect non-doc changes
    if: github.ref_type == 'branch'
    runs-on: ${{ inputs.runner_type }}
    permissions:
      contents: read
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - name: Non-doc change gate
        id: gate
        uses: LerianStudio/github-actions-shared-workflows/src/config/non-doc-changes@v1
        with:
          github-token: ${{ github.token }}
          ignore-globs: ${{ inputs.ignore_globs }}
          workflow-paths-are-code: ${{ inputs.release_on_workflow_changes }}

  # ----------------- Release (branch push) -----------------
  release:
    needs: changes
    if: github.ref_type == 'branch' && needs.changes.outputs.code == 'true'
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
      packages: read
    uses: ./.github/workflows/release.yml
    with:
      runner_type: ${{ inputs.runner_type }}
      # The `changes` job above already classified this push; release.yml must
      # not spend a second job and a second API call reaching the same verdict.
      enable_doc_gate: false
      publish_runner_type: ${{ inputs.release_runner_type }}
      dry_run: ${{ inputs.dry_run }}
      semantic_version: ${{ inputs.semantic_version }}
      enable_changelog: ${{ inputs.enable_changelog }}
      enable_major_tag: ${{ inputs.enable_major_tag }}
      stable_releases_only: ${{ inputs.stable_releases_only }}
      changelog_release_branch: ${{ inputs.changelog_release_branch }}
      backmerge_enabled: ${{ inputs.backmerge_enabled }}
      backmerge_source: ${{ inputs.backmerge_source }}
      backmerge_target: ${{ inputs.backmerge_target }}
      backmerge_mode: ${{ inputs.backmerge_mode }}
      shared_paths: ${{ inputs.shared_paths }}
      path_level: ${{ inputs.path_level }}
      enable_release_announcement: ${{ inputs.enable_release_announcement }}
      announcement_product_name: ${{ inputs.announcement_product_name }}
      announcement_slack_channel: ${{ inputs.announcement_slack_channel }}
      filter_paths: ${{ !inputs.release_single_app && inputs.filter_paths || '' }}
    secrets: inherit

  # ----------------- Build (tag push) -----------------
  build:
    if: github.ref_type == 'tag'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      packages: write
    uses: ./.github/workflows/typescript-build.yml
    with:
      runner_type: ${{ inputs.runner_type }}
      dry_run: ${{ inputs.dry_run }}
      enable_dockerhub: ${{ inputs.enable_dockerhub }}
      enable_ghcr: ${{ inputs.enable_ghcr }}
      enable_gitops_artifacts: ${{ inputs.enable_gitops_artifacts }}
      app_name_prefix: ${{ inputs.app_name_prefix }}
      app_name_overrides: ${{ inputs.app_name_overrides }}
      dockerfile_name: ${{ inputs.dockerfile_name }}
      build_context: ${{ inputs.build_context }}
      build_secrets: ${{ inputs.build_secrets }}
      enable_cosign_sign: ${{ inputs.enable_cosign_sign }}
      dockerhub_org: ${{ inputs.dockerhub_org }}
      shared_paths: ${{ inputs.shared_paths }}
      filter_paths: ${{ inputs.filter_paths }}
      path_level: ${{ inputs.path_level }}
      force_full_matrix: ${{ inputs.force_full_matrix }}
      enable_helm_dispatch: ${{ inputs.enable_helm_dispatch }}
      helm_repository: ${{ inputs.helm_repository }}
      helm_chart: ${{ inputs.helm_chart }}
      helm_target_ref: ${{ inputs.helm_target_ref }}
      helm_components_base_path: ${{ inputs.helm_components_base_path }}
      helm_env_file: ${{ inputs.helm_env_file }}
      helm_detect_env_changes: ${{ inputs.helm_detect_env_changes }}
      helm_dispatch_on_rc: ${{ inputs.helm_dispatch_on_rc }}
      helm_dispatch_on_beta: ${{ inputs.helm_dispatch_on_beta }}
      helm_values_key_mappings: ${{ inputs.helm_values_key_mappings }}
      helm_legacy_patch_detection: ${{ inputs.helm_legacy_patch_detection }}
      helm_legacy_branch_patterns: ${{ inputs.helm_legacy_branch_patterns }}
    secrets: inherit

  # ----------------- E2E Tests (tag push) -----------------
  e2e_tests:
    name: E2E Tests
    needs: [build]
    if: >-
      github.ref_type == 'tag' && inputs.enable_e2e &&
      !cancelled() && needs.build.result == 'success' && !inputs.dry_run
    runs-on: ${{ inputs.e2e_runner_type || inputs.runner_type }}
    permissions:
      id-token: write
      contents: read
    outputs:
      has_e2e_s3_upload: ${{ steps.s3_upload.outputs.uploaded == 'true' && 'true' || 'false' }}
    env:
      AWS_E2E_ARTIFACTS_ROLE_ARN: ${{ secrets.AWS_E2E_ARTIFACTS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run "$E2E_SCRIPT"
        env:
          E2E_SCRIPT: ${{ inputs.e2e_script }}
          BASE_URL: ${{ inputs.e2e_base_url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # ----------------- E2E Report S3 Upload (optional) -----------------
      # lerian-e2e-artifacts lives in the devops AWS account. Skipped when the
      # AWS_E2E_ARTIFACTS_ROLE_ARN secret is not configured by the caller.
      - name: Configure AWS credentials for E2E artifacts upload
        if: always() && env.AWS_E2E_ARTIFACTS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_E2E_ARTIFACTS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Upload Playwright report to S3
        id: s3_upload
        if: always() && env.AWS_E2E_ARTIFACTS_ROLE_ARN != ''
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          TAG_NAME: ${{ github.ref_name }}
          ARTIFACT_PATH: ${{ inputs.e2e_s3_artifact_path }}
        run: |
          set -euo pipefail
          if [[ -d playwright-report ]]; then
            # Channel is derived from the tag's prerelease identifier, which
            # matches the branch that cut the release (see .releaserc.yml
            # `branches` / prerelease config): develop -> vX.Y.Z-beta.N,
            # release-candidate -> vX.Y.Z-rc.N, main -> plain vX.Y.Z.
            CHANNEL="main"
            if [[ "$TAG_NAME" == *-beta.* ]]; then
              CHANNEL="beta"
            elif [[ "$TAG_NAME" == *-rc.* ]]; then
              CHANNEL="rc"
            fi
            S3_PATH="s3://lerian-e2e-artifacts/${REPO_NAME}/${CHANNEL}/${TAG_NAME}/${ARTIFACT_PATH}/"
            aws s3 cp playwright-report/ "$S3_PATH" --recursive
            echo "::notice::Uploaded Playwright report to ${S3_PATH}"
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::playwright-report/ not found — skipping S3 upload"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------- Permission Manifest Publish (RI, tag push, opt-in) -----------------
  # Upstream half of the Access-Manager "Inversão de Responsabilidade" for a JS/TS app:
  # on a tag push the app publishes its OWN permissions.yaml to the shared RI catalog in
  # S3 (one object per service, keyed by the manifest's `service:` value). The
  # tenant-manager aggregates at read time by listing the prefix — there is no merge here.
  #
  # Same job as go-release's permission_manifest_publish (tag -> folder derivation kept
  # byte-identical; tests/js-release/test_manifest_publish.py guards the drift), with two
  # differences: it is opt-in (run_manifest_publish defaults to false here), and the
  # composite's go.mod lib-auth scope gate is turned off with require-lib-auth: false —
  # a JS repo has no go.mod, so the manifest alone decides. The manifest is validated
  # before upload exactly as for a Go service. Reads repo files only, so it does not
  # gate on the image build; continue-on-error keeps a publish hiccup (or a rejected
  # manifest) from ever blocking the release.
  permission_manifest_publish:
    name: Permission Manifest Publish
    if: >-
      !cancelled() && github.ref_type == 'tag' && inputs.run_manifest_publish
    runs-on: ${{ inputs.runner_type }}
    continue-on-error: true
    # Optional GitHub Environment gate. Empty (the default) leaves the job
    # unscoped, as it has always been; when the caller names an environment the
    # AWS_INIT_DATA_ROLE_ARN assume-role happens under that environment's
    # protection rules, so a deployment tag policy can keep a stray tag from
    # ever writing to the shared RI catalog.
    environment: ${{ inputs.manifest_publish_environment }}
    permissions:
      id-token: write
      contents: read
    env:
      # Secrets can't be referenced directly in a step `if:`, so surface the
      # role's presence as a job-level env boolean. A repo that opted in but never
      # mapped AWS_INIT_DATA_ROLE_ARN must SKIP the real upload (not attempt an
      # unauthenticated one) — a dry-run still runs since the composite previews
      # without any AWS call.
      HAS_INIT_DATA_ROLE: ${{ secrets.AWS_INIT_DATA_ROLE_ARN != '' }}
    steps:
      # ----------------- Checkout & environment resolution -----------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Determine environment folder from tag
        id: env
        env:
          # A workflow_call boolean reaches the shell as the string true/false.
          MANIFEST_COMPONENT_TAGS: ${{ inputs.manifest_component_tags }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          # Strict semver, the shape semantic-release actually produces. The
          # previous *-beta* / *-rc* globs matched any tag merely CONTAINING the
          # marker, so an arbitrary tag could write to the shared RI catalog;
          # only `production` was pinned. Anything off-pattern now falls through
          # to the empty folder, which already skips the publish with a warning.
          # NUM rejects leading zeroes, which semver forbids and which would
          # otherwise let `v01.2.3` slip past the gate as a production tag.
          NUM='(0|[1-9][0-9]*)'
          CORE="v${NUM}\.${NUM}\.${NUM}"
          # manifest_component_tags widens the gate by ONE optional prefix — a
          # monorepo cutting `<service>-vX.Y.Z` per rail. It is a prefix on the
          # same anchored patterns, never a replacement: the semver core, the
          # anchors and the three-way order below are untouched, so `v01.2.3`
          # and `spi-v1.2.3-hotfix` keep falling through to the empty folder.
          PREFIX=''
          if [[ "${MANIFEST_COMPONENT_TAGS}" == 'true' ]]; then
            PREFIX='([a-z][a-z0-9-]*-)?'
            SHAPES='vX.Y.Z, vX.Y.Z-beta.N, vX.Y.Z-rc.N, optionally prefixed with <component>-'
          else
            SHAPES='vX.Y.Z, vX.Y.Z-beta.N, vX.Y.Z-rc.N'
          fi
          if [[ "$TAG" =~ ^${PREFIX}${CORE}-beta\.${NUM}$ ]]; then
            FOLDER="development"
          elif [[ "$TAG" =~ ^${PREFIX}${CORE}-rc\.${NUM}$ ]]; then
            FOLDER="staging"
          elif [[ "$TAG" =~ ^${PREFIX}${CORE}$ ]]; then
            FOLDER="production"
          else
            FOLDER=""
          fi
          echo "folder=${FOLDER}" >> "$GITHUB_OUTPUT"
          [[ -n "$FOLDER" ]] && echo "📁 Environment: ${FOLDER}" || echo "::warning::Tag '${TAG}' is not a release semver tag (${SHAPES}) — manifest publish skipped."

      # ----------------- AWS credentials (guarded) -----------------
      # Skip on a dry-run (the composite previews with no AWS call) and when the
      # role secret is absent (nothing to assume — the publish step is skipped too).
      - name: Configure AWS credentials
        if: steps.env.outputs.folder != '' && env.HAS_INIT_DATA_ROLE == 'true' && inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_INIT_DATA_ROLE_ARN }}
          aws-region: sa-east-1

      # ----------------- Publish manifest to the RI catalog -----------------
      # Publish when there are real creds, or preview when dry-running; otherwise
      # (no role secret and not a dry-run) skip rather than fail a credential-less upload.
      - name: Publish permission manifest to the RI catalog
        if: steps.env.outputs.folder != '' && (env.HAS_INIT_DATA_ROLE == 'true' || inputs.dry_run == true)
        uses: LerianStudio/github-actions-shared-workflows/src/validate/permission-manifest-publish@v1
        with:
          environment: ${{ steps.env.outputs.folder }}
          github-token: ${{ github.token }}
          # A JS/TS repo has no go.mod: drop the lib-auth half of the scope gate.
          require-lib-auth: 'false'
          dry-run: ${{ inputs.dry_run }}

  # ----------------- GitOps Update (tag push) -----------------
  update_gitops:
    needs: [build]
    if: >-
      github.ref_type == 'tag' && inputs.enable_gitops_update &&
      inputs.enable_gitops_artifacts && !cancelled() &&
      needs.build.result == 'success' && needs.build.outputs.has_builds == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      packages: write
    uses: ./.github/workflows/gitops-update.yml
    with:
      gitops_repository: ${{ inputs.gitops_repository }}
      update_sandbox: ${{ inputs.update_sandbox }}
      beta_environments: ${{ inputs.beta_environments }}
      rc_environments: ${{ inputs.rc_environments }}
      stable_environments: ${{ inputs.stable_environments }}
      # gitops_app_name first, then the pre-existing value unchanged, so a caller
      # that does not set it resolves exactly as before (and gitops-update still
      # falls back to the repository name when both are empty).
      app_name: ${{ inputs.gitops_app_name || inputs.app_name_prefix }}
      artifact_pattern: ${{ inputs.gitops_artifact_pattern || format('gitops-tags-{0}*', github.event.repository.name) }}
      yaml_key_mappings: ${{ inputs.gitops_yaml_key_mappings }}
      deployment_matrix_ref: ${{ inputs.deployment_matrix_ref }}
      enable_argocd_sync: ${{ inputs.enable_argocd_sync }}
      commit_message_prefix: ${{ inputs.commit_message_prefix || inputs.app_name_prefix }}
      use_dynamic_mapping: ${{ inputs.use_dynamic_mapping }}
      configmap_updates: ${{ inputs.configmap_updates }}
      enable_docker_login: ${{ inputs.enable_docker_login }}
    secrets: inherit

  # ----------------- Ungoliant Release Diff (tag push, post-gitops, opt-in) -----------------
  # Runs only after a successful gitops-update (i.e. the release was deployed).
  # The controller is reachable only over Tailscale, so the job runs on the
  # eveo-anacleto-lxc-runners self-hosted runner. base-env/env are derived from
  # the tag, which maps 1:1 to the source branch (beta<-develop, rc<-release-
  # candidate, stable<-main) per .releaserc conventions.
  ungoliant_release_diff:
    name: Ungoliant Release Diff
    needs: [build, update_gitops]
    # Gate on build's has_builds output (which propagates reliably and proves a
    # real deploy happened) rather than needs.update_gitops.result == 'success':
    # update_gitops wraps a reusable workflow with a dynamic matrix, and its
    # caller result does not reliably surface as 'success' to dependents.
    if: >-
      !cancelled()
      && github.ref_type == 'tag'
      && inputs.enable_ungoliant_release_diff
      && inputs.enable_gitops_update
      && inputs.enable_gitops_artifacts
      && needs.build.outputs.has_builds == 'true'
      && needs.update_gitops.result != 'failure'
      && needs.update_gitops.result != 'cancelled'
    runs-on: ${{ vars.UNGOLIANT_RUNNERS || inputs.ungoliant_runner_type }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Resolve release channel and base env
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A BARE SEMVER IS STABLE, AND ONLY A BARE SEMVER. See the matching block in
          # go-release.yml: a bare `else` onto stable/prd aimed a production-channel run
          # from a tag that says nothing at all, so an unrecognised tag now fails loudly
          # rather than being guessed at.
          case "$REF_NAME" in
            *-rc.*|*-rc|*-rc[0-9]*)
              RELEASE_ENV="rc"; BASE_ENV="stg" ;;
            *-beta.*|*-beta|*-beta[0-9]*)
              RELEASE_ENV="beta"; BASE_ENV="dev" ;;
            *-alpha.*|*-alpha|*-alpha[0-9]*)
              RELEASE_ENV="beta"; BASE_ENV="dev" ;;
            *)
              if [[ "$REF_NAME" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9A-Za-z.-]+)?$ ]]; then
                RELEASE_ENV="stable"; BASE_ENV="prd"
              else
                echo "::error title=Cannot tell which release channel this tag belongs to::Tag '$REF_NAME' carries no channel marker (-beta.N, -rc.N, -alpha.N) and is not a bare semver version. Refusing to guess — a wrong guess here aims a production-channel run."
                exit 1
              fi
              ;;
          esac
          {
            echo "release_env=$RELEASE_ENV"
            echo "base_env=$BASE_ENV"
          } >> "$GITHUB_OUTPUT"

      - name: Send release-diff webhook
        uses: LerianStudio/github-actions-shared-workflows/src/validate/ungoliant-release-diff@v1
        with:
          app: ${{ inputs.ungoliant_app || inputs.app_name_prefix || github.event.repository.name }}
          version: ${{ github.ref_name }}
          env: ${{ steps.target.outputs.release_env }}
          env-type: ${{ inputs.ungoliant_env_type }}
          tenancy: ${{ inputs.ungoliant_tenancy }}
          base-env: ${{ steps.target.outputs.base_env }}
          controller-url: ${{ vars.UNGOLIANT_CONTROLLER_URL || inputs.ungoliant_controller_url }}
          skip-globs: ${{ inputs.ungoliant_skip_globs }}
          github-token: ${{ github.token }}
          webhook-token: ${{ secrets.UNGOLIANT_WEBHOOK_TOKEN }}
          dry-run: ${{ inputs.dry_run }}
