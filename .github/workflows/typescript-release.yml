name: "TypeScript Release"

# Reusable workflow for TypeScript/Node.js semantic versioning and release management
# Creates releases based on conventional commits and manages version tags
# Includes GitHub Packages authentication for private @lerianstudio dependencies
#
# Monorepo Support:
# - If filter_paths is provided: detects changes and runs release for each changed app
# - If filter_paths is empty: runs release for the entire repository (single app mode)

on:
  workflow_call:
    inputs:
      # ----------------- Change gate -----------------
      # Documentation and repository metadata must not cut a release tag. The
      # gate reuses src/config/non-doc-changes and folds its verdict into
      # `should_skip`, which every downstream job already respects. Kept in step
      # with the same gate in release.yml.
      enable_doc_gate:
        description: 'Skip the release when a branch push touches only documentation/meta files (see ignore_globs).'
        type: boolean
        default: true
      ignore_globs:
        description: 'Space-separated glob patterns treated as docs/meta; when only these change on a branch push, the release is skipped. Files under .github/workflows/, .github/actions/ and .github/scripts/ count as code only when release_on_workflow_changes is true.'
        type: string
        default: '*.md docs/* .github/* LICENSE* .gitignore .coderabbit.yml .coderabbit.yaml'
      release_on_workflow_changes:
        description: 'Release when a branch push touches only .github/workflows/, .github/actions/ or .github/scripts/. Off by default: a pipeline edit ships byte-identical code, and releasing it moves GitOps tags and writes a changelog entry for a CI tweak. Turn it on in a repository whose released artifact lives under .github/ (one that publishes composite actions, say).'
        type: boolean
        default: false

      semantic_version:
        description: 'Semantic release version to use'
        type: string
        default: '23.0.8'
      runner_type:
        description: 'Runner to use for the workflow'
        type: string
        default: 'blacksmith-4vcpu-ubuntu-2404'
      node_version:
        description: 'Node.js version to use'
        type: string
        default: '20'
      filter_paths:
        description: 'Newline-separated list of path prefixes to filter. If not provided, treats as single app repo.'
        type: string
        required: false
        default: ''
      shared_paths:
        description: 'Newline-separated path patterns (e.g., "go.mod\ngo.sum") that trigger a build for ALL components when matched by any changed file.'
        type: string
        required: false
        default: ''
      path_level:
        description: 'Limits the path to the first N segments (e.g., 2 -> "apps/agent")'
        type: string
        default: '2'
      dry_run:
        description: 'Run semantic-release in dry-run mode (no tags/releases created)'
        type: boolean
        default: false
      environment_name:
        description: 'Overrides the per-channel deployment environment for this run. Empty (default) keeps `stable` on main, `rc` on release-candidate and `beta` on anything else. Scope it with your own expression so the split still applies to other refs.'
        type: string
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
      should_skip: ${{ steps.check-skip.outputs.should_skip }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Runs before the skip check so its verdict can feed into it. Skipped on
      # tag pushes: a tag carries no diff to classify, and a tag-driven release
      # is explicit intent rather than an accident of a docs commit.
      - name: Non-doc change gate
        id: doc-gate
        if: inputs.enable_doc_gate && github.ref_type == 'branch'
        # An unreadable diff is not a verdict. A caller may grant less than
        # `pull-requests: read`, and a reusable workflow cannot elevate what its
        # caller restricted; failing here would block the pipeline the gate only
        # means to shorten. The empty output that follows reads as "assume code".
        continue-on-error: true
        uses: LerianStudio/github-actions-shared-workflows/src/config/non-doc-changes@v1
        with:
          github-token: ${{ github.token }}
          ignore-globs: ${{ inputs.ignore_globs }}
          workflow-paths-are-code: ${{ inputs.release_on_workflow_changes }}

      - name: Check if should skip (changelog commits)
        id: check-skip
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          # Empty when the gate did not run (tag push, or gate disabled by the
          # caller). Only the literal "false" skips, so an absent verdict means
          # "assume code" and the release proceeds as before.
          HAS_CODE: ${{ steps.doc-gate.outputs.code }}
        run: |
          if [ "$HAS_CODE" = "false" ]; then
            echo "Skipping release - branch push touched only documentation/meta files"
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking commit message for skip patterns"

          # Machinery rather than work: version bumps, changelog commits and
          # syncs. [backmerge] is matched alongside [skip ci] because a backmerge
          # carries the former instead — it has to let the run start so the
          # target branch's own checks report, while still not cutting a
          # release. Kept in step with the same guard in release.yml.
          if echo "$COMMIT_MSG" | grep -qiE '\[skip ci\]|\[backmerge\]|chore\(release\): Update CHANGELOGs'; then
            echo "Skipping release - changelog/skip-ci commit detected"
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Proceeding with release"
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get changed paths (monorepo)
        if: inputs.filter_paths != ''
        id: changed-paths
        uses: LerianStudio/github-actions-shared-workflows/src/config/changed-paths@v1
        with:
          filter-paths: ${{ inputs.filter_paths }}
          shared-paths: ${{ inputs.shared_paths }}
          path-level: ${{ inputs.path_level }}
          get-app-name: 'true'

      - name: Set matrix
        id: set-matrix
        run: |
          if [ -z "${{ inputs.filter_paths }}" ]; then
            # Single app mode - release from root
            APP_NAME="${{ github.event.repository.name }}"
            echo "matrix=[{\"name\": \"${APP_NAME}\", \"working_dir\": \".\"}]" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            MATRIX='${{ steps.changed-paths.outputs.matrix }}'
            if [ "$MATRIX" == "[]" ] || [ -z "$MATRIX" ]; then
              echo "matrix=[]" >> "$GITHUB_OUTPUT"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
              echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  publish_release:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true' && needs.prepare.outputs.should_skip != 'true'
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PAT_FOR_PACKAGES }}
    environment:
      # `stable` on main, `rc` on release-candidate, `beta` on anything else.
      # The three-way split follows the branch strategy this workflow supports
      # for its CONSUMERS, not the branches this repository happens to use —
      # shared-workflows has no release-candidate, and that is irrelevant to the
      # contract.
      #
      # The environments live in the CALLER's repository, so every consumer gets
      # its own set, and its own branch policies if it configures them. Nothing
      # here is created or protected centrally. A repository that never pushes to
      # release-candidate never gets an `rc` environment: GitHub creates one only
      # when a job referencing it actually runs.
      #
      # Choosing the name by expression is safe specifically because the
      # environment's deployment branch policy is the enforcement: even if this
      # expression resolved wrongly, GitHub refuses a deployment from a ref the
      # environment does not allow, and that restriction is not bypassable by
      # administrators. The expression states intent; the policy imposes it.
      name: ${{ inputs.environment_name != '' && inputs.environment_name || github.ref == 'refs/heads/main' && 'stable' || github.ref == 'refs/heads/release-candidate' && 'rc' || 'beta' }}
    name: Release ${{ matrix.app.name }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.prepare.outputs.matrix) }}

    outputs:
      gpg_fingerprint: ${{ steps.import_gpg.outputs.fingerprint }}

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
          private-key: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Sync with remote branch
        run: |
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
          passphrase: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
          git_committer_name: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          git_committer_email: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup .npmrc for GitHub Packages
        if: ${{ env.GH_PACKAGES_TOKEN != '' }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" > ~/.npmrc
          echo "@lerianstudio:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Init package.json and release config
        working-directory: ${{ matrix.app.working_dir }}
        run: |
          echo '{"name":"${{ matrix.app.name }}","version":"0.0.0","private":true}' > package.json
          echo '{"branches":["main",{"name":"develop","prerelease":"beta"},{"name":"release-candidate","prerelease":"rc"}]}' > .releaserc.json
          rm -f package-lock.json

      - name: Install semantic-release plugins
        working-directory: ${{ matrix.app.working_dir }}
        run: |
          npm install --save-dev \
            @semantic-release/exec@7.1.0

      # ----------------- Snapshot tags before release -----------------
      - name: Snapshot tags before release
        if: ${{ !inputs.dry_run }}
        id: pre-tags
        uses: LerianStudio/github-actions-shared-workflows/src/config/release-tag-snapshot@v1

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v6
        id: semantic
        continue-on-error: ${{ !inputs.dry_run }}
        with:
          ci: false
          dry_run: ${{ inputs.dry_run }}
          semantic_version: ${{ inputs.semantic_version }}
          working_directory: ${{ matrix.app.working_dir }}
          extra_plugins: |
            conventional-changelog-conventionalcommits@v7.0.2
            @saithodev/semantic-release-backmerge@4.0.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}

      # `cycjimmy/semantic-release-action` installs its own dependencies in its
      # entrypoint, and the entrypoint ends in `run().catch(console.error)`: a
      # failing `npm ci` is printed and the process still exits 0, so the step
      # is green with semantic-release never started. The action's first task
      # sets `new_release_published` to `false`, so an empty output is the
      # signature of "never ran" — `false` is the legitimate "nothing to
      # release". Without this check the two are indistinguishable, and a
      # release that silently did not happen looks exactly like one that
      # correctly did not happen.
      - name: Verify Semantic Release ran
        if: |
          steps.semantic.outcome == 'success' &&
          steps.semantic.outputs.new_release_published == ''
        run: |
          printf '::error::%s%s%s\n' \
            "semantic-release never started: the action could not install its own dependencies and exited successfully anyway. The npm error is in the step log above.%0A" \
            "No version was released. This is not the same as having nothing to release — the tool never ran.%0A" \
            "Re-run the job. If it keeps happening, the runner cannot reach the npm registry."
          exit 1

      # semantic-release opens with a `git push --dry-run` of HEAD; when that is
      # rejected because the branch moved since the sync step, it checks whether
      # the local branch is behind the remote and, if so, logs "behind the remote
      # one" and returns without releasing — exit 0, `new_release_published`
      # `false`. Another merge landing during the run is enough, and with
      # `max-parallel: 1` across the matrix that window is the whole run. The
      # newer push only releases this leg again if it touches the same paths,
      # so the release is lost while the run reports success.
      #
      # `false` alone cannot tell this from "nothing to release", so when the
      # branch did move, the release is recomputed in dry-run on the new head:
      # a version there means one was owed and skipped.
      - name: Check the branch did not move during the release
        id: branch_moved
        if: |
          steps.semantic.outcome == 'success' &&
          steps.semantic.outputs.new_release_published == 'false'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --quiet origin "$REF_NAME"
          if git merge-base --is-ancestor "origin/$REF_NAME" HEAD; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::$REF_NAME moved during the release; rechecking on $(git rev-parse --short "origin/$REF_NAME")"
          # --soft moves HEAD only: the working tree keeps the package.json and
          # release config the steps above prepared, which a hard reset would
          # put back to the committed versions.
          git reset --soft "origin/$REF_NAME"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Recheck the release on the moved branch
        id: semantic_recheck
        if: steps.branch_moved.outputs.moved == 'true'
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v6
        with:
          ci: false
          dry_run: true
          semantic_version: ${{ inputs.semantic_version }}
          working_directory: ${{ matrix.app.working_dir }}
          extra_plugins: |
            conventional-changelog-conventionalcommits@v7.0.2
            @saithodev/semantic-release-backmerge@4.0.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # An empty output means the recheck never started (see the check above),
      # which leaves the question open — that fails too rather than passing.
      - name: Fail on a release the moved branch skipped
        if: |
          steps.branch_moved.outputs.moved == 'true' &&
          steps.semantic_recheck.outputs.new_release_published != 'false'
        env:
          REF_NAME: ${{ github.ref_name }}
          APP_NAME: ${{ matrix.app.name }}
          NEXT_VERSION: ${{ steps.semantic_recheck.outputs.new_release_version }}
        run: |
          printf '::error::%s%s%s\n' \
            "No release was published for ${APP_NAME}: ${REF_NAME} moved while this run was releasing, and semantic-release skips when the local branch is behind the remote.%0A" \
            "Rechecked on the new head, a release is still owed${NEXT_VERSION:+ (v${NEXT_VERSION})}. The newer push only releases it if it touches the same paths.%0A" \
            "Re-run this job: it syncs to the current head of ${REF_NAME} before releasing."
          exit 1

      # ----------------- Detect release via git tag -----------------
      - name: Detect if release was published
        if: ${{ !inputs.dry_run && always() && steps.semantic.outcome == 'failure' }}
        id: detect-release
        uses: LerianStudio/github-actions-shared-workflows/src/config/release-tag-check@v1
        with:
          previous-tag: ${{ steps.pre-tags.outputs.latest-tag }}

      # ----------------- Backmerge Fallback -----------------
      - name: Backmerge PR fallback
        if: |
          !inputs.dry_run && always() && steps.semantic.outcome == 'failure' && (
            steps.semantic.outputs.new_release_published == 'true' ||
            steps.detect-release.outputs.release-published == 'true'
          )
        uses: LerianStudio/github-actions-shared-workflows/src/config/backmerge-pr@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          source-branch: ${{ github.ref_name }}
          version: ${{ steps.semantic.outputs.new_release_version || steps.detect-release.outputs.release-version }}

      - name: Fail if release itself failed
        if: |
          !inputs.dry_run && always() && steps.semantic.outcome == 'failure' &&
          steps.semantic.outputs.new_release_published != 'true' &&
          steps.detect-release.outputs.release-published != 'true'
        run: |
          echo "::error::Semantic release failed before publishing a new version"
          exit 1

  # Slack notification
  notify:
    name: Notify
    needs: [prepare, publish_release]
    if: always() && needs.prepare.outputs.has_changes == 'true' && needs.prepare.outputs.should_skip != 'true'
    uses: ./.github/workflows/slack-notify.yml
    with:
      status: ${{ needs.publish_release.result }}
      workflow_name: "TypeScript Release"
      failed_jobs: ${{ needs.publish_release.result == 'failure' && 'Publish Release' || '' }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
