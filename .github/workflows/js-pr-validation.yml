name: "JS/TS PR Validation"

# Umbrella reusable workflow for JavaScript/TypeScript repositories.
# Orchestrates PR metadata validation, a non-doc change gate, the frontend
# analysis pipeline and the security scan pipeline behind opt-in flags, so
# a caller only needs to reference this single workflow.

on:
  workflow_call:
    outputs:
      has_breaking_changes:
        description: 'Whether the PR contains breaking changes (true/false)'
        value: ${{ jobs.metadata.outputs.has_breaking_changes || 'false' }}
      breaking_change_approved:
        description: 'Whether the exact breaking change acknowledgement is present (true/false)'
        value: ${{ jobs.metadata.outputs.breaking_change_approved || 'false' }}
      breaking_change_result:
        description: 'Breaking change guard result (success/failure)'
        value: ${{ jobs.metadata.outputs.breaking_change_result || 'failure' }}
    inputs:
      runner_type:
        description: 'GitHub runner type to use'
        type: string
        default: 'blacksmith-4vcpu-ubuntu-2404'
      dry_run:
        description: 'Preview metadata validations without posting comments or labels'
        required: false
        type: boolean
        default: false

      # ----------------- Pipeline toggles -----------------
      run_frontend_analysis:
        description: 'Run the frontend analysis pipeline (lint, typecheck, npm audit, tests, coverage, build)'
        type: boolean
        default: true
      run_security:
        description: 'Run the security scan pipeline (Trivy, CodeQL, prerelease checks)'
        type: boolean
        default: true
      run_socket:
        description: 'Run the Socket supply-chain pipeline (Socket Firewall and, when enabled, the Socket CLI scan)'
        type: boolean
        default: true

      # ----------------- Change gate -----------------
      ignore_globs:
        description: 'Space-separated glob patterns treated as docs/meta; when only these change, the analysis and security pipelines are skipped.'
        type: string
        default: '*.md docs/* .github/* LICENSE* .gitignore'

      # ----------------- PR metadata (pr-validation.yml) -----------------
      pr_title_types:
        description: 'Allowed commit types (pipe-separated)'
        type: string
        default: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          chore
          ci
          build
          revert
      pr_title_scopes:
        description: 'Allowed scopes (pipe-separated, empty = any scope allowed)'
        type: string
        default: ''
      require_scope:
        description: 'Require scope in PR title'
        type: boolean
        default: false
      enable_auto_labeler:
        description: 'Enable automatic labeling based on changed files'
        type: boolean
        default: true
      labeler_config_path:
        description: 'Path to labeler configuration file'
        type: string
        default: '.github/labeler.yml'
      enforce_source_branches:
        description: 'Enforce that PRs to protected branches come from specific source branches.'
        type: boolean
        default: true
      allowed_source_branches:
        description: 'Allowed source branches (pipe-separated, supports * prefix matching)'
        type: string
        default: 'develop|release-candidate|hotfix/*'
      target_branches_for_source_check:
        description: 'Target branches that require source branch validation (pipe-separated)'
        type: string
        default: 'main'

      # ----------------- Frontend analysis (frontend-pr-analysis.yml) -----------------
      node_version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      package_manager:
        description: 'Package manager to use (npm, yarn, pnpm)'
        type: string
        default: 'npm'
      eslint_args:
        description: 'Additional arguments for ESLint'
        type: string
        default: ''
      audit_level:
        description: 'npm audit severity level (low, moderate, high, critical)'
        type: string
        default: 'high'
      coverage_threshold:
        description: 'Minimum coverage percentage required (0-100)'
        type: number
        default: 80
      fail_on_coverage_threshold:
        description: 'Fail the workflow if coverage is below threshold'
        type: boolean
        default: false
      filter_paths:
        description: 'JSON array of paths to monitor for changes (e.g., ["apps/web", "apps/console"]), passed through to frontend-pr-analysis.yml. If empty, treats repo as single-app and runs against root directory. Not passed to the security scan (pr-security-scan.yml uses a different, newline-separated format for its own filter_paths) — call it directly for path-scoped security scans.'
        type: string
        required: false
        default: ''
      shared_paths:
        description: 'Newline-separated list of path patterns that, when matched by any changed file, trigger analysis for ALL components in filter_paths, passed through to frontend-pr-analysis.yml. Not passed to the security scan — call it directly with its own shared_paths for path-scoped security scans.'
        type: string
        required: false
        default: ''
      path_level:
        description: 'Directory depth level to extract app name, passed through to frontend-pr-analysis.yml.'
        type: number
        default: 2
      normalize_to_filter:
        description: 'Collapse every changed file under a filter_paths entry into that one app, passed through to frontend-pr-analysis.yml. Default true — see that workflow for why.'
        type: boolean
        default: true
      app_name_prefix:
        description: 'Prefix used to namespace coverage/build artifacts'
        type: string
        default: ''
      enable_lint:
        description: 'Enable ESLint'
        type: boolean
        default: true
      enable_typecheck:
        description: 'Enable TypeScript type checking'
        type: boolean
        default: true
      enable_security:
        description: 'Enable security scanning (npm audit)'
        type: boolean
        default: true
      enable_tests:
        description: 'Enable unit tests'
        type: boolean
        default: true
      enable_coverage:
        description: 'Enable coverage check with PR comment'
        type: boolean
        default: true
      enable_build:
        description: 'Enable build verification'
        type: boolean
        default: true
      enable_i18n_check:
        description: 'Enable i18n key validation'
        type: boolean
        default: false
      i18n_check_script:
        description: 'npm script name for extraction-parity check'
        type: string
        default: 'check:i18n'
      i18n_keys_check_script:
        description: 'npm script name for locale-parity check'
        type: string
        default: 'check:i18n:keys'
      i18n_check_fail_on_violation:
        description: 'Fail the workflow if any i18n check reports violations'
        type: boolean
        default: true
      enable_bundle_budget:
        description: 'Enable a bundle-size budget check (runs bundle_budget_script)'
        type: boolean
        default: false
      bundle_budget_script:
        description: 'npm script name that enforces the bundle-size budget (should exit non-zero on violation)'
        type: string
        default: 'check:bundle-budget'
      enable_performance_budget:
        description: 'Enable a performance budget check, e.g. Lighthouse/Core Web Vitals (runs performance_budget_script)'
        type: boolean
        default: false
      performance_budget_script:
        description: 'npm script name that enforces the performance budget (should exit non-zero on violation)'
        type: string
        default: 'check:performance'
      enable_visual_regression:
        description: 'Enable visual regression testing (runs visual_regression_script)'
        type: boolean
        default: false
      visual_regression_script:
        description: 'npm script name that runs visual regression tests (should exit non-zero on a diff/violation)'
        type: string
        default: 'test:visual'
      enable_docker_smoke:
        description: 'Enable a Docker image smoke test: build the image, run it, and poll a health endpoint'
        type: boolean
        default: false
      docker_smoke_dockerfile_path:
        description: 'Path to the Dockerfile to build for the smoke test. Empty = "<working_dir>/Dockerfile" ("./Dockerfile" for single-app repos).'
        type: string
        default: ''
      docker_smoke_build_args:
        description: 'Newline-separated Docker build arguments for the smoke-test image (e.g. "KEY=value")'
        type: string
        default: ''
      docker_smoke_port:
        description: 'Container port to publish and probe for the smoke test'
        type: number
        default: 3000
      docker_smoke_health_path:
        description: 'HTTP path polled on the running container to confirm it started successfully'
        type: string
        default: '/health'
      docker_smoke_timeout:
        description: 'Seconds to wait for the health check to succeed before failing the smoke test'
        type: number
        default: 60
      docker_smoke_test_script:
        description: 'npm script run against the running container after the health check passes (PLAYWRIGHT_BASE_URL/PLAYWRIGHT_SKIP_WEB_SERVER are injected). Empty = skip (default).'
        type: string
        default: ''
      docker_smoke_env:
        description: 'Newline-separated runtime environment variables passed to `docker run` (e.g. "AUTH_DISABLED=true")'
        type: string
        default: ''
      enable_accessibility:
        description: 'Enable an accessibility check (runs accessibility_script)'
        type: boolean
        default: false
      accessibility_script:
        description: 'npm script name that runs accessibility tests'
        type: string
        default: 'test:a11y'
      enable_custom_checks:
        description: 'Enable arbitrary caller-owned checks beyond the named gates above (runs each script in custom_checks)'
        type: boolean
        default: false
      custom_checks:
        description: 'Newline-separated npm script names to run as additional checks'
        type: string
        default: ''
      custom_checks_needs_browsers:
        description: 'Install Playwright browsers before running custom_checks. Only enable if a custom_checks script drives a browser (e.g. a Playwright-based smoke test).'
        type: boolean
        default: false

      # ----------------- Security (pr-security-scan.yml) -----------------
      prerelease_block_branches:
        description: 'Comma-separated list of PR target branches where pre-release versions cause a hard failure'
        type: string
        default: 'release-candidate,main'
      enable_docker_scan:
        description: 'Build and scan a Docker image with Trivy. Set to false for repos without a Dockerfile (e.g. Node.js CLIs or libraries).'
        type: boolean
        default: true
      dockerfile_path:
        description: 'Explicit path to a single Dockerfile to build and scan (e.g. Dockerfile). Leave empty to auto-discover.'
        type: string
        default: ''
      enable_codeql:
        description: 'Enable CodeQL static analysis. Requires codeql_languages to be set.'
        type: boolean
        default: false
      codeql_languages:
        description: 'Languages to analyze with CodeQL (comma-separated, e.g., "javascript-typescript")'
        type: string
        default: ''
      ignore_file:
        description: 'Path to Trivy ignore file (e.g., .trivyignore.yaml)'
        type: string
        default: ''
      trivy_skip_dirs:
        description: 'Comma-separated directories to skip in every Trivy filesystem scan (appended to the built-in skip list).'
        type: string
        default: ''

      # ----------------- Socket supply chain (src/security/socket-*) -----------------
      socket_enable_firewall:
        description: 'Run Socket Firewall (free tier, no token) and install dependencies through it, blocking malicious packages at install time.'
        type: boolean
        default: true
      socket_working_dir:
        description: 'Directory holding the package.json and lockfile scanned by the Socket jobs'
        type: string
        default: '.'
      socket_firewall_version:
        description: 'Socket Firewall binary version. Empty or "latest" tracks the newest release.'
        type: string
        default: 'latest'
      socket_job_summary:
        description: 'Socket Firewall job summary verbosity (all, errors, none)'
        type: string
        default: 'all'
      socket_use_cache:
        description: 'Cache the sfw binary between runs. Unrelated to the package-manager cache, which is always purged before the guarded install.'
        type: boolean
        default: true
      socket_fail_on_block:
        description: 'Fail the Socket job when Socket Firewall blocks a package. Set to false to report the block as a warning instead.'
        type: boolean
        default: true
      socket_enable_app_gate:
        description: >-
          Turn the Socket GitHub App checks into an enforceable gate. The App analyses the dependency graph and
          posts advisory checks; this makes an adverse verdict block the pull request. Needs no token.
        type: boolean
        default: true
      socket_app_slug:
        description: 'GitHub App slug whose checks the gate reads'
        type: string
        default: 'socket-security'
      socket_app_timeout:
        description: 'Seconds to wait for the Socket App checks to complete before treating the result as inconclusive'
        type: number
        default: 300
      socket_app_fail_on_findings:
        description: 'Fail the Socket job when the App reports adverse checks'
        type: boolean
        default: true
      socket_app_on_inconclusive:
        description: >-
          What to do when the App ran but reached no verdict (neutral/skipped/timeout): "block" (default) or "warn".
          A conflicted pull request is the common cause, and it must not read as clean.
        type: string
        default: 'block'
      socket_enable_api_report:
        description: >-
          Read the full scan the Socket App already computed and report per-package alerts, vulnerabilities and
          scores in the pull request comment. Requires SOCKET_SECURITY_API_KEY with the full-scans:list scope.
          Advisory only — it never gates the merge.
        type: boolean
        default: true
      socket_api_max_rows:
        description: 'Maximum package rows kept in the dependency findings table'
        type: number
        default: 25
      socket_api_include_actions:
        description: >-
          Comma-separated Socket alert actions reported as findings. Socket marks roughly 99% of alerts as "ignore"
          (capability observations such as envVars), so reporting unfiltered buries a handful of findings in
          thousands of lines.
        type: string
        default: 'error,warn,monitor'
      socket_comment_when:
        description: >-
          "findings" (the default) posts the Socket comment only when there is something to act on. "always" posts
          every run. Operational state — whether the scan ran, which checks passed — is never in the comment; it
          lives in the job log and the Socket status check.
        type: string
        default: 'findings'
      socket_api_fail_on_actions:
        description: >-
          Comma-separated Socket alert actions that block the pull request. Empty (the default) reports without
          blocking. Set to e.g. "error" to own the merge decision in this workflow rather than deferring it to the
          Socket App's verdict.
        type: string
        default: ''
      socket_app_on_missing:
        description: >-
          What to do when the App published no checks, which is what a repository without it installed looks like:
          "warn" (default) keeps those repositories green, "block" requires the App.
        type: string
        default: 'warn'
    secrets:
      MANAGE_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      # Declared but not consumed by any job today: the Socket layers here run
      # token-free (the firewall inspects traffic locally, the App gate reads the
      # GitHub checks API). It is declared so an organization secret reaches this
      # workflow through `secrets: inherit` without a release, which a reusable
      # workflow cannot do for an undeclared secret. Do not delete as dead —
      # Socket Firewall enterprise is the intended consumer.
      SOCKET_SECURITY_API_KEY:
        required: false

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  # ----------------- PR Metadata Validation -----------------
  metadata:
    name: PR Metadata
    uses: ./.github/workflows/pr-validation.yml
    with:
      runner_type: ${{ inputs.runner_type }}
      dry_run: ${{ inputs.dry_run }}
      pr_title_types: ${{ inputs.pr_title_types }}
      pr_title_scopes: ${{ inputs.pr_title_scopes }}
      require_scope: ${{ inputs.require_scope }}
      enable_auto_labeler: ${{ inputs.enable_auto_labeler }}
      labeler_config_path: ${{ inputs.labeler_config_path }}
      enforce_source_branches: ${{ inputs.enforce_source_branches }}
      allowed_source_branches: ${{ inputs.allowed_source_branches }}
      target_branches_for_source_check: ${{ inputs.target_branches_for_source_check }}
    secrets: inherit

  # ----------------- Change Detection (gate) -----------------
  changes:
    name: Detect non-doc changes
    if: contains(fromJSON('["opened","edited","synchronize","reopened","ready_for_review"]'), github.event.action)
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - name: Non-doc change gate
        id: gate
        uses: LerianStudio/github-actions-shared-workflows/src/config/non-doc-changes@v1
        with:
          github-token: ${{ github.token }}
          ignore-globs: ${{ inputs.ignore_globs }}

  # ----------------- Frontend Analysis -----------------
  frontend-analysis:
    name: Frontend Analysis (pipeline)
    needs: changes
    if: inputs.run_frontend_analysis && needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/frontend-pr-analysis.yml
    with:
      runner_type: ${{ inputs.runner_type }}
      node_version: ${{ inputs.node_version }}
      package_manager: ${{ inputs.package_manager }}
      eslint_args: ${{ inputs.eslint_args }}
      audit_level: ${{ inputs.audit_level }}
      coverage_threshold: ${{ inputs.coverage_threshold }}
      fail_on_coverage_threshold: ${{ inputs.fail_on_coverage_threshold }}
      filter_paths: ${{ inputs.filter_paths }}
      shared_paths: ${{ inputs.shared_paths }}
      path_level: ${{ inputs.path_level }}
      normalize_to_filter: ${{ inputs.normalize_to_filter }}
      app_name_prefix: ${{ inputs.app_name_prefix }}
      enable_socket_firewall: ${{ inputs.socket_enable_firewall }}
      socket_firewall_version: ${{ inputs.socket_firewall_version }}
      socket_fail_on_block: ${{ inputs.socket_fail_on_block }}
      enable_lint: ${{ inputs.enable_lint }}
      enable_typecheck: ${{ inputs.enable_typecheck }}
      enable_security: ${{ inputs.enable_security }}
      enable_tests: ${{ inputs.enable_tests }}
      enable_coverage: ${{ inputs.enable_coverage }}
      enable_build: ${{ inputs.enable_build }}
      enable_i18n_check: ${{ inputs.enable_i18n_check }}
      i18n_check_script: ${{ inputs.i18n_check_script }}
      i18n_keys_check_script: ${{ inputs.i18n_keys_check_script }}
      i18n_check_fail_on_violation: ${{ inputs.i18n_check_fail_on_violation }}
      enable_bundle_budget: ${{ inputs.enable_bundle_budget }}
      bundle_budget_script: ${{ inputs.bundle_budget_script }}
      enable_performance_budget: ${{ inputs.enable_performance_budget }}
      performance_budget_script: ${{ inputs.performance_budget_script }}
      enable_visual_regression: ${{ inputs.enable_visual_regression }}
      visual_regression_script: ${{ inputs.visual_regression_script }}
      enable_docker_smoke: ${{ inputs.enable_docker_smoke }}
      docker_smoke_dockerfile_path: ${{ inputs.docker_smoke_dockerfile_path }}
      docker_smoke_build_args: ${{ inputs.docker_smoke_build_args }}
      docker_smoke_port: ${{ inputs.docker_smoke_port }}
      docker_smoke_health_path: ${{ inputs.docker_smoke_health_path }}
      docker_smoke_timeout: ${{ inputs.docker_smoke_timeout }}
      docker_smoke_test_script: ${{ inputs.docker_smoke_test_script }}
      docker_smoke_env: ${{ inputs.docker_smoke_env }}
      enable_accessibility: ${{ inputs.enable_accessibility }}
      accessibility_script: ${{ inputs.accessibility_script }}
      enable_custom_checks: ${{ inputs.enable_custom_checks }}
      custom_checks: ${{ inputs.custom_checks }}
      custom_checks_needs_browsers: ${{ inputs.custom_checks_needs_browsers }}
    secrets: inherit

  frontend-analysis-gate:
    name: Frontend Analysis
    needs: [changes, frontend-analysis]
    if: always()
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    permissions:
      contents: read
    steps:
      - name: Aggregate Frontend Analysis result
        uses: LerianStudio/github-actions-shared-workflows/src/validate/result-gate@v1
        with:
          result: ${{ needs.changes.result != 'success' && needs.changes.result || needs.frontend-analysis.result }}
          label: Frontend Analysis

  # ----------------- Security Scan -----------------
  security:
    name: Security (pipeline)
    needs: changes
    if: inputs.run_security && needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/pr-security-scan.yml
    with:
      runner_type: ${{ inputs.runner_type }}
      ignore_file: ${{ inputs.ignore_file }}
      enable_docker_scan: ${{ inputs.enable_docker_scan }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
      enable_codeql: ${{ inputs.enable_codeql }}
      codeql_languages: ${{ inputs.codeql_languages }}
      prerelease_block_branches: ${{ inputs.prerelease_block_branches }}
      trivy_skip_dirs: ${{ inputs.trivy_skip_dirs }}
    secrets: inherit

  security-gate:
    name: Security
    needs: [changes, security]
    if: always()
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    permissions:
      contents: read
    steps:
      - name: Aggregate security result
        uses: LerianStudio/github-actions-shared-workflows/src/validate/result-gate@v1
        with:
          result: ${{ needs.changes.result != 'success' && needs.changes.result || needs.security.result }}
          label: Security

  # ----------------- Socket Supply Chain -----------------
  socket:
    name: Socket (checks)
    needs: changes
    if: inputs.run_socket && needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    env:
      SOCKET_APP_NAME: ${{ inputs.app_name_prefix != '' && inputs.app_name_prefix || github.event.repository.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # This install is the reporting source of truth for the Socket Firewall
      # row below. Enforcement itself is broader: every install in
      # frontend-pr-analysis.yml also runs through the firewall, so a malicious
      # package cannot execute install scripts in any analysis job either.
      - name: Socket Firewall
        id: firewall
        if: inputs.socket_enable_firewall
        continue-on-error: true
        uses: LerianStudio/github-actions-shared-workflows/src/security/socket-firewall@v1
        with:
          package-manager: ${{ inputs.package_manager }}
          node-version: ${{ inputs.node_version }}
          working-dir: ${{ inputs.socket_working_dir }}
          firewall-version: ${{ inputs.socket_firewall_version }}
          job-summary: ${{ inputs.socket_job_summary }}
          use-cache: ${{ inputs.socket_use_cache }}
          fail-on-block: ${{ inputs.socket_fail_on_block }}
          dry-run: ${{ inputs.dry_run }}

      - name: Socket App Gate
        id: app-gate
        if: inputs.socket_enable_app_gate && github.event_name == 'pull_request'
        continue-on-error: true
        uses: LerianStudio/github-actions-shared-workflows/src/security/socket-app-gate@v1
        with:
          github-token: ${{ secrets.MANAGE_TOKEN || github.token }}
          # The App reports against the pull request head, not the merge commit.
          commit-sha: ${{ github.event.pull_request.head.sha }}
          app-slug: ${{ inputs.socket_app_slug }}
          timeout-seconds: ${{ inputs.socket_app_timeout }}
          fail-on-findings: ${{ inputs.socket_app_fail_on_findings }}
          on-inconclusive: ${{ inputs.socket_app_on_inconclusive }}
          on-missing-app: ${{ inputs.socket_app_on_missing }}

      # Reads the scan the App already produced, addressed by the dashboard URL the
      # gate captured — no new scan, one quota unit, no duplicate analysis.
      # The App publishes the diff scan id in its own comment. Looking it up by
      # after_full_scan_id does not work: the App diffs against a different full
      # scan than the one its Project Report check links to.
      - name: Resolve Socket diff scan id
        id: diff-scan
        if: always() && inputs.socket_enable_api_report && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MANAGE_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          JQ='[.[] | select(.user.login == "socket-security[bot]") | .body] | last // ""'
          BODY=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq "$JQ")
          ID=$(printf '%s' "$BODY" \
            | grep -oE 'diff-scan/[0-9a-fA-F-]{36}' | head -1 | cut -d/ -f2 || true)
          if [ -n "$ID" ]; then
            echo "Resolved diff scan $ID from the Socket App comment."
          else
            echo "No diff scan id in the Socket App comment — it only posts one when dependencies change."
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Socket API Report
        id: api-report
        if: always() && inputs.socket_enable_api_report && github.event_name == 'pull_request'
        continue-on-error: true
        uses: LerianStudio/github-actions-shared-workflows/src/security/socket-api-report@v1
        with:
          socket-api-key: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          report-url: ${{ steps.app-gate.outputs.report-url }}
          max-rows: ${{ inputs.socket_api_max_rows }}
          include-actions: ${{ inputs.socket_api_include_actions }}
          fail-on-actions: ${{ inputs.socket_api_fail_on_actions }}
          # The baseline: findings already on the target branch are reported as
          # pre-existing and never block, so a repository carrying debt does not
          # fail every pull request for something none of them caused.
          base-branch: ${{ github.base_ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          diff-scan-id: ${{ steps.diff-scan.outputs.id }}

      - name: Post Socket report to PR
        if: always() && github.event_name == 'pull_request' && !inputs.dry_run
        uses: LerianStudio/github-actions-shared-workflows/src/security/socket-reporter@v1
        with:
          github-token: ${{ secrets.MANAGE_TOKEN || github.token }}
          app-name: ${{ env.SOCKET_APP_NAME }}
          comment-when: ${{ inputs.socket_comment_when }}
          firewall-blocked: ${{ steps.firewall.outputs.blocked || 'false' }}
          firewall-fail-on-block: ${{ inputs.socket_fail_on_block }}
          firewall-findings-file: ${{ steps.firewall.outputs.findings-file }}
          api-findings-file: ${{ steps.api-report.outputs.findings-file }}
          api-blocking-count: ${{ steps.api-report.outputs.blocking-count || '0' }}
          # yamllint disable-line rule:line-length
          run-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}

      # continue-on-error above keeps the report reachable even when a layer
      # fails, so the verdict is re-applied here.
      - name: Gate - Fail on Socket findings
        if: always()
        env:
          FIREWALL_OUTCOME: ${{ steps.firewall.outcome }}
          APP_GATE_OUTCOME: ${{ steps.app-gate.outcome }}
          API_BLOCKING: ${{ steps.api-report.outputs.blocking-count }}
        run: |
          FAILED=""
          [ "$FIREWALL_OUTCOME" = "failure" ] && FAILED="$FAILED Socket-Firewall"
          [ "$APP_GATE_OUTCOME" = "failure" ] && FAILED="$FAILED Socket-App-Gate"
          # Only real findings from the API layer block. Its API-failure paths
          # report zero here by construction, so an unreachable Socket cannot
          # fail a pull request.
          if [ "${API_BLOCKING:-0}" -gt 0 ] 2>/dev/null; then
            FAILED="$FAILED Socket-Dependency-Findings"
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Socket supply chain gate failed:$FAILED. See the Socket comment on the pull request."
            exit 1
          fi
          echo "Socket supply chain gate passed."

  socket-gate:
    name: Socket
    needs: [changes, socket]
    if: always()
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    permissions:
      contents: read
    steps:
      - name: Aggregate Socket result
        uses: LerianStudio/github-actions-shared-workflows/src/validate/result-gate@v1
        with:
          result: ${{ needs.changes.result != 'success' && needs.changes.result || needs.socket.result }}
          label: Socket

  # ----------------- Org ruleset compatibility stubs -----------------
  # Go Analysis and Lib Version are required status checks in the Lerian org
  # branch-protection ruleset (designed for Go repos). These stubs are
  # intentionally skipped (if: false) for JS/TS repositories — GitHub treats
  # a skipped conclusion as satisfying required status checks, so no separate
  # ruleset is needed.
  go-analysis-gate:
    name: Go Analysis
    if: ${{ github.event_name == 'none' }}
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    permissions:
      contents: read
    steps:
      - run: echo "Not applicable for JS/TS repositories"

  lib-version-gate:
    name: Lib Version
    if: ${{ github.event_name == 'none' }}
    runs-on: ${{ vars.GENERAL_RUNNERS || inputs.runner_type }}
    permissions:
      contents: read
    steps:
      - run: echo "Not applicable for JS/TS repositories"
