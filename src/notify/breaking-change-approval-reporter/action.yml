name: Breaking Change Approval Reporter
description: "Posts and keeps updated the single pull request comment that carries a breaking change's approval state — the request, the approval, or the rejection."

inputs:
  github-token:
    description: 'Token used to comment and label. Needs `pull-requests: write`.'
    required: true
  pr-number:
    description: Pull request to report on.
    required: true
  repository:
    description: Repository owning the pull request, as `owner/name`.
    required: false
    default: ${{ github.repository }}
  state:
    description: "What to report — `waiting`, `approved`, `rejected`, or `unresolved` when the approval ended without a recorded decision. Any other value fails the step."
    required: true
  reason:
    description: Why the pull request is gated, as resolved by `pr-gate-scope`.
    required: false
    default: ''
  head-sha:
    description: Head commit the report refers to.
    required: false
    default: ''
  acknowledged:
    description: Whether the author acknowledgement line is present in the description (true/false). Shown to the reviewer as context.
    required: false
    default: 'false'
  run-url:
    description: Link to the run carrying the pending deployment.
    required: false
    default: ''
  reviewers:
    description: 'Who can answer, as the `team:<slug>` / `user:<login>` list the Environment was given. Rendered as GitHub mentions so the reader knows who to ask instead of hunting through settings.'
    required: false
    default: ''
  server-url:
    description: Base URL used to build commit links.
    required: false
    default: ${{ github.server_url }}
  docs-url:
    description: Link to the explanation of how the gate works.
    required: false
    default: 'https://github.com/LerianStudio/github-actions-shared-workflows/blob/main/docs/breaking-change-approval.md'
  approvers:
    description: Comma-separated logins that approved.
    required: false
    default: ''
  rejecters:
    description: Comma-separated logins that rejected.
    required: false
    default: ''
  rejection-comment:
    description: Comment left with the rejection, if any.
    required: false
    default: ''
  close-on-rejection:
    description: Whether the caller closes the pull request on rejection. Only changes the wording — this composite never closes anything.
    required: false
    default: 'true'
  label:
    description: Label applied while waiting and removed once resolved. Cosmetic — failing to apply it never fails the step. Empty disables it.
    required: false
    default: ''
  enabled:
    description: Set to false to skip commenting entirely while still managing the label.
    required: false
    default: 'true'

outputs:
  comment-id:
    description: "Identifier of the comment that was created or updated. Empty when commenting is disabled."
    value: ${{ steps.report.outputs.comment-id }}

runs:
  using: composite
  steps:
    - name: Report the approval state
      id: report
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        STATE: ${{ inputs.state }}
        REASON: ${{ inputs.reason }}
        HEAD_SHA: ${{ inputs.head-sha }}
        ACKNOWLEDGED: ${{ inputs.acknowledged }}
        RUN_URL: ${{ inputs.run-url }}
        REVIEWERS: ${{ inputs.reviewers }}
        SERVER_URL: ${{ inputs.server-url }}
        DOCS_URL: ${{ inputs.docs-url }}
        APPROVERS: ${{ inputs.approvers }}
        REJECTERS: ${{ inputs.rejecters }}
        REJECTION_COMMENT: ${{ inputs.rejection-comment }}
        CLOSE_ON_REJECTION: ${{ inputs.close-on-rejection }}
        LABEL: ${{ inputs.label }}
        ENABLED: ${{ inputs.enabled }}
      run: |
        set -euo pipefail

        case "$STATE" in
          waiting | approved | rejected | unresolved ) ;;
          * )
            echo "state must be one of: waiting, approved, rejected, unresolved; got '${STATE}'." >&2
            exit 1
            ;;
        esac

        body_file=$(mktemp)
        trap 'rm -f "$body_file"' EXIT INT TERM

        owner=${REPO%%/*}

        # `team:x,user:y` -> linked names. The reader's next question is always
        # "who can unblock this", and the answer is sitting in the Environment
        # where nobody thinks to look.
        #
        # Links, deliberately not @mentions: the pending deployment already
        # notifies these very people, and a mention would ping the whole team a
        # second time for the same thing.
        mentions=""
        while IFS= read -r entry; do
          [ -z "$entry" ] && continue
          case "$entry" in
            team:*)
              slug=${entry#team:}
              mentions="${mentions:+$mentions, }[@${owner}/${slug}](${SERVER_URL}/orgs/${owner}/teams/${slug})"
              ;;
            *)
              login=${entry#user:}
              mentions="${mentions:+$mentions, }[@${login}](${SERVER_URL}/${login})"
              ;;
          esac
        done < <(tr ',' '\n' <<< "$REVIEWERS" | xargs -n1 2>/dev/null)

        commit_link=""
        if [ -n "$HEAD_SHA" ]; then
          commit_link="[\`${HEAD_SHA:0:7}\`](${SERVER_URL}/${REPO}/commit/${HEAD_SHA})"
        fi

        # shellcheck disable=SC2016  # the backticks below are Markdown code spans, not command substitutions
        {
          printf '<!-- breaking-change-approval -->\n\n'

          case "$STATE" in
            waiting)
              printf '### Breaking change — needs a decision\n\n'
              printf '%s carries a breaking change, so merging makes the next release a **major** version. That is often deliberate — this just asks someone to confirm it.\n\n' \
                "${commit_link:-This branch}"
              [ -n "$RUN_URL" ] && printf '### ➡️ [Approve or reject](%s)\n\n' "$RUN_URL"
              [ -n "$mentions" ] && printf 'Who can: %s\n\n' "$mentions"
              ;;
            approved)
              printf '### ✅ Breaking change approved\n\n'
              printf 'Approved by **%s**. The next release will be a major version.\n\n' \
                "${APPROVERS:-a reviewer}"
              ;;
            rejected)
              printf '### Breaking change rejected\n\n'
              printf 'Rejected by **%s**' "${REJECTERS:-a reviewer}"
              [ -n "$REJECTION_COMMENT" ] && printf ' — *%s*' "$REJECTION_COMMENT"
              printf '.\n\n'
              if [ "$CLOSE_ON_REJECTION" = "true" ]; then
                printf 'This pull request was closed. The branch is untouched — rework it without the break and reopen.\n\n'
              fi
              ;;
            unresolved)
              printf '### Breaking change — decision not recorded\n\n'
              printf 'The approval did not complete.'
              [ -n "$RUN_URL" ] && printf ' [Open the run](%s) to answer it.' "$RUN_URL"
              printf '\n\n'
              ;;
          esac

          # One compact line of context instead of a table of three rows.
          context=""
          [ -n "$REASON" ] && context="Gated by \`${REASON}\`"
          if [ "$STATE" = "waiting" ]; then
            if [ "$ACKNOWLEDGED" = "true" ]; then
              context="${context:+$context · }author acknowledged"
            else
              context="${context:+$context · }author acknowledgement missing"
            fi
          fi
          [ -n "$context" ] && printf '<sub>%s</sub>\n\n' "$context"

          if [ "$STATE" = "waiting" ]; then
            printf '<sub>Not intended? Drop the `!` and any `BREAKING CHANGE:` footer from the commits and push again — the gate clears itself. '
            printf '[How this works](%s)</sub>\n' "$DOCS_URL"
          fi
        } > "$body_file"

        comment_id=""
        if [ "$ENABLED" = "true" ]; then
          marker='<!-- breaking-change-approval -->'
          # One comment per pull request, edited in place: a pull request revised
          # ten times still has one, and the record of who decided what survives.
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"${marker}\")) | .id] | first // empty")

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" \
              -F body=@"$body_file" >/dev/null
            comment_id="$existing"
          else
            comment_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -F body=@"$body_file" --jq '.id')
          fi
        fi

        # Cosmetic and deliberately last — a repository that never declared the
        # label still gets its gate.
        if [ -n "$LABEL" ]; then
          if [ "$STATE" = "waiting" ]; then
            if ! gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL" >/dev/null 2>&1; then
              echo "::notice::Label '${LABEL}' not applied — it is not declared in ${REPO}. Cosmetic only."
            fi
          else
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$LABEL" >/dev/null 2>&1 || true
          fi
        fi

        echo "comment-id=$comment_id" >> "$GITHUB_OUTPUT"
