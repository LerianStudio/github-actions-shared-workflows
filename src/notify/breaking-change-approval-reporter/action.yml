name: Breaking Change Approval Reporter
description: "Posts and keeps updated the single pull request comment that carries a breaking change's approval state — the request, the approval, or the rejection."

inputs:
  github-token:
    description: 'Token used to comment and label. Needs `pull-requests: write`.'
    required: true
  pr-number:
    description: Pull request to report on.
    required: true
  repository:
    description: Repository owning the pull request, as `owner/name`.
    required: false
    default: ${{ github.repository }}
  state:
    description: "What to report — `waiting`, `approved`, `rejected`, or `unresolved` when the approval ended without a recorded decision. Any other value fails the step."
    required: true
  reason:
    description: Why the pull request is gated, as resolved by `pr-gate-scope`.
    required: false
    default: ''
  head-sha:
    description: Head commit the report refers to.
    required: false
    default: ''
  acknowledged:
    description: Whether the author acknowledgement line is present in the description (true/false). Shown to the reviewer as context.
    required: false
    default: 'false'
  run-url:
    description: Link to the run carrying the pending deployment.
    required: false
    default: ''
  reviewers:
    description: 'Who can answer, as a `team:<slug>` / `user:<login>` list. Rendered as links, never as @mentions — the pending deployment already notifies these people, so a mention would ping them twice for the same thing.'
    required: false
    default: ''
  actual-reviewers:
    description: 'Reviewers read from the Environment itself, in the same format. Preferred over `reviewers` when present: an Environment that already existed may be gated by different people than the caller configured, and naming the wrong ones is worse than naming none.'
    required: false
    default: ''
  server-url:
    description: Base URL used to build commit links.
    required: false
    default: ${{ github.server_url }}
  badge-url:
    description: 'Image used as the call-to-action button. Markdown has no button, so this is a badge image wrapped in the link. Its alt text carries the full call to action, so a reader whose network blocks the image still sees a described link. Set to empty for a plain text link instead.'
    required: false
    default: 'https://img.shields.io/badge/%E2%9E%A1%EF%B8%8F%20Review%20pending%20deployment-1f6feb?style=for-the-badge'
  docs-url:
    description: Link to the explanation of how the gate works.
    required: false
    default: 'https://github.com/LerianStudio/github-actions-shared-workflows/blob/main/docs/breaking-change-approval.md'
  approvers:
    description: Comma-separated logins that approved.
    required: false
    default: ''
  rejecters:
    description: Comma-separated logins that rejected.
    required: false
    default: ''
  rejection-comment:
    description: Comment left with the rejection, if any.
    required: false
    default: ''
  close-on-rejection:
    description: Whether the caller closes the pull request on rejection. Only changes the wording — this composite never closes anything.
    required: false
    default: 'true'
  label:
    description: Label applied while waiting and removed once resolved. Cosmetic — failing to apply it never fails the step. Empty disables it.
    required: false
    default: ''
  enabled:
    description: Set to false to skip commenting entirely while still managing the label.
    required: false
    default: 'true'

outputs:
  comment-id:
    description: "Identifier of the comment that was created or updated. Empty when commenting is disabled."
    value: ${{ steps.report.outputs.comment-id }}

runs:
  using: composite
  steps:
    - name: Report the approval state
      id: report
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        STATE: ${{ inputs.state }}
        REASON: ${{ inputs.reason }}
        HEAD_SHA: ${{ inputs.head-sha }}
        ACKNOWLEDGED: ${{ inputs.acknowledged }}
        RUN_URL: ${{ inputs.run-url }}
        REVIEWERS: ${{ inputs.actual-reviewers != '' && inputs.actual-reviewers || inputs.reviewers }}
        SERVER_URL: ${{ inputs.server-url }}
        BADGE_URL: ${{ inputs.badge-url }}
        DOCS_URL: ${{ inputs.docs-url }}
        APPROVERS: ${{ inputs.approvers }}
        REJECTERS: ${{ inputs.rejecters }}
        REJECTION_COMMENT: ${{ inputs.rejection-comment }}
        CLOSE_ON_REJECTION: ${{ inputs.close-on-rejection }}
        LABEL: ${{ inputs.label }}
        ENABLED: ${{ inputs.enabled }}
      run: |
        set -euo pipefail

        case "$STATE" in
          waiting | approved | rejected | unresolved ) ;;
          * )
            echo "state must be one of: waiting, approved, rejected, unresolved; got '${STATE}'." >&2
            exit 1
            ;;
        esac

        body_file=$(mktemp)
        trap 'rm -f "$body_file"' EXIT INT TERM

        owner=${REPO%%/*}

        # `team:x,user:y` -> linked names. The reader's next question is always
        # "who can unblock this", and the answer is sitting in the Environment
        # where nobody thinks to look.
        #
        # Links, deliberately not @mentions: the pending deployment already
        # notifies these very people, and a mention would ping the whole team a
        # second time for the same thing.
        mentions=""
        while IFS= read -r entry; do
          [ -z "$entry" ] && continue
          case "$entry" in
            team:*)
              slug=${entry#team:}
              mentions="${mentions:+$mentions, }[@${owner}/${slug}](${SERVER_URL}/orgs/${owner}/teams/${slug})"
              ;;
            *)
              login=${entry#user:}
              mentions="${mentions:+$mentions, }[@${login}](${SERVER_URL}/${login})"
              ;;
          esac
        done < <(tr ',' '\n' <<< "$REVIEWERS" | xargs -n1 2>/dev/null)

        # The subjects that actually tripped the gate, so the "how to undo it"
        # example shows this pull request's own commits rather than a made-up
        # `feat(scope)!: subject`.
        #
        # Only the `!` form is matched here, because that is the form the diff
        # below illustrates. This is a view, never a verdict: the canonical rule
        # lives in the breaking-change-guard composite, and when the two disagree
        # the detector wins — this just falls back to generic wording.
        breaking_subjects=""
        if [ "$STATE" = "waiting" ]; then
          breaking_subjects=$(
            gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
              --jq '.[] | .commit.message | split("\n")[0]' 2>/dev/null \
              | grep -E '^[A-Za-z0-9_]*(\([^)]*\))?!: ' || true
          )
        fi

        commit_link=""
        if [ -n "$HEAD_SHA" ]; then
          commit_link="[\`${HEAD_SHA:0:7}\`](${SERVER_URL}/${REPO}/commit/${HEAD_SHA})"
        fi

        # shellcheck disable=SC2016  # the backticks below are Markdown code spans, not command substitutions
        {
          printf '<!-- breaking-change-approval -->\n\n'

          case "$STATE" in
            waiting)
              printf '> [!IMPORTANT]\n'
              printf '> **Breaking change detected — this pull request needs a decision**\n'
              printf '>\n'
              printf '> Merging it makes the next release a **major** version. That is often deliberate; this just asks someone to confirm it before it ships.\n\n'

              # A shields.io badge renders as an actual button, which nothing in
              # GitHub-flavoured Markdown does on its own. The alt text carries
              # the full call to action on purpose: if the image fails to load —
              # shields down, or a network that blocks it — the reader still sees
              # a described link rather than a broken rectangle.
              if [ -n "$RUN_URL" ] && [ -n "$BADGE_URL" ]; then
                printf '[![Review the pending deployment](%s)](%s)\n\n' "$BADGE_URL" "$RUN_URL"
                printf '<sub>Actions → **Review deployments** → `breaking-approval`</sub>\n\n'
              elif [ -n "$RUN_URL" ]; then
                printf '### ➡️ [Review the pending deployment](%s)\n\n' "$RUN_URL"
              fi

              printf '|  |  |\n|:--|:--|\n'
              [ -n "$commit_link" ] && printf '| **Commit** | %s |\n' "$commit_link"
              [ -n "$mentions" ] && printf '| **Who can decide** | %s |\n' "$mentions"
              printf '| **Author acknowledgement** | %s |\n\n' \
                "$([ "$ACKNOWLEDGED" = "true" ] && echo "present" || echo "missing")"
              ;;
            approved)
              printf '### ✅ Breaking change approved\n\n'
              printf 'Approved by **%s**. The next release will be a major version.\n\n' \
                "${APPROVERS:-a reviewer}"
              ;;
            rejected)
              printf '### Breaking change rejected\n\n'
              printf 'Rejected by **%s**' "${REJECTERS:-a reviewer}"
              [ -n "$REJECTION_COMMENT" ] && printf ' — *%s*' "$REJECTION_COMMENT"
              printf '.\n\n'
              if [ "$CLOSE_ON_REJECTION" = "true" ]; then
                printf 'This pull request was closed. The branch is untouched — rework it without the break and reopen.\n\n'
              fi
              ;;
            unresolved)
              printf '### Breaking change — decision not recorded\n\n'
              printf 'The approval did not complete.'
              [ -n "$RUN_URL" ] && printf ' [Open the run](%s) to answer it.' "$RUN_URL"
              printf '\n\n'
              ;;
          esac

          # The escape hatch is folded away: it matters enormously to whoever
          # broke the contract by accident, and not at all to whoever meant to.
          if [ "$STATE" = "waiting" ]; then
            printf '<details>\n'
            printf '<summary><b>Not intentional?</b> — how to clear this without an approval</summary>\n\n'
            if [ -n "$breaking_subjects" ]; then
              printf 'Drop the `!` from the commit subject, then push again. The gate re-evaluates and clears itself.\n\n'
              printf '```diff\n'
              while IFS= read -r subject; do
                [ -z "$subject" ] && continue
                printf -- '- %s\n' "$subject"
                printf -- '+ %s\n' "$(sed -E 's/^([A-Za-z0-9_]*(\([^)]*\))?)!:/\1:/' <<< "$subject")"
              done <<< "$breaking_subjects"
              printf '```\n\n'
              printf 'Also remove any `BREAKING CHANGE:` footer from the commit bodies, if there is one.\n\n'
            else
              printf 'Remove the `BREAKING CHANGE:` footer from the commit bodies, and drop any `!` after the type in the subjects. Push again and the gate re-evaluates.\n\n'
            fi
            printf '</details>\n\n'
          fi

          context=""
          [ -n "$REASON" ] && context="Gated by \`${REASON}\`"
          context="${context:+$context · }[How this gate works](${DOCS_URL})"
          printf '<sub>%s</sub>\n' "$context"
        } > "$body_file"

        comment_id=""
        if [ "$ENABLED" = "true" ]; then
          marker='<!-- breaking-change-approval -->'
          # One comment per pull request, edited in place: a pull request revised
          # ten times still has one, and the record of who decided what survives.
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"${marker}\")) | .id] | first // empty")

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" \
              -F body=@"$body_file" >/dev/null
            comment_id="$existing"
          else
            comment_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -F body=@"$body_file" --jq '.id')
          fi
        fi

        # Cosmetic and deliberately last — a repository that never declared the
        # label still gets its gate.
        if [ -n "$LABEL" ]; then
          if [ "$STATE" = "waiting" ]; then
            if ! gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL" >/dev/null 2>&1; then
              echo "::notice::Label '${LABEL}' not applied — it is not declared in ${REPO}. Cosmetic only."
            fi
          else
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$LABEL" >/dev/null 2>&1 || true
          fi
        fi

        echo "comment-id=$comment_id" >> "$GITHUB_OUTPUT"
