name: PR Checks Summary
description: "Generates a summary table of all PR validation check results, grouped by tier."

inputs:
  source-branch-result:
    description: Result of source branch validation
    required: false
    default: skipped
  title-result:
    description: Result of PR title validation
    required: false
    default: skipped
  size-result:
    description: Result of PR size check
    required: false
    default: skipped
  description-result:
    description: Result of PR description check
    required: false
    default: skipped
  label-result:
    description: Result of auto-label step
    required: false
    default: skipped
  metadata-result:
    description: Result of PR metadata check
    required: false
    default: skipped
  breaking-change-result:
    description: Result of breaking change guard
    required: false
    default: skipped
  blocking-checks-result:
    description: Runtime result of the blocking checks job
    required: false
    default: skipped
  dry-run:
    description: Whether this is a dry run
    required: false
    default: "false"

outputs:
  has-breaking-change-guard:
    description: Whether the breaking change guard result was reported (true/false)
    value: ${{ steps.guard-state.outputs.has-breaking-change-guard }}
  has-blocking-checks-runtime-failure:
    description: Whether the blocking checks runtime result is non-success and non-skipped (true/false)
    value: ${{ steps.guard-state.outputs.has-blocking-checks-runtime-failure }}

runs:
  using: composite
  steps:
    - name: Resolve breaking change guard state
      id: guard-state
      shell: bash
      env:
        BREAKING_CHANGE_RESULT: ${{ inputs.breaking-change-result }}
        BLOCKING_CHECKS_RESULT: ${{ inputs.blocking-checks-result }}
      run: |
        set -euo pipefail
        if [ "$BREAKING_CHANGE_RESULT" != "skipped" ]; then
          echo "has-breaking-change-guard=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-breaking-change-guard=false" >> "$GITHUB_OUTPUT"
        fi
        if [ "$BLOCKING_CHECKS_RESULT" != "success" ] && [ "$BLOCKING_CHECKS_RESULT" != "skipped" ]; then
          echo "has-blocking-checks-runtime-failure=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-blocking-checks-runtime-failure=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Summary
      shell: bash
      env:
        SOURCE_BRANCH_RESULT: ${{ inputs.source-branch-result }}
        TITLE_RESULT: ${{ inputs.title-result }}
        SIZE_RESULT: ${{ inputs.size-result }}
        DESCRIPTION_RESULT: ${{ inputs.description-result }}
        LABEL_RESULT: ${{ inputs.label-result }}
        METADATA_RESULT: ${{ inputs.metadata-result }}
        BREAKING_CHANGE_RESULT: ${{ inputs.breaking-change-result }}
        BLOCKING_CHECKS_RESULT: ${{ inputs.blocking-checks-result }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        icon() {
          case "$1" in
            success) echo "✅" ;;
            failure|cancelled) echo "❌" ;;
            skipped) echo "⏭️" ;;
            *)       echo "⚠️" ;;
          esac
        }

        {
          echo "## PR Checks Summary"
          echo ""
          if [ "$DRY_RUN" = "true" ]; then
            echo "> **DRY RUN** — no comments, labels, or reviews were posted"
            echo ""
          fi
          echo "### Blocking"
          echo ""
          echo "| Check | Result |"
          echo "|-------|--------|"
          echo "| Source Branch | $(icon "$SOURCE_BRANCH_RESULT") ${SOURCE_BRANCH_RESULT} |"
          echo "| PR Title | $(icon "$TITLE_RESULT") ${TITLE_RESULT} |"
          echo "| PR Description | $(icon "$DESCRIPTION_RESULT") ${DESCRIPTION_RESULT} |"
          if [ "$BREAKING_CHANGE_RESULT" != "skipped" ]; then
            echo "| Breaking Change Guard | $(icon "$BREAKING_CHANGE_RESULT") ${BREAKING_CHANGE_RESULT} |"
          fi
          if [ "$BLOCKING_CHECKS_RESULT" != "success" ] && [ "$BLOCKING_CHECKS_RESULT" != "skipped" ]; then
            echo "| Blocking Checks Runtime | $(icon "$BLOCKING_CHECKS_RESULT") ${BLOCKING_CHECKS_RESULT} |"
          fi
          echo ""
          echo "### Advisory"
          echo ""
          echo "| Check | Result |"
          echo "|-------|--------|"
          echo "| PR Size | $(icon "$SIZE_RESULT") ${SIZE_RESULT} |"
          echo "| Auto-label | $(icon "$LABEL_RESULT") ${LABEL_RESULT} |"
          echo "| Metadata | $(icon "$METADATA_RESULT") ${METADATA_RESULT} |"
        } >> "$GITHUB_STEP_SUMMARY"
