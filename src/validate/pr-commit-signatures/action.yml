name: Validate PR Commit Signatures
description: "Fails when any commit in the pull request is unsigned or has an unverified signature, listing every offending commit."

inputs:
  github-token:
    description: GitHub token with contents read and pull-requests read permission
    required: true
  dry-run:
    description: "When true, report findings without failing the check"
    required: false
    default: "false"

outputs:
  total-commits:
    description: Number of commits evaluated in the pull request
    value: ${{ steps.verify.outputs.total-commits }}
  unverified-count:
    description: Number of commits that are unsigned or unverified
    value: ${{ steps.verify.outputs.unverified-count }}
  has-signature-failures:
    description: >-
      Whether the check failed (true/false). True when any commit is unverified or when the
      verdict could not cover every commit, which unverified-count alone does not express.
    value: ${{ steps.verify.outputs.has-signature-failures }}
  evaluation-complete:
    description: >-
      Whether the verdict covered every commit in the pull request (true/false). False only when
      the commit range could not be resolved, which has-signature-failures folds in and therefore
      cannot express on its own.
    value: ${{ steps.verify.outputs.evaluation-complete }}
  commit-source:
    description: >-
      Where the evaluated commits came from: `api` (Pull Request Commits API, PRs at or below the
      250-commit cap) or `range` (SHAs resolved from the git DAG, PRs above the cap).
    value: ${{ steps.verify.outputs.commit-source }}
  findings-markdown:
    description: >-
      Rendered Markdown detailing the offending commits, each linked to its commit page, ready to
      embed in a pull request comment. Empty when there is nothing to report.
    value: ${{ steps.verify.outputs.findings-markdown }}

runs:
  using: composite
  steps:
    # ----------------- Commit range (only past the API cap) -----------------
    # The Pull Request Commits API — REST and GraphQL alike — caps a pull request at 250
    # commits, so a release PR carrying hundreds of commits can never be evaluated through
    # it. Past the cap, resolve the range straight from the git DAG instead: the commit
    # objects are all this needs, so the fetch filters trees and blobs out entirely.
    - name: Resolve the full commit range
      id: range
      if: github.event.pull_request.commits > 250
      # A fetch that cannot resolve the range must not swallow the verdict: the next step
      # falls back to the API, comes up short of the declared count, and fails closed with
      # an explanation instead of a bare red check.
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        set -euo pipefail

        work="${RUNNER_TEMP}/pr-commit-signatures"
        rm -rf "$work"
        git init -q "$work"

        # A composite cannot register a post step, so the credential written below would
        # otherwise outlive this step and stay readable by every later step in the job.
        # Nothing past the fetch needs the repository — only shas.txt, which lives outside
        # .git — so drop the whole thing on the way out, including the `set -e` exit after
        # a failed fetch.
        trap 'rm -rf "${work:?}/.git"' EXIT

        # Auth via a local http header, the way actions/checkout does it: the token stays
        # out of the remote URL, so it cannot leak through `git remote -v` or error output.
        git -C "$work" remote add origin "https://github.com/${REPOSITORY}.git"
        git -C "$work" config --local \
          "http.https://github.com/.extraheader" \
          "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

        # refs/pull/N/head works for fork pull requests too — the base repository always
        # carries it, so this never has to reach into the contributor's fork.
        git -C "$work" fetch -q --no-tags --filter=tree:0 --prune origin \
          "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head" \
          "+refs/heads/${BASE_REF}:refs/remotes/pr/base"

        head_sha="$(git -C "$work" rev-parse refs/remotes/pr/head)"
        merge_base="$(git -C "$work" merge-base refs/remotes/pr/base refs/remotes/pr/head)"
        git -C "$work" rev-list "${merge_base}..${head_sha}" > "${work}/shas.txt"

        count="$(wc -l < "${work}/shas.txt")"
        if [ "$count" -eq 0 ]; then
          echo "Resolved no commits in ${merge_base}..${head_sha} — refusing to report a verdict on an empty range" >&2
          exit 1
        fi

        # The head is published so verification can bind the range to the pull request it
        # is judging: refs/pull/N/head moves with every push, so a range resolved for
        # another head must not pass as a verdict for this one.
        {
          echo "sha-file=${work}/shas.txt"
          echo "head-sha=${head_sha}"
        } >> "$GITHUB_OUTPUT"
        echo "Resolved ${count} commit(s) in ${merge_base}..${head_sha}"

    # ----------------- Verification -----------------
    - name: Verify commit signatures
      id: verify
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        RANGE_SHA_FILE: ${{ steps.range.outputs.sha-file }}
        RANGE_HEAD_SHA: ${{ steps.range.outputs.head-sha }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const dryRun = process.env.DRY_RUN === 'true';
          const rangeShaFile = process.env.RANGE_SHA_FILE || '';
          const rangeHeadSha = process.env.RANGE_HEAD_SHA || '';
          const pr = context.payload.pull_request;

          if (!pr) {
            core.setFailed('Commit signature validation requires a pull_request event payload.');
            return;
          }

          const { owner, repo } = context.repo;
          const commitUrl = (sha) => `${context.serverUrl}/${owner}/${repo}/commit/${sha}`;

          // GraphQL has no bulk commit lookup, so each SHA becomes an aliased `object(oid:)`
          // field. Batches stay well inside the query complexity budget; a 600-commit PR is
          // a dozen requests instead of one call the API refuses to answer.
          const OID_BATCH = 50;

          const verifyByOid = async (shas) => {
            const evaluated = [];
            for (let start = 0; start < shas.length; start += OID_BATCH) {
              const batch = shas.slice(start, start + OID_BATCH);
              const declarations = batch.map((_, i) => `$oid${i}: GitObjectID!`).join(', ');
              const selections = batch
                .map(
                  (_, i) => `c${i}: object(oid: $oid${i}) { ... on Commit {
                    url
                    signature { isValid state }
                    author { name user { login } }
                  } }`,
                )
                .join('\n');
              const variables = { owner, repo };
              batch.forEach((sha, i) => { variables[`oid${i}`] = sha; });

              const data = await github.graphql(
                `query($owner: String!, $repo: String!, ${declarations}) {
                  repository(owner: $owner, name: $repo) {
                    ${selections}
                  }
                }`,
                variables,
              );

              batch.forEach((sha, i) => {
                const node = data?.repository?.[`c${i}`];
                const signature = node?.signature;
                evaluated.push({
                  sha,
                  url: node?.url || commitUrl(sha),
                  // A commit the API cannot resolve is not a pass: it stays unverified with
                  // no signature state to report.
                  verified: signature?.isValid === true,
                  reason: node ? (signature?.state ?? 'unsigned') : 'unknown',
                  author: node?.author?.user?.login || node?.author?.name,
                });
              });
            }
            return evaluated;
          };

          const fromApi = async () => {
            // github.paginate walks every page, so PRs with more than 100 commits are fully
            // evaluated up to the API's own 250-commit cap.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            return commits.map(c => ({
              sha: c.sha,
              url: c.html_url,
              verified: c.commit?.verification?.verified === true,
              reason: c.commit?.verification?.reason ?? 'unknown',
              author: c.author?.login || c.commit?.author?.name,
            }));
          };

          const declared = typeof pr.commits === 'number' ? pr.commits : 0;

          let evaluated;
          let source;
          if (rangeShaFile) {
            // Whatever the range step wrote is git output, but it feeds a GraphQL variable
            // and a URL, so accept object names and nothing else.
            const shas = require('fs')
              .readFileSync(rangeShaFile, 'utf8')
              .split('\n')
              .map(line => line.trim())
              .filter(line => /^[0-9a-f]{40}$/.test(line));
            evaluated = await verifyByOid(shas);
            source = 'range';
          } else {
            evaluated = await fromApi();
            source = 'api';
          }

          // Neither source is trusted to be complete on its own.
          //
          // The API comes up short whenever the pull request declares more commits than it
          // will return. The range is the full set between the merge base and the head by
          // construction, so counting it against `declared` would only re-add the noise
          // the API path suffers from — but it is complete for *a* head, and that head has
          // to be the one under review. `refs/pull/N/head` moves with every push, so a
          // range resolved for an older head is a verdict about code nobody is asking
          // about. An empty range means the step handed over nothing at all.
          //
          // Either way this must not read as a pass: an incomplete verdict is the whole
          // reason `evaluation-complete` exists next to `unverified-count`.
          const prHeadSha = pr.head?.sha || '';
          const staleRange =
            source === 'range' && rangeHeadSha !== '' && prHeadSha !== '' && rangeHeadSha !== prHeadSha;
          const emptyRange = source === 'range' && evaluated.length === 0;
          const incomplete =
            source === 'api' ? evaluated.length < declared : emptyRange || staleRange;

          // A commit that GitHub could not link to an account falls back to the name in the
          // commit object, which is whatever the pusher set in `git config user.name` — it is
          // author-controlled text. It reaches a Markdown table inside a comment that reads as
          // coming from CI, and a log annotation, so collapse it to one line at the source
          // (a newline forges extra annotation lines) and escape it at every Markdown sink.
          const oneLine = (value) => String(value ?? '').replace(/\s+/g, ' ').trim() || 'unknown';

          // Markdown table cell: `|` ends the cell, `[`/`]` open a link, `<` opens raw HTML,
          // backtick opens a code span. Backslash-escape the Markdown actives (escaping the
          // backslash itself first) and entity-encode the HTML ones.
          const cell = (value) =>
            oneLine(value)
              .replace(/[<>]/g, (ch) => (ch === '<' ? '&lt;' : '&gt;'))
              .replace(/([\\`|*_[\]])/g, '\\$1');

          // The verification reason is a GitHub enum (unsigned, unknown_key, expired_key, ...),
          // so anything outside that alphabet is not a value this renders — drop it rather than
          // escape it, since it sits inside a code span where backslashes do not escape.
          const enumValue = (value) =>
            oneLine(value).toLowerCase().replace(/[^a-z0-9_.-]/g, '') || 'unknown';

          const offenders = evaluated
            .filter(c => !c.verified)
            .map(c => ({
              sha: c.sha,
              short: c.sha.slice(0, 7),
              url: c.url,
              author: oneLine(c.author),
              reason: enumValue(c.reason),
            }));

          core.setOutput('total-commits', String(evaluated.length));
          core.setOutput('unverified-count', String(offenders.length));
          core.setOutput('has-signature-failures', String(offenders.length > 0 || incomplete));
          core.setOutput('evaluation-complete', String(!incomplete));
          core.setOutput('commit-source', source);


          const remediation = [
            '### How to fix',
            '',
            'Configure commit signing, then re-sign the commits in this branch:',
            '',
            '```bash',
            '# 1. Make sure signing is configured (SSH or GPG key registered on GitHub)',
            'git config --local commit.gpgsign true',
            '',
            '# 2. Re-sign every commit of this branch on top of its base',
            `git rebase --exec 'git commit --amend --no-edit -S' origin/${pr.base?.ref || 'main'}`,
            '',
            '# 3. Update the pull request',
            'git push --force-with-lease',
            '```',
            '',
            'Docs: https://docs.github.com/en/authentication/managing-commit-signature-verification',
          ].join('\n');

          // Detail for the pull request comment. The step summary lives inside the job, so a
          // contributor has to know to go looking for it; the offending commits belong where the
          // verdict is read. Rows are capped because a comment listing hundreds of commits is
          // unreadable and the summary already carries the full list.
          const COMMENT_ROW_LIMIT = 20;
          const findingRow = (o) =>
            `| [\`${o.short}\`](${o.url}) | ${cell(o.author)} | \`${o.reason}\` |`;

          const findings = [];
          if (offenders.length > 0) {
            findings.push(
              `**${offenders.length} unsigned or unverified commit${offenders.length === 1 ? '' : 's'}**`,
              '',
              '| Commit | Author | Reason |',
              '|--------|--------|--------|',
              ...offenders.slice(0, COMMENT_ROW_LIMIT).map(findingRow),
            );
            if (offenders.length > COMMENT_ROW_LIMIT) {
              findings.push(
                '',
                `<sub>Showing the first ${COMMENT_ROW_LIMIT} of ${offenders.length}. The job summary lists every one.</sub>`,
              );
            }
            findings.push('', remediation);
          }
          const short = (sha) => String(sha).slice(0, 7);

          // Why the verdict is partial, in the reader's terms — each cause needs its own
          // remedy, so none of them can share a generic "could not evaluate" line.
          const incompleteNotice = () => {
            if (staleRange) {
              return [
                `> The commit range was resolved for \`${short(rangeHeadSha)}\`, but this pull request now`,
                `> points at \`${short(prHeadSha)}\`. A push landed while the check was running, so this`,
                '> verdict is stale — the run for the new head is the one that decides.',
              ];
            }
            if (emptyRange) {
              return [
                `> The commit range resolved from git came back empty while this pull request declares`,
                `> ${declared} commits, so no signature was checked. The check fails closed rather than`,
                '> reporting a verdict it never computed.',
              ];
            }
            return [
              `> This pull request declares ${declared} commits and the API returned ${evaluated.length}.`,
              '> Both the REST and GraphQL commit APIs cap a pull request at 250 commits, and the',
              '> commit range could not be resolved from git either, so the verdict above covers',
              '> the most recent 250 and cannot speak for the rest.',
            ];
          };

          if (incomplete) {
            findings.push('', ...incompleteNotice());
          }
          core.setOutput('findings-markdown', findings.join('\n'));

          const lines = [`## Commit Signature Validation`, ''];

          if (dryRun) {
            lines.push('> **DRY RUN** — findings are reported but the check does not fail', '');
          }

          lines.push(`Commits evaluated: **${evaluated.length}**`, '');

          if (source === 'range') {
            lines.push(
              `<sub>This pull request exceeds the 250-commit API cap, so the commits were resolved from the git history between the merge base and the head.</sub>`,
              '',
            );
          }

          if (incomplete) {
            lines.push(`> ⚠️ The signature verdict cannot cover every commit.`, ...incompleteNotice(), '');
          }

          if (offenders.length > 0) {
            lines.push(
              `Unsigned or unverified commits: **${offenders.length}**`,
              '',
              '| Commit | Author | Status | Reason |',
              '|--------|--------|--------|--------|',
              ...offenders.map(o => `| [\`${o.short}\`](${o.url}) | ${cell(o.author)} | ❌ unverified | \`${o.reason}\` |`),
              '',
              remediation,
            );
          } else if (!incomplete) {
            lines.push('✅ Every commit in this pull request carries a verified signature.');
          }

          await core.summary.addRaw(lines.join('\n')).write();

          for (const o of offenders) {
            core.error(`Commit ${o.short} by ${o.author} is not verified (reason: ${o.reason}) — ${o.url}`);
          }

          if (offenders.length === 0 && !incomplete) {
            core.info(`✅ All ${evaluated.length} commit(s) are verified.`);
            return;
          }

          let failure;
          if (staleRange) {
            failure = `Commit signature validation resolved the commit range for ${short(rangeHeadSha)} but this pull request points at ${short(prHeadSha)}; the verdict is stale.`;
          } else if (emptyRange) {
            failure = `Commit signature validation resolved no commits for a pull request that declares ${declared}; the verdict cannot be trusted.`;
          } else if (incomplete) {
            failure = `Commit signature validation could not evaluate all ${declared} commits (only ${evaluated.length} returned by the API); ${offenders.length} of those are unsigned or unverified.`;
          } else {
            failure = `${offenders.length} of ${evaluated.length} commit(s) in this pull request are unsigned or unverified.`;
          }

          if (dryRun) {
            core.notice(`DRY RUN — ${failure}`);
            return;
          }

          core.setFailed(failure);
