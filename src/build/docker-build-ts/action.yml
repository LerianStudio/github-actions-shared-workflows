name: Docker Build & Push (TypeScript)
description: Build and push a Docker image for a TypeScript/Node.js component with built-in npmrc authentication for GitHub Packages.

inputs:
  # Registry
  enable-dockerhub:
    description: Enable pushing to DockerHub
    required: false
    default: "false"
  enable-ghcr:
    description: Enable pushing to GHCR
    required: false
    default: "true"
  dockerhub-org:
    description: DockerHub organization name
    required: false
    default: "lerianstudio"
  ghcr-org:
    description: GHCR organization name (defaults to repository owner)
    required: false
    default: ""
  # Credentials
  dockerhub-username:
    description: DockerHub username
    required: false
    default: ""
  dockerhub-password:
    description: DockerHub password
    required: false
    default: ""
  ghcr-token:
    description: Token for GHCR login and npmrc authentication
    required: true
  # Build
  dockerhub-app-name:
    description: >-
      Repository name on Docker Hub, when it has to differ from app-name.
      Docker Hub has no nested namespaces — a name like `alpha/my-app` is valid
      on GHCR and rejected there — so a package published under a GHCR
      namespace needs a flat name here. Empty reuses app-name.
    required: false
    default: ""
  app-name:
    description: Image name for this component
    required: true
  working-dir:
    description: Working directory for this component
    required: false
    default: "."
  dockerfile:
    description: Dockerfile path relative to working-dir (overrides dockerfile-name)
    required: false
    default: ""
  dockerfile-name:
    description: Default Dockerfile name when dockerfile is not set
    required: false
    default: "Dockerfile"
  build-context:
    description: Docker build context
    required: false
    default: "."
  build-secrets:
    description: Additional secrets for docker build (one per line). npmrc is always included.
    required: false
    default: ""
  platforms:
    description: Target platforms (e.g., linux/amd64 or linux/amd64,linux/arm64)
    required: false
    default: "linux/amd64"
  version:
    description: >-
      Semver version extracted from tag (e.g. v1.0.0-beta.1). Ignored when
      raw-tag is set, which is the case for builds that are not cut from a tag.
    required: false
    default: ""
  raw-tag:
    description: >-
      Tag the image verbatim instead of deriving it from version. Use for
      artifacts outside the release line — a disposable preview built from a
      branch, whose name is not a semver version and would be rejected by the
      semver tag strategy.
    required: false
    default: ""
  is-release:
    description: Whether this is a production release (enables major tag)
    required: false
    default: "false"
  # Mode
  dry-run:
    description: Build without pushing
    required: false
    default: "false"

outputs:
  image-digest:
    description: Digest of the pushed image
    value: ${{ steps.build-push.outputs.digest || steps.build-dry.outputs.digest || '' }}
  image-tags:
    description: Tags applied to the image
    value: ${{ steps.meta.outputs.tags }}

runs:
  using: composite
  steps:
    # ----------------- Setup -----------------
    - name: Set up QEMU
      if: ${{ contains(inputs.platforms, 'arm64') }}
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Log in to DockerHub
      if: ${{ inputs.enable-dockerhub == 'true' }}
      uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    - name: Log in to GHCR
      if: ${{ inputs.enable-ghcr == 'true' }}
      uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.ghcr-token }}

    # ----------------- Image Configuration -----------------
    # An image with no tag at all is a silent failure: the build succeeds and
    # nothing usable is published.
    - name: Require a tag source
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        RAW_TAG: ${{ inputs.raw-tag }}
      run: |
        set -euo pipefail
        if [ -z "$VERSION" ] && [ -z "$RAW_TAG" ]; then
          echo "::error::Neither version nor raw-tag was provided — the image would be built untagged."
          exit 1
        fi

    - name: Normalize repository owner to lowercase
      id: normalize
      shell: bash
      run: |
        echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set image names
      id: image-names
      shell: bash
      run: |
        IMAGES=""
        GHCR_ORG="${{ inputs.ghcr-org }}"
        if [ -z "$GHCR_ORG" ]; then
          GHCR_ORG="${{ steps.normalize.outputs.owner_lower }}"
        else
          GHCR_ORG=$(echo "$GHCR_ORG" | tr '[:upper:]' '[:lower:]')
        fi

        if [ "${{ inputs.enable-dockerhub }}" == "true" ]; then
          DOCKERHUB_APP="${{ inputs.dockerhub-app-name }}"
          if [ -z "$DOCKERHUB_APP" ]; then
            DOCKERHUB_APP="${{ inputs.app-name }}"
          fi
          IMAGES="${{ inputs.dockerhub-org }}/${DOCKERHUB_APP}"
        fi

        if [ "${{ inputs.enable-ghcr }}" == "true" ]; then
          if [ -n "$IMAGES" ]; then
            IMAGES="${IMAGES},ghcr.io/${GHCR_ORG}/${{ inputs.app-name }}"
          else
            IMAGES="ghcr.io/${GHCR_ORG}/${{ inputs.app-name }}"
          fi
        fi

        echo "images=$IMAGES" >> $GITHUB_OUTPUT

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ steps.image-names.outputs.images }}
        tags: |
          # Exact version only: floating major/minor aliases are incompatible
          # with Docker Hub immutable-tag rules (re-pointing an existing alias
          # is refused and fails the whole build).
          ${{ inputs.raw-tag == '' && format('type=semver,pattern={0},value={1}', '{{version}}', inputs.version) || '' }}
          ${{ inputs.raw-tag != '' && format('type=raw,value={0}', inputs.raw-tag) || '' }}

    - name: Resolve Dockerfile path
      id: dockerfile
      shell: bash
      run: |
        DOCKERFILE="${{ inputs.dockerfile }}"
        if [ -z "$DOCKERFILE" ]; then
          DOCKERFILE="${{ inputs.dockerfile-name }}"
        fi
        echo "path=${{ inputs.working-dir }}/$DOCKERFILE" >> $GITHUB_OUTPUT

    - name: Resolve build secrets
      id: secrets
      shell: bash
      run: |
        NPMRC_SECRET="npmrc=//npm.pkg.github.com/:_authToken=${{ inputs.ghcr-token }}"

        EXTRA_SECRETS='${{ inputs.build-secrets }}'
        if [ -n "$EXTRA_SECRETS" ]; then
          {
            echo "value<<SECRETS_EOF"
            echo "$NPMRC_SECRET"
            echo "$EXTRA_SECRETS"
            echo "SECRETS_EOF"
          } >> $GITHUB_OUTPUT
        else
          {
            echo "value<<SECRETS_EOF"
            echo "$NPMRC_SECRET"
            echo "SECRETS_EOF"
          } >> $GITHUB_OUTPUT
        fi

    # ----------------- Dry Run -----------------
    - name: Dry run summary
      if: ${{ inputs.dry-run == 'true' }}
      shell: bash
      run: |
        echo "::notice::DRY RUN — no images will be pushed"
        echo "  component  : ${{ inputs.app-name }}"
        echo "  dockerfile : ${{ steps.dockerfile.outputs.path }}"
        echo "  context    : ${{ inputs.build-context }}"
        echo "  platforms  : ${{ inputs.platforms }}"
        echo "  tags       : ${{ steps.meta.outputs.tags }}"
        echo "  registries : ${{ steps.image-names.outputs.images }}"

    - name: Build Docker image (dry run)
      if: ${{ inputs.dry-run == 'true' }}
      id: build-dry
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: ${{ inputs.build-context }}
        file: ${{ steps.dockerfile.outputs.path }}
        platforms: linux/amd64
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        secrets: ${{ steps.secrets.outputs.value }}

    # ----------------- Build & Push -----------------
    - name: Build and push Docker image
      if: ${{ inputs.dry-run != 'true' }}
      id: build-push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: ${{ inputs.build-context }}
        file: ${{ steps.dockerfile.outputs.path }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        secrets: ${{ steps.secrets.outputs.value }}
