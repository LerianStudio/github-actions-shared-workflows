name: Socket Firewall
description: Installs Socket Firewall (free edition) and runs the project dependency install through it, blocking malicious packages at install time.

inputs:
  package-manager:
    description: 'Package manager used to install dependencies (npm, yarn, pnpm)'
    required: false
    default: 'npm'
  node-version:
    description: 'Node.js version used for the guarded install'
    required: false
    default: '22'
  working-dir:
    description: 'Directory holding the package.json and lockfile'
    required: false
    default: '.'
  firewall-version:
    description: 'Socket Firewall binary version. Empty or "latest" tracks the newest release.'
    required: false
    default: 'latest'
  job-summary:
    description: "Socket Firewall job summary verbosity (all, errors, none)"
    required: false
    default: 'all'
  use-cache:
    description: 'Cache the Socket Firewall binaries between runs'
    required: false
    default: 'true'
  github-token:
    description: 'Token used by Socket Firewall to download its binaries'
    required: false
    default: ''
  fail-on-block:
    description: 'Fail the step when Socket Firewall blocks a package. Set to false to report the block as a warning instead.'
    required: false
    default: 'true'
  dry-run:
    description: 'Print the resolved configuration and never fail the step'
    required: false
    default: 'false'

outputs:
  skipped:
    description: 'true when no lockfile was found in working-dir, so nothing was installed or inspected'
    value: ${{ steps.guard.outputs.skipped }}
  blocked:
    description: 'true when the install failed and the output carries a Socket Firewall block marker'
    value: ${{ steps.evaluate.outputs.blocked }}
  install-exit-code:
    description: 'Exit code returned by the package manager install'
    value: ${{ steps.install.outputs.exit_code }}
  report-path:
    description: 'Path to the Socket Firewall report JSON produced by the underlying action'
    value: ${{ steps.firewall.outputs.firewall-path-report }}

runs:
  using: composite
  steps:
    # ----------------- Guard -----------------
    - name: Resolve lockfile presence
      id: guard
      shell: bash
      env:
        PKG_MANAGER: ${{ inputs.package-manager }}
        WORKING_DIR: ${{ inputs.working-dir }}
      run: |
        # Without a lockfile there is nothing to install and therefore nothing to
        # inspect. Skipping with a warning keeps monorepos — whose manifests live
        # under a subdirectory — from failing until they set working-dir, instead
        # of turning the check red on a configuration gap.
        case "$PKG_MANAGER" in
          yarn) LOCKFILE='yarn.lock' ;;
          pnpm) LOCKFILE='pnpm-lock.yaml' ;;
          *) LOCKFILE='package-lock.json' ;;
        esac
        echo "lockfile=$LOCKFILE" >> "$GITHUB_OUTPUT"

        if [ -f "$WORKING_DIR/$LOCKFILE" ]; then
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "skipped=true" >> "$GITHUB_OUTPUT"
        echo "::warning::Socket Firewall skipped — no $LOCKFILE found in '$WORKING_DIR'. Point working-dir at the directory holding the lockfile."

    # ----------------- Toolchain -----------------
    - name: Set up pnpm
      if: steps.guard.outputs.skipped != 'true' && inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        package_json_file: ${{ inputs.working-dir }}/package.json

    - name: Setup Node.js
      if: steps.guard.outputs.skipped != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
        # yamllint disable-line rule:line-length
        cache-dependency-path: ${{ inputs.working-dir }}/${{ inputs.package-manager == 'yarn' && 'yarn.lock' || (inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json') }}

    # ----------------- Socket Firewall -----------------
    - name: Dry run summary
      if: steps.guard.outputs.skipped != 'true' && inputs.dry-run == 'true'
      shell: bash
      env:
        PKG_MANAGER: ${{ inputs.package-manager }}
        WORKING_DIR: ${{ inputs.working-dir }}
        FIREWALL_VERSION: ${{ inputs.firewall-version }}
        FAIL_ON_BLOCK: ${{ inputs.fail-on-block }}
      run: |
        echo "::notice::DRY RUN — Socket Firewall runs but never fails the step"
        echo "  package manager  : $PKG_MANAGER"
        echo "  working dir      : $WORKING_DIR"
        echo "  firewall version : $FIREWALL_VERSION"
        echo "  fail on block    : $FAIL_ON_BLOCK (ignored while dry-run is on)"

    - name: Install Socket Firewall
      id: firewall
      if: steps.guard.outputs.skipped != 'true'
      uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free
        firewall-version: ${{ inputs.firewall-version }}
        job-summary: ${{ inputs.job-summary }}
        use-cache: ${{ inputs.use-cache }}
        shims: 'true'
        github-token: ${{ inputs.github-token != '' && inputs.github-token || github.token }}

    # ----------------- Guarded install -----------------
    - name: Install dependencies through Socket Firewall
      id: install
      if: steps.guard.outputs.skipped != 'true'
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      env:
        PKG_MANAGER: ${{ inputs.package-manager }}
      run: |
        # Shims installed by the previous step route the package manager through
        # sfw, so a malicious package makes the install itself exit non-zero.
        # The exit code is captured instead of failing here so the evaluate step
        # can tell a Socket block apart from an ordinary install failure.
        LOG_FILE="$RUNNER_TEMP/socket-firewall-install.log"
        EXIT_CODE=0
        set -o pipefail
        case "$PKG_MANAGER" in
          yarn) yarn install --frozen-lockfile 2>&1 | tee "$LOG_FILE" || EXIT_CODE=$? ;;
          pnpm) pnpm install --frozen-lockfile 2>&1 | tee "$LOG_FILE" || EXIT_CODE=$? ;;
          *) npm ci 2>&1 | tee "$LOG_FILE" || EXIT_CODE=$? ;;
        esac
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        echo "log_file=$LOG_FILE" >> "$GITHUB_OUTPUT"

    - name: Evaluate Socket Firewall result
      id: evaluate
      if: always() && steps.guard.outputs.skipped != 'true'
      shell: bash
      env:
        EXIT_CODE: ${{ steps.install.outputs.exit_code }}
        LOG_FILE: ${{ steps.install.outputs.log_file }}
        PKG_MANAGER: ${{ inputs.package-manager }}
        FAIL_ON_BLOCK: ${{ inputs.fail-on-block }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        # Empty means the install step itself never reached its output write
        # (e.g. working-dir missing) — treat that as a failure, not as success.
        EXIT_CODE="${EXIT_CODE:-1}"
        BLOCKED=false
        # A non-zero install can be either a Socket Firewall block or an ordinary
        # dependency resolution failure. Only the former is governed by
        # fail-on-block; a broken install always fails, since swallowing it would
        # hide a genuine problem behind a security toggle.
        if [ "$EXIT_CODE" -ne 0 ] && [ -f "$LOG_FILE" ]; then
          if grep -qiE 'blocked by socket|socket firewall.*block|sfw.*block|package blocked' "$LOG_FILE"; then
            BLOCKED=true
          fi
        fi
        echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"

        {
          echo "### Socket Firewall"
          echo ""
          echo "| Check | Result |"
          echo "|---|---|"
          echo "| Package manager | \`$PKG_MANAGER\` |"
          echo "| Install exit code | \`$EXIT_CODE\` |"
          if [ "$BLOCKED" = "true" ]; then
            echo "| Verdict | :no_entry: package blocked by Socket Firewall |"
          elif [ "$EXIT_CODE" -ne 0 ]; then
            echo "| Verdict | :x: install failed (not a Socket block) |"
          else
            echo "| Verdict | :white_check_mark: no malicious package detected |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "Socket Firewall allowed every package in the lockfile."
          exit 0
        fi

        if [ "$DRY_RUN" = "true" ]; then
          echo "::warning::Install exited $EXIT_CODE — not failing the step because dry-run is on."
          exit 0
        fi

        if [ "$BLOCKED" = "true" ]; then
          if [ "$FAIL_ON_BLOCK" = "true" ]; then
            echo "::error::Socket Firewall blocked a package during install. Review the Socket Firewall job summary above."
            exit 1
          fi
          echo "::warning::Socket Firewall blocked a package during install (advisory — fail-on-block is false)."
          exit 0
        fi

        echo "::error::Dependency install failed with exit code $EXIT_CODE (no Socket Firewall block detected)."
        exit 1
