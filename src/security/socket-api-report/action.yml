name: Socket API Report
description: Reads the full scan the Socket App already computed and extracts per-package alerts, vulnerabilities and scores for reporting.

inputs:
  socket-api-key:
    description: 'Socket API token. Empty (the default) skips with a notice, so repositories without one are unaffected.'
    required: false
    default: ''
  report-url:
    description: >-
      Socket dashboard URL of the scan to read, as exposed by socket-app-gate
      (https://socket.dev/dashboard/org/<org>/sbom/<full-scan-id>). The org slug and scan id are parsed from it,
      so no new scan is created and the App's own analysis is reused.
    required: false
    default: ''
  org-slug:
    description: 'Socket organization slug. Overrides the value parsed from report-url.'
    required: false
    default: ''
  full-scan-id:
    description: 'Full scan id. Overrides the value parsed from report-url.'
    required: false
    default: ''
  include-actions:
    description: >-
      Comma-separated Socket alert actions to treat as findings. Socket marks the overwhelming majority of alerts
      as "ignore" (capability observations such as envVars or filesystemAccess); on a real tree that is 99% of the
      volume, so reporting unfiltered turns a handful of findings into thousands of lines of noise.
    required: false
    default: 'error,warn,monitor'
  fail-on-actions:
    description: >-
      Comma-separated Socket alert actions that make this a blocking finding. Empty (the default) never blocks —
      the step still exits 0 and reports. Set to e.g. "error" or "error,warn" to own the merge decision here
      instead of deferring it to the Socket App's own verdict.
    required: false
    default: ''
  max-rows:
    description: 'Maximum package rows kept in the findings file, highest severity first'
    required: false
    default: '25'
  findings-file:
    description: 'Path where the extracted findings JSON is written for socket-reporter'
    required: false
    default: 'socket-api-findings.json'
  debug-sample:
    description: 'Log a redacted sample of the NDJSON artifact shape. Useful when adapting to an API change.'
    required: false
    default: 'false'

outputs:
  skipped:
    description: 'true when the report was not produced (no token, or no scan id to read)'
    value: ${{ steps.fetch.outputs.skipped }}
  findings-file:
    description: 'Path to the extracted findings JSON'
    value: ${{ steps.fetch.outputs.findings_file }}
  alert-count:
    description: 'Number of alerts carrying an included policy action'
    value: ${{ steps.fetch.outputs.alert_count }}
  blocking-count:
    description: 'Number of alerts whose action matches fail-on-actions. Zero when fail-on-actions is empty.'
    value: ${{ steps.fetch.outputs.blocking_count }}

runs:
  using: composite
  steps:
    # ----------------- Fetch & extract -----------------
    - name: Read the Socket full scan
      id: fetch
      shell: bash
      env:
        SOCKET_API_KEY: ${{ inputs.socket-api-key }}
        REPORT_URL: ${{ inputs.report-url }}
        ORG_SLUG_IN: ${{ inputs.org-slug }}
        SCAN_ID_IN: ${{ inputs.full-scan-id }}
        MAX_ROWS: ${{ inputs.max-rows }}
        INCLUDE_ACTIONS: ${{ inputs.include-actions }}
        FAIL_ON_ACTIONS: ${{ inputs.fail-on-actions }}
        FINDINGS_FILE: ${{ inputs.findings-file }}
        DEBUG_SAMPLE: ${{ inputs.debug-sample }}
      run: |
        echo "findings_file=$FINDINGS_FILE" >> "$GITHUB_OUTPUT"
        echo '{}' > "$FINDINGS_FILE"

        if [ -z "$SOCKET_API_KEY" ]; then
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          echo "alert_count=0" >> "$GITHUB_OUTPUT"
          echo "blocking_count=0" >> "$GITHUB_OUTPUT"
          echo "::notice::Socket API report skipped — no Socket API token configured."
          exit 0
        fi

        # The dashboard URL the App publishes carries both identifiers:
        #   https://socket.dev/dashboard/org/<org>/sbom/<full-scan-id>
        # Reusing them means reading the scan the App already computed rather than
        # creating a second one: no duplicate analysis, one quota unit.
        ORG="$ORG_SLUG_IN"
        SCAN="$SCAN_ID_IN"
        if [ -z "$ORG" ] || [ -z "$SCAN" ]; then
          [ -z "$ORG" ] && ORG=$(printf '%s' "$REPORT_URL" | sed -n 's#.*/org/\([^/]*\)/.*#\1#p')
          [ -z "$SCAN" ] && SCAN=$(printf '%s' "$REPORT_URL" | sed -n 's#.*/sbom/\([0-9a-fA-F-]*\).*#\1#p')
        fi
        if [ -z "$ORG" ] || [ -z "$SCAN" ]; then
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          echo "alert_count=0" >> "$GITHUB_OUTPUT"
          echo "blocking_count=0" >> "$GITHUB_OUTPUT"
          echo "::warning::Socket API report skipped — could not resolve org/scan id from '$REPORT_URL'."
          exit 0
        fi
        echo "Reading full scan $SCAN for org $ORG"

        # Deliberately not curl. Cloudflare fingerprints the TLS/HTTP client in
        # front of api.socket.dev and answers curl with a managed challenge —
        # HTTP 403, an HTML interstitial and cf-mitigated: challenge — which is
        # indistinguishable from a scope denial by status code alone. Python's
        # stdlib client is not challenged, and it is the same stack the official
        # socket-sdk-python uses. The token is read from the environment, never
        # passed as an argument, so it stays out of the process table.
        NDJSON="$RUNNER_TEMP/socket-full-scan.ndjson"
        META="$RUNNER_TEMP/socket-full-scan.meta"
        SOCKET_URL="https://api.socket.dev/v0/orgs/${ORG}/full-scans/${SCAN}" \
        NDJSON_PATH="$NDJSON" META_PATH="$META" python3 - <<'PYEOF'
        import base64, json, os, urllib.request, urllib.error

        token = os.environ["SOCKET_API_KEY"]
        # Basic auth with the token as the username is the form the official SDK
        # sends; the API also accepts Bearer.
        auth = base64.b64encode(f"{token}:".encode()).decode("ascii")
        req = urllib.request.Request(
            os.environ["SOCKET_URL"],
            headers={
                "Authorization": f"Basic {auth}",
                "User-Agent": "LerianStudio-github-actions-shared-workflows",
                "accept": "application/x-ndjson",
            },
        )
        status, body, mitigated = 0, b"", ""
        try:
            with urllib.request.urlopen(req, timeout=120) as r:
                status, body = r.status, r.read()
                mitigated = r.headers.get("cf-mitigated") or ""
        except urllib.error.HTTPError as e:
            status, body = e.code, e.read()
            mitigated = e.headers.get("cf-mitigated") or ""
        except Exception as e:
            status, body = 0, f"{type(e).__name__}: {e}".encode()

        with open(os.environ["NDJSON_PATH"], "wb") as fh:
            fh.write(body)
        with open(os.environ["META_PATH"], "w") as fh:
            json.dump({"status": status, "cfMitigated": mitigated}, fh)
        PYEOF

        HTTP=$(jq -r '.status' "$META")
        CF_MITIGATED=$(jq -r '.cfMitigated' "$META")

        if [ "$HTTP" != "200" ]; then
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          echo "alert_count=0" >> "$GITHUB_OUTPUT"
          echo "blocking_count=0" >> "$GITHUB_OUTPUT"
          if [ -n "$CF_MITIGATED" ] && [ "$CF_MITIGATED" != "null" ]; then
            echo "::warning::Socket API blocked by a Cloudflare challenge (HTTP $HTTP, cf-mitigated: $CF_MITIGATED)."
            echo "::warning::This is NOT a token or scope problem — the request never reached Socket's API."
            exit 0
          fi
          case "$HTTP" in
            0) HINT="the request did not complete (network or timeout)" ;;
            401) HINT="the token is invalid or revoked" ;;
            403) HINT="the token lacks a required scope (full-scans:list)" ;;
            404) HINT="scan $SCAN not found under org $ORG" ;;
            429) HINT="quota or rate limit exhausted" ;;
            *) HINT="unexpected status" ;;
          esac
          echo "::warning::Socket API returned HTTP $HTTP — $HINT."
          # Print the API's own error payload: the status alone is a guess, the
          # body is where Socket names what is actually wrong.
          if [ -s "$NDJSON" ]; then
            echo "--- Socket API response ---"
            jq . "$NDJSON" 2>/dev/null || head -c 2000 "$NDJSON"
            echo ""
          fi
          # Advisory by construction: this layer informs, the App gate enforces.
          exit 0
        fi

        # Always logged, compactly: the action distribution is what separates a
        # finding from a capability observation, and it is the axis the Socket
        # dashboard filters on. Without it, 4636 raw alerts look like 4636
        # problems when only a fraction carry a policy action.
        echo "--- alert action distribution ---"
        jq -s '[.[] | (.alerts // [])[] | .action] | group_by(.) | map({action: .[0], count: length})' "$NDJSON" 2>/dev/null || true
        echo "--- alert severity distribution ---"
        jq -s '[.[] | (.alerts // [])[] | .severity] | group_by(.) | map({severity: .[0], count: length})' "$NDJSON" 2>/dev/null || true
        echo "--- alert fix shape (first non-null) ---"
        jq -s -c '[.[] | (.alerts // [])[] | .fix | select(. != null)] | .[0]' "$NDJSON" 2>/dev/null || true
        echo "--- alert object keys ---"
        jq -s '[.[] | (.alerts // [])[] | keys] | flatten | unique' "$NDJSON" 2>/dev/null || true

        if [ "$DEBUG_SAMPLE" = "true" ]; then
          echo "--- artifact keys ---"
          head -1 "$NDJSON" | jq -r 'keys | join(", ")' || true
          echo "--- distinct alert object keys ---"
          jq -s '[.[] | (.alerts // [])[] | keys] | flatten | unique' "$NDJSON" 2>/dev/null || true
          echo "--- distinct alert .action values ---"
          jq -s '[.[] | (.alerts // [])[] | .action] | unique' "$NDJSON" 2>/dev/null || true
          echo "--- distinct alert .severity values ---"
          jq -s '[.[] | (.alerts // [])[] | .severity] | unique' "$NDJSON" 2>/dev/null || true
          echo "--- distinct alert .category values ---"
          jq -s '[.[] | (.alerts // [])[] | .category] | unique' "$NDJSON" 2>/dev/null || true
          echo "--- one full alert object ---"
          jq -c 'select((.alerts // []) | length > 0) | .alerts[0]' "$NDJSON" 2>/dev/null | head -1 || true
        fi

        # NDJSON: one artifact per line plus a trailing {"_type":"scores", ...} event.
        # Alert objects carry: action, actionSource, category, severity, type, key,
        # file, start, end, fix. Verified against a real 1897-artifact scan.
        #
        # Two reductions make this readable:
        #  1. Keep only alerts whose action is in include-actions. Socket marks
        #     99% as "ignore" — 4594 of 4636 on the reference scan.
        #  2. Collapse repeats: an alert fires per source location, so one type
        #     recurs hundreds of times for the same package. Group by type and
        #     carry a count plus the first file.
        ACTIONS_JSON=$(printf '%s' "${INCLUDE_ACTIONS:-error,warn,monitor}" \
          | jq -R 'split(",") | map(ascii_downcase | gsub("^\\s+|\\s+$";""))')

        jq -s --argjson maxRows "${MAX_ROWS:-25}" --argjson keepActions "$ACTIONS_JSON" '
          def sevRank(v): {"critical":0,"high":1,"middle":2,"medium":2,"low":3,"info":4}[v // "info"] // 4;
          def actRank(v): {"error":0,"warn":1,"monitor":2}[v // "monitor"] // 3;

          (map(select(._type == "scores")) | last) as $scores
          | (map(select(._type != "scores" and (.name != null)))) as $arts
          | ($arts | map(. + {kept: [(.alerts // [])[] | select((.action // "") | ascii_downcase | IN($keepActions[]))]})) as $withKept
          | ($withKept | map(select((.kept | length) > 0))) as $flagged
          | {
              scanScores: ($scores | if . == null then null else (.score // .scores // .) end),
              artifactCount: ($arts | length),
              alertCountRaw: ($arts | map((.alerts // []) | length) | add // 0),
              includedActions: $keepActions,
              flaggedCount: ($flagged | length),
              alertCount: ($flagged | map(.kept | length) | add // 0),
              alertsByType: (
                $flagged | map(.kept[] | {type: (.type // .key // "unknown"), action: (.action // "")})
                | group_by(.type) | map({type: .[0].type, count: length, action: .[0].action})
                | sort_by(actRank(.action), -.count)
              ),
              packages: (
                $flagged
                | map({
                    name: (if .namespace then "\(.namespace)/\(.name)" else .name end),
                    version: .version,
                    direct: (.direct // false),
                    dev: (.dev // false),
                    overallScore: (.score.overall // null),
                    worstAction: (.kept | map(.action // "monitor") | sort_by(actRank(.)) | first),
                    worstSeverity: (.kept | map(.severity // "info") | sort_by(sevRank(.)) | first),
                    findings: (
                      .kept
                      | group_by(.type // .key)
                      | map({
                          type: (.[0].type // .[0].key // "unknown"),
                          action: (.[0].action // ""),
                          severity: (.[0].severity // null),
                          category: (.[0].category // null),
                          count: length,
                          file: (map(.file) | map(select(. != null)) | first),
                          fix: (map(.fix) | map(select(. != null)) | first)
                        })
                      | sort_by(actRank(.action), sevRank(.severity))
                    )
                  })
                | sort_by(actRank(.worstAction), sevRank(.worstSeverity), -(.findings | length))
                | .[:$maxRows]
              ),
              truncated: (($flagged | length) > $maxRows)
            }' "$NDJSON" > "$FINDINGS_FILE" 2>"$RUNNER_TEMP/socket-jq.err" || {
          # Never fail silently into an empty report: a jq error here previously
          # produced {} and a comment that looked like a clean scan.
          echo "::warning::Could not extract findings from the scan (jq failed)."
          head -c 1000 "$RUNNER_TEMP/socket-jq.err" || true
          echo '{}' > "$FINDINGS_FILE"
        }

        COUNT=$(jq -r '.alertCount // 0' "$FINDINGS_FILE")
        RAW=$(jq -r '.alertCountRaw // 0' "$FINDINGS_FILE")
        FLAGGED=$(jq -r '.flaggedCount // 0' "$FINDINGS_FILE")
        TOTAL=$(jq -r '.artifactCount // 0' "$FINDINGS_FILE")
        echo "skipped=false" >> "$GITHUB_OUTPUT"
        echo "alert_count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "Scan covers $TOTAL artifact(s). Of $RAW raw alerts, $COUNT carry an actioned policy decision across $FLAGGED package(s)."
        jq -r '(.alertsByType // [])[] | "  [\(.action)] \(.count)x \(.type)"' "$FINDINGS_FILE" | head -25 || true

        # Policy decision, owned here rather than inferred from the App's verdict.
        # Deliberately separate from the API-failure paths above: an unreachable
        # API must never look like a finding, so only real findings can block.
        BLOCKING=0
        if [ -n "$FAIL_ON_ACTIONS" ]; then
          FAIL_JSON=$(printf '%s' "$FAIL_ON_ACTIONS" \
            | jq -R 'split(",") | map(ascii_downcase | gsub("^\\s+|\\s+$";""))')
          BLOCKING=$(jq --argjson fail "$FAIL_JSON" '
            [(.packages // [])[] | (.findings // [])[]
             | select((.action // "") | ascii_downcase | IN($fail[]))
             | .count] | add // 0' "$FINDINGS_FILE")
        fi
        echo "blocking_count=$BLOCKING" >> "$GITHUB_OUTPUT"
        if [ "${BLOCKING:-0}" -gt 0 ]; then
          echo "::error::$BLOCKING Socket finding(s) match the blocking policy (fail-on-actions: $FAIL_ON_ACTIONS)."
        fi
