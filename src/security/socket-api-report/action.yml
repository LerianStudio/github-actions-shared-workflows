name: Socket API Report
description: Reads the Socket full scan for this commit and for the target branch, separating findings this pull request introduces from pre-existing tree debt.

inputs:
  socket-api-key:
    description: 'Socket API token. Empty (the default) skips with a notice, so repositories without one are unaffected.'
    required: false
    default: ''
  report-url:
    description: >-
      Socket dashboard URL of the scan to read, as exposed by socket-app-gate
      (https://socket.dev/dashboard/org/<org>/sbom/<full-scan-id>). The org slug and scan id are parsed from it,
      so no new scan is created and the App's own analysis is reused.
    required: false
    default: ''
  org-slug:
    description: 'Socket organization slug. Overrides the value parsed from report-url.'
    required: false
    default: ''
  full-scan-id:
    description: 'Full scan id for this commit. Overrides the value parsed from report-url.'
    required: false
    default: ''
  base-branch:
    description: >-
      Target branch of the pull request. Its most recent full scan becomes the baseline, so findings already present
      there are reported as pre-existing rather than as something this pull request introduced. Empty skips the
      comparison, and everything is then reported as pre-existing.
    required: false
    default: ''
  include-actions:
    description: >-
      Comma-separated Socket alert actions to treat as findings. Socket marks roughly 99% of alerts as "ignore"
      (capability observations such as envVars or filesystemAccess), so reporting unfiltered buries a handful of
      findings in thousands of lines.
    required: false
    default: 'error,warn,monitor'
  fail-on-actions:
    description: >-
      Comma-separated actions that make an **introduced** finding blocking. Pre-existing findings never block:
      gating a pull request on inherited debt fails every pull request for something none of them caused, and
      guarantees the gate gets switched off. Empty (the default) blocks nothing.
    required: false
    default: ''
  max-rows:
    description: 'Maximum package rows kept per section, highest action first'
    required: false
    default: '25'
  findings-file:
    description: 'Path where the extracted findings JSON is written for socket-reporter'
    required: false
    default: 'socket-api-findings.json'
  debug-sample:
    description: 'Log the alert object shape. Useful when adapting to an API change.'
    required: false
    default: 'false'

outputs:
  skipped:
    description: 'true when no report was produced (no token, no resolvable scan, or an API error)'
    value: ${{ steps.fetch.outputs.skipped }}
  findings-file:
    description: 'Path to the extracted findings JSON'
    value: ${{ steps.fetch.outputs.findings_file }}
  introduced-count:
    description: 'Number of actioned findings this pull request introduces'
    value: ${{ steps.fetch.outputs.introduced_count }}
  preexisting-count:
    description: 'Number of actioned findings already present on the target branch'
    value: ${{ steps.fetch.outputs.preexisting_count }}
  blocking-count:
    description: 'Introduced findings whose action matches fail-on-actions. Zero when fail-on-actions is empty.'
    value: ${{ steps.fetch.outputs.blocking_count }}

runs:
  using: composite
  steps:
    # ----------------- Fetch, classify & extract -----------------
    - name: Read Socket scans and classify findings
      id: fetch
      shell: bash
      env:
        SOCKET_API_KEY: ${{ inputs.socket-api-key }}
        REPORT_URL: ${{ inputs.report-url }}
        ORG_SLUG_IN: ${{ inputs.org-slug }}
        SCAN_ID_IN: ${{ inputs.full-scan-id }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        INCLUDE_ACTIONS: ${{ inputs.include-actions }}
        FAIL_ON_ACTIONS: ${{ inputs.fail-on-actions }}
        MAX_ROWS: ${{ inputs.max-rows }}
        FINDINGS_FILE: ${{ inputs.findings-file }}
        DEBUG_SAMPLE: ${{ inputs.debug-sample }}
      run: |
        echo "findings_file=$FINDINGS_FILE" >> "$GITHUB_OUTPUT"
        echo '{}' > "$FINDINGS_FILE"

        # Deliberately python, not curl. Cloudflare fingerprints the HTTP client
        # in front of api.socket.dev and answers curl with a managed challenge —
        # 403, an HTML interstitial, cf-mitigated: challenge — regardless of
        # credentials, headers, auth form, endpoint or egress. Python's stdlib
        # client is not challenged; it is the stack the official SDK uses, and the
        # reason sfw reaches Socket from the very runner where curl is blocked.
        python3 - <<'PYEOF'
        import base64, json, os, sys, urllib.parse, urllib.request, urllib.error

        API = "https://api.socket.dev/v0"
        out_path = os.environ["FINDINGS_FILE"]

        def emit(**kv):
            with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                for k, v in kv.items():
                    fh.write(f"{k}={v}\n")

        def bail(msg, level="notice"):
            print(f"::{level}::{msg}")
            emit(skipped="true", introduced_count=0, preexisting_count=0, blocking_count=0)
            sys.exit(0)

        token = os.environ.get("SOCKET_API_KEY", "")
        if not token:
            bail("Socket API report skipped — no Socket API token configured.")

        report_url = os.environ.get("REPORT_URL", "")
        org = os.environ.get("ORG_SLUG_IN") or ""
        scan = os.environ.get("SCAN_ID_IN") or ""
        if not org or not scan:
            # The dashboard URL the App publishes carries both identifiers, so the
            # scan it already computed is reused rather than creating a second one.
            parts = urllib.parse.urlparse(report_url).path.strip("/").split("/")
            for marker, target in (("org", "org"), ("sbom", "scan")):
                if marker in parts:
                    i = parts.index(marker)
                    val = parts[i + 1] if len(parts) > i + 1 else ""
                    if target == "org" and not org:
                        org = val
                    elif target == "scan" and not scan:
                        scan = val
        if not org or not scan:
            bail(f"Socket API report skipped — could not resolve org/scan id from '{report_url}'.", "warning")

        auth = base64.b64encode(f"{token}:".encode()).decode("ascii")
        HEADERS = {
            "Authorization": f"Basic {auth}",
            "User-Agent": "LerianStudio-github-actions-shared-workflows",
            "accept": "application/x-ndjson",
        }

        def get(path):
            req = urllib.request.Request(f"{API}/{path}", headers=HEADERS)
            try:
                with urllib.request.urlopen(req, timeout=180) as r:
                    return r.status, r.read(), (r.headers.get("cf-mitigated") or "")
            except urllib.error.HTTPError as e:
                return e.code, e.read(), (e.headers.get("cf-mitigated") or "")
            except Exception as e:
                return 0, f"{type(e).__name__}: {e}".encode(), ""

        def explain(status, body, mitigated):
            if mitigated:
                print(f"::warning::Socket API blocked by a Cloudflare challenge (HTTP {status}, cf-mitigated: {mitigated}).")
                print("::warning::This is NOT a token or scope problem — the request never reached Socket's API.")
                return
            hint = {
                0: "the request did not complete (network or timeout)",
                401: "the token is invalid or revoked",
                403: "the token lacks the full-scans:list scope",
                404: "not found",
                429: "quota or rate limit exhausted",
            }.get(status, "unexpected status")
            print(f"::warning::Socket API returned HTTP {status} — {hint}.")
            # The status alone is a guess; the body is where Socket says what is wrong.
            print("--- Socket API response ---")
            print(body[:1000].decode("utf-8", "replace"))

        keep = {a.strip().lower() for a in os.environ.get("INCLUDE_ACTIONS", "").split(",") if a.strip()} \
               or {"error", "warn", "monitor"}
        fail_on = {a.strip().lower() for a in os.environ.get("FAIL_ON_ACTIONS", "").split(",") if a.strip()}
        max_rows = int(os.environ.get("MAX_ROWS") or 25)

        def parse_scan(raw):
            """NDJSON: one artifact per line plus a trailing {"_type":"scores"} event."""
            arts, scores = [], None
            for line in raw.decode("utf-8", "replace").splitlines():
                line = line.strip()
                if not line:
                    continue
                try:
                    obj = json.loads(line)
                except json.JSONDecodeError:
                    continue
                if obj.get("_type") == "scores":
                    scores = obj.get("score") or obj.get("scores") or obj
                elif obj.get("name"):
                    arts.append(obj)
            return arts, scores

        def pkg_name(art):
            ns = art.get("namespace")
            return f"{ns}/{art['name']}" if ns else art.get("name")

        status, body, mitigated = get(f"orgs/{org}/full-scans/{scan}")
        if status != 200:
            explain(status, body, mitigated)
            # Advisory by construction: an unreachable API must never look like a
            # finding, so every failure path reports zero and exits 0.
            emit(skipped="true", introduced_count=0, preexisting_count=0, blocking_count=0)
            sys.exit(0)
        head_arts, head_scores = parse_scan(body)

        if os.environ.get("DEBUG_SAMPLE") == "true":
            alerts = [a for art in head_arts for a in (art.get("alerts") or [])]
            print("--- alert keys ---", sorted({k for a in alerts for k in a}))
            print("--- first fix ---", json.dumps(next((a["fix"] for a in alerts if a.get("fix")), None))[:400])

        # Baseline: the most recent scan of the target branch. Without it every
        # finding would read as introduced by this pull request, which on a repo
        # carrying pre-existing debt means blocking every pull request.
        base_keys, base_scan_id, base_meta = set(), None, {}
        base_branch = os.environ.get("BASE_BRANCH") or ""
        if base_branch:
            q = urllib.parse.urlencode({"branch": base_branch, "sort": "created_at",
                                        "direction": "desc", "per_page": 1})
            st, bd, mit = get(f"orgs/{org}/full-scans?{q}")
            if st == 200:
                try:
                    results = json.loads(bd.decode("utf-8", "replace")).get("results") or []
                    base_meta = (results[0] or {}) if results else {}
                    base_scan_id = base_meta.get("id")
                    print(f"Baseline candidates on '{base_branch}': {len(results)}.")
                except json.JSONDecodeError:
                    base_scan_id, base_meta = None, {}
            else:
                explain(st, bd, mit)
            if base_scan_id and base_scan_id != scan:
                st, bd, mit = get(f"orgs/{org}/full-scans/{base_scan_id}")
                if st == 200:
                    base_arts, _ = parse_scan(bd)
                    for art in base_arts:
                        key_pkg = f"{pkg_name(art)}@{art.get('version')}"
                        for a in art.get("alerts") or []:
                            base_keys.add((key_pkg, a.get("type") or a.get("key") or "unknown"))
                    # A baseline much smaller than the head scan means the
                    # comparison is against an unrelated or incomplete scan, and
                    # everything will look introduced. Surface it rather than
                    # reporting a confident but wrong split.
                    print(f"Baseline scan {base_scan_id} ({base_meta.get('created_at','?')}, "
                          f"commit {str(base_meta.get('commit_hash'))[:7]}, "
                          f"state {base_meta.get('scan_state','?')}): "
                          f"{len(base_arts)} artifact(s), {len(base_keys)} alert key(s).")
                    if len(base_arts) < len(head_arts) * 0.5:
                        print(f"::warning::Baseline has {len(base_arts)} artifacts against "
                              f"{len(head_arts)} in the head scan — the comparison is unreliable.")
                else:
                    explain(st, bd, mit)

        has_baseline = bool(base_keys)
        if not has_baseline:
            print("::warning::No baseline scan for the target branch — every finding is reported as "
                  "pre-existing, and nothing is attributed to this pull request.")

        ACT_RANK = {"error": 0, "warn": 1, "monitor": 2}
        SEV_RANK = {"critical": 0, "high": 1, "middle": 2, "medium": 2, "low": 3, "info": 4}

        introduced, preexisting, raw_alerts = [], [], 0
        for art in head_arts:
            raw_alerts += len(art.get("alerts") or [])
            name = pkg_name(art)
            key_pkg = f"{name}@{art.get('version')}"
            kept = [a for a in (art.get("alerts") or []) if (a.get("action") or "").lower() in keep]
            if not kept:
                continue

            # Collapse repeats: an alert fires per source location, so one type
            # recurs many times for the same package. Rendering them raw produced
            # the same envVars hundreds of times in a single table cell.
            by_type = {}
            for a in kept:
                t = a.get("type") or a.get("key") or "unknown"
                e = by_type.setdefault(t, {"type": t, "action": a.get("action") or "",
                                           "severity": a.get("severity"), "count": 0,
                                           "file": None, "fix": None})
                e["count"] += 1
                e["file"] = e["file"] or a.get("file")
                e["fix"] = e["fix"] or a.get("fix")

            # A finding counts as introduced when this package@version did not
            # already carry that alert type on the target branch. A version bump
            # therefore makes the package new, which is the conservative reading.
            for is_new in (True, False):
                sel = [e for t, e in by_type.items()
                       if has_baseline and (((key_pkg, t) not in base_keys) == is_new)]
                if not has_baseline:
                    sel = list(by_type.values()) if not is_new else []
                if not sel:
                    continue
                sel.sort(key=lambda e: (ACT_RANK.get((e["action"] or "").lower(), 3),
                                        SEV_RANK.get((e["severity"] or "info").lower(), 4)))
                (introduced if is_new else preexisting).append({
                    "name": name, "version": art.get("version"),
                    "direct": bool(art.get("direct")), "dev": bool(art.get("dev")),
                    "overallScore": (art.get("score") or {}).get("overall"),
                    "worstAction": sel[0]["action"], "worstSeverity": sel[0]["severity"],
                    "findings": sel,
                })

        def rank(rows):
            rows.sort(key=lambda r: (ACT_RANK.get((r["worstAction"] or "").lower(), 3),
                                     SEV_RANK.get((r["worstSeverity"] or "info").lower(), 4),
                                     -len(r["findings"])))
            return rows

        introduced, preexisting = rank(introduced), rank(preexisting)
        n_intro = sum(f["count"] for r in introduced for f in r["findings"])
        n_pre = sum(f["count"] for r in preexisting for f in r["findings"])
        # Only introduced findings can block.
        blocking = sum(f["count"] for r in introduced for f in r["findings"]
                       if (f["action"] or "").lower() in fail_on) if fail_on else 0

        by_type = {}
        for r in introduced + preexisting:
            for f in r["findings"]:
                e = by_type.setdefault(f["type"], {"type": f["type"], "action": f["action"], "count": 0})
                e["count"] += f["count"]
        alerts_by_type = sorted(by_type.values(),
                                key=lambda e: (ACT_RANK.get((e["action"] or "").lower(), 3), -e["count"]))

        with open(out_path, "w") as fh:
            json.dump({
                "scanScores": head_scores,
                "artifactCount": len(head_arts),
                "alertCountRaw": raw_alerts,
                "includedActions": sorted(keep),
                "baseBranch": base_branch,
                "baseScanId": base_scan_id,
                "hasBaseline": has_baseline,
                "introducedCount": n_intro,
                "preexistingCount": n_pre,
                "alertsByType": alerts_by_type,
                "introduced": introduced[:max_rows],
                "preexisting": preexisting[:max_rows],
                "introducedTruncated": len(introduced) > max_rows,
                "preexistingTruncated": len(preexisting) > max_rows,
            }, fh)

        emit(skipped="false", introduced_count=n_intro,
             preexisting_count=n_pre, blocking_count=blocking)

        print(f"Scan {scan}: {len(head_arts)} artifact(s), {raw_alerts} raw alert(s).")
        print(f"  actioned: {n_intro} introduced by this PR, {n_pre} pre-existing on "
              f"'{base_branch or '<no baseline>'}'.")
        for e in alerts_by_type[:25]:
            print(f"  [{e['action']}] {e['count']}x {e['type']}")
        if blocking:
            print(f"::error::{blocking} introduced finding(s) match the blocking policy "
                  f"(fail-on-actions: {os.environ.get('FAIL_ON_ACTIONS')}).")
        PYEOF
