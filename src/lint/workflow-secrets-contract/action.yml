name: Workflow Secrets Contract Lint
description: Fail when a local workflow call relies on secrets inheritance, or forwards less than the called workflow declares.

inputs:
  workflows-dir:
    description: Directory holding the workflows to inspect.
    required: false
    default: .github/workflows

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        if ! python3 -c "import yaml" 2>/dev/null; then
          sudo apt-get install -y --no-install-recommends python3-yaml
        fi

    - name: Validate the secrets contract of local workflow calls
      shell: bash
      env:
        WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
      run: |
        python3 - <<'PYEOF'
        import glob, os, re, sys, yaml

        workflows_dir = os.environ.get('WORKFLOWS_DIR', '.github/workflows')
        violations = 0

        def err(filepath, line, msg):
            global violations
            print(f'::error file={filepath},line={line}::{msg}')
            violations += 1

        def declared(name):
            """Secrets a workflow accepts through workflow_call, or None when it is unreadable."""
            path = os.path.join(workflows_dir, f'{name}.yml')
            if not os.path.isfile(path):
                return None
            try:
                with open(path) as f:
                    data = yaml.safe_load(f)
            except Exception:
                return None
            if not isinstance(data, dict):
                return None
            # PyYAML reads the `on:` key as the boolean True.
            trigger = data.get('on', data.get(True))
            if not isinstance(trigger, dict):
                return None
            call = trigger.get('workflow_call')
            if not isinstance(call, dict):
                return None
            return list((call.get('secrets') or {}))

        USES_RE = re.compile(r'^(\s*)uses:\s*\./' + re.escape(workflows_dir) + r'/([a-z0-9-]+)\.ya?ml\s*$')
        KEY_RE  = re.compile(r'^\s*([A-Za-z0-9_-]+):')

        for filepath in sorted(glob.glob(os.path.join(workflows_dir, '*.yml'))):
            with open(filepath) as f:
                lines = f.read().split('\n')

            for i, line in enumerate(lines):
                match = USES_RE.match(line)
                if not match:
                    continue
                callee = match.group(2)
                base   = len(match.group(1))

                accepts = declared(callee)
                if not accepts:
                    # Either the callee is unreadable, or it declares no secrets
                    # and therefore depends on inheritance by construction. Not
                    # this check's business — it only polices declared contracts.
                    continue

                # Walk the rest of the job's `uses:` block looking for its secrets.
                j = i + 1
                while j < len(lines):
                    stripped = lines[j].strip()
                    if stripped and (len(lines[j]) - len(lines[j].lstrip())) < base:
                        break
                    if stripped == 'secrets: inherit':
                        err(filepath, j + 1,
                            f'`{callee}` declares a secrets contract ({", ".join(accepts)}), '
                            f'so it must be forwarded by name — `inherit` hands it every secret '
                            f'the caller repository holds.')
                        break
                    if stripped == 'secrets:':
                        indent = len(lines[j]) - len(lines[j].lstrip())
                        passed = set()
                        k = j + 1
                        while k < len(lines) and lines[k].strip() \
                                and (len(lines[k]) - len(lines[k].lstrip())) > indent:
                            key = KEY_RE.match(lines[k])
                            if key:
                                passed.add(key.group(1))
                            k += 1
                        missing = [s for s in accepts if s not in passed]
                        if missing:
                            err(filepath, j + 1,
                                f'`{callee}` declares {", ".join(missing)}, which this call does not '
                                f'forward. An unforwarded secret resolves to an empty string: the job '
                                f'runs and the feature it guards silently does nothing.')
                        break
                    j += 1

        if violations > 0:
            print(f'::error::Found {violations} workflow secrets contract violation(s).')
            sys.exit(1)

        print('Every local workflow call forwards the full secrets contract of the workflow it calls.')
        PYEOF
