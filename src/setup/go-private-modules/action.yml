name: Fetch Private Go Modules
description: Populates the Go module cache with private modules using a credential confined to this action, so nothing that runs afterwards shares the filesystem with the token.

inputs:
  go-private-modules:
    description: 'GOPRIVATE pattern for private Go modules (e.g. github.com/LerianStudio/*). Empty skips the prefetch entirely.'
    required: false
    default: ''
  manage-token:
    description: 'Token authorised to read the private modules. Only ever reaches the runner through a git config file under RUNNER_TEMP, deleted when the step ends.'
    required: false
    default: ''
  working-dir:
    description: 'Directory the targets will run from. Modules at or below it are prefetched, as is the module enclosing it when the directory is not a module root.'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    # The credential is confined to this step: it is written to a git config
    # file under RUNNER_TEMP, used only to populate the module cache, and
    # removed before any code from the pull request runs. Every caller job
    # reaches the branch's Makefile sooner or later, and `make -n` is not the
    # escape hatch it looks like: GNU make expands `$(shell ...)` while
    # parsing, so a probe run alone is enough for the Makefile to read
    # whatever the job still holds. MANAGE_TOKEN goes through env rather than
    # being interpolated into the script text: an interpolated secret is not
    # masked if the shell traces the command, and it is what CodeQL/zizmor
    # flag as template-injection.
    - name: Fetch private Go modules
      if: inputs.go-private-modules != ''
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      env:
        GOPRIVATE: ${{ inputs.go-private-modules }}
        MANAGE_TOKEN: ${{ inputs.manage-token }}
      run: |
        set -euo pipefail
        export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-private-modules"
        trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
        git config --file "$GIT_CONFIG_GLOBAL" \
          url."https://${MANAGE_TOKEN}@github.com/".insteadOf "https://github.com/"
        # Every module at or below the working directory, not just a go.mod at
        # its root: a Makefile target may drive nested modules or a workspace,
        # and once this step ends there is no credential left to fetch with.
        # The pruned directories are the ones the Go tool itself never walks,
        # so nothing a target can build lives there — but fixtures do, and a
        # deliberately broken one must not decide whether this job runs.
        mapfile -t MODULES < <(
          find . -mindepth 1 \
            \( -name vendor -o -name testdata -o -name '.*' -o -name '_*' \) -prune \
            -o -name go.mod -print | sort
        )
        # The working directory may sit INSIDE a module rooted above it: a
        # repository whose go.mod is at the root and whose apps live under
        # components/<app>, each a package of that one module. The targets
        # about to run resolve that enclosing module whatever lies below the
        # working directory, and once this step ends there is no credential
        # left to fetch with. So when the working directory is not a module
        # root itself, the nearest go.mod up to the workspace root is the
        # module being analysed, prefetched beside anything nested, and a
        # failure there is fatal like one at the working directory itself.
        #
        # The walk is bounded by a prefix test on paths both resolved with
        # `pwd -P`, not by string equality against GITHUB_WORKSPACE: a
        # symlinked workspace, or a self-hosted runner that spells the path
        # differently, would never match the equality and the walk would climb
        # past the repository looking for a go.mod that is none of our
        # business. Outside a runner GITHUB_WORKSPACE is unset, so the ceiling
        # falls back to the git worktree root and, failing that, to no walk at
        # all — running this logic locally or under `act` must not abort it.
        CEILING="${GITHUB_WORKSPACE:-}"
        if [[ -z "$CEILING" ]]; then
          CEILING="$(git rev-parse --show-toplevel 2>/dev/null || true)"
        fi
        if [[ -n "$CEILING" && -d "$CEILING" ]]; then
          CEILING="$(cd "$CEILING" && pwd -P)"
        else
          CEILING=""
        fi
        ENCLOSING=""
        if [[ ! -f ./go.mod ]]; then
          dir="$(pwd -P)"
          while [[ -n "$CEILING" && "$dir" == "$CEILING"/* ]]; do
            dir="$(dirname "$dir")"
            if [[ -f "$dir/go.mod" ]]; then
              ENCLOSING="$dir/go.mod"
              MODULES+=("$ENCLOSING")
              break
            fi
          done
        fi
        if [[ ${#MODULES[@]} -eq 0 ]]; then
          echo "::notice::No go.mod under $PWD, nor enclosing it; nothing to prefetch."
        fi
        for module in "${MODULES[@]}"; do
          dir="$(dirname "$module")"
          echo "::group::go mod download in $dir"
          if (cd "$dir" && go mod download); then
            echo "::endgroup::"
          elif [[ "$dir" == "." || "$module" == "$ENCLOSING" ]]; then
            # The module being analysed: nothing downstream can succeed.
            echo "::endgroup::"
            echo "::error::Could not prefetch the module at $(cd "$dir" && pwd -P)."
            exit 1
          else
            # A nested module may be unbuildable on purpose. If a target does
            # need it, that target fails with its own error, which says more
            # than this step could.
            echo "::endgroup::"
            echo "::warning::Could not prefetch the nested module at $dir; continuing."
          fi
        done
