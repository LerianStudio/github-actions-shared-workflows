language: "en-US"

tone_instructions: >
  Be direct and technical. Focus on correctness, security, and maintainability.
  Flag breaking changes to callers explicitly. Skip praise for routine changes.

early_access: false

reviews:
  profile: "assertive"

  # Off because these are NOT governed by the review gate. CodeRabbit regenerates
  # the summary on every push even with `auto_review.enabled: false` — on PR #708
  # the summary comment's `updated_at` matched the push second for second, while
  # the PR carried no `review-ready` label and received no review. That is work
  # spent on pull requests the gate deliberately left unreviewed.
  high_level_summary: false
  high_level_summary_in_walkthrough: false

  # Kept on: this is what posts "Review skipped — required labels: review-ready",
  # which is the cheapest way to confirm the gate is behaving as intended.
  review_status: true
  review_details: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false

  poem: false

  suggested_labels: true
  auto_apply_labels: false

  suggested_reviewers: true
  auto_assign_reviewers: false

  request_changes_workflow: true

  abort_on_close: true

  path_filters:
    - "!CHANGELOG.md"
    - "!.releaserc.yml"

  path_instructions:
    - path: ".github/workflows/self-*.yml"
      instructions: |
        This is a self-use entrypoint for this repository — NOT a reusable workflow.
        Do NOT flag missing `workflow_call` — these files intentionally omit it.
        `dry_run` is not required; flag it only if it is marked `required: true` or lacks a default value.
        When `dry_run` is present it must be: type boolean, required false, default true for destructive operations (delete, purge) or default false for non-destructive ones (sync, notify).
        Must call the corresponding reusable workflow via local path and contain no business logic.

    - path: ".github/workflows/*.yml"
      instructions: |
        This is a reusable workflow in a shared CI/CD library. Repo-specific rules:
        - Both `workflow_call` and `workflow_dispatch` must be present (except self-* files)
        - Workflows that apply state changes must have a `dry_run` boolean input (default: false)
        - Composites must use local path only: `./src/<capability>/<name>` — never an external ref
        - A `docs/<filename>.md` matching this workflow's name must exist or be added in this PR
        - Flag any removed or renamed input/output as a breaking change for callers

    - path: "src/**/action.yml"
      instructions: |
        This is a composite action in a shared CI/CD library. Repo-specific rules:
        - Max 15 steps — flag if exceeded
        - Single responsibility only — no multi-language runtimes, no job definitions
        - Flag any removed, renamed, or retyped input/output as a breaking change for callers
        - Flag any default value change as a potentially breaking change

    - path: "src/**/README.md"
      instructions: |
        Composite action README. Verify inputs table matches `action.yml` exactly (name, required, default).
        Flag any usage example that references `@main` — examples must use `@develop` or `@feat/<branch>` for testing and `@vX.Y.Z` for production.

    - path: "docs/*.md"
      instructions: |
        Workflow documentation. Filename must exactly match the workflow file (e.g., `go-ci.yml` → `docs/go-ci.md`).
        Flag if inputs table is out of sync with the corresponding workflow changes in this PR.
        Flag any usage example that references `@main` — examples must use `@develop` or `@feat/<branch>` for testing and `@vX.Y.Z` for production.

  auto_review:
    # `enabled: false` inverts the default to "do not review": nothing is reviewed
    # unless `review-ready` is on the PR. That label is applied by the
    # `gate-coderabbit` job in `Self — PR Validation`, once every required check
    # has passed and the PR is within the configured review scope — so no review
    # is ever spent on a PR that is failing or out of scope.
    #
    # The gate is the single owner of that decision. Do not add exclusion rules
    # here expecting them to restrict anything: a negative label match does not
    # veto the positive trigger under `enabled: false`. PR #705 demonstrated it —
    # a release PR carried `skip-coderabbit` for over two minutes before
    # `review-ready` arrived, and was reviewed five minutes after that. Any such
    # rule is also inert in the common case, since a PR that never receives
    # `review-ready` is already excluded by the inverted default.
    #
    # `base_branches` is REQUIRED, and is not made redundant by `enabled: false`.
    # It is a separate filter: a pull request is reviewed only when its base is
    # eligible AND the trigger label is present. Left absent, the eligible set
    # falls back to the default branch alone (main), and every pull request into
    # develop is refused with "reviews are disabled for this base branch" —
    # exactly what happened on PR #712 after #708 removed this key. It must list
    # every base the gate is allowed to release on, mirroring
    # `review_base_branches` in Self — PR Validation.
    #
    # To review an out-of-scope PR anyway, add `review-ready` by hand or comment
    # `@coderabbitai review`.
    enabled: false
    drafts: false
    # Must cover every base the gate may release on. `main` is always eligible as
    # the default branch; develop has to be named explicitly.
    base_branches:
      - "develop"
    labels:
      - "review-ready"
    ignore_title_keywords:
      - "WIP"
      - "wip"
      - "[skip review]"
    auto_pause_after_reviewed_commits: 0

chat:
  auto_reply: true
